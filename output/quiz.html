in?", "opts": ["light", "sky", "guide of souls", "destructive winds"], "ans": "sky", "exp": "Uranus governs: sky.", "ref": "ch.3"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Spermo?", "opts": ["guide", "who goes by many names", "Seed Girl", "eldest of the daughters of Clymenus"], "ans": "Seed Girl", "exp": "Spermo is known by the epithet 'Seed Girl'.", "ref": "ch.11"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Deïanira", "Dionysus", "Hephaestus", "Nemesis", "Graces", "Hecuba"], "right": ["Gratiae", "Rhamnusia", "Bacchus", "Hekabe", "Deianira", "Vulcan"], "ans": {"Deïanira": "Deianira", "Dionysus": "Bacchus", "Hephaestus": "Vulcan", "Nemesis": "Rhamnusia", "Graces": "Gratiae", "Hecuba": "Hekabe"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Deïanira = Deianira, Dionysus = Bacchus, Hephaestus = Vulcan, Nemesis = Rhamnusia, Graces = Gratiae, Hecuba = Hekabe.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Geryon?", "opts": ["Enki", "Asphaleios", "triple-bodied", "august"], "ans": "triple-bodied", "exp": "Geryon is known by the epithet 'triple-bodied'.", "ref": "ch.7"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Wounding of Aphrodite (Diomedes wounds Aphrodite in battle;...), Dione was the opponent of Aphrodite.", "ans": false, "exp": "Incorrect. In the myth of the Wounding of Aphrodite, Diomedes wounds Aphrodite in battle; she returns to Olympus and is comforted by her mother Dione. Dione is Aphrodite's mother, not her opponent.", "ref": "ch.19 p.478", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Death is the god/goddess of underworld.", "ans": false, "exp": "No, Death (Thanatos) is the personification of death, not the god of the underworld. The underworld is ruled by Hades (or Pluto).", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Jupiter is the god/goddess of king of gods.", "ans": true, "exp": "True. Jupiter (Zeus) is the king of the gods and rules over the sky, thunder, and kingship. In the myth of Apollo and Daphne, Jupiter is Apollo's father.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Deïanira?", "ans": "Deianira", "exp": "The Roman equivalent of Deïanira is Deianira. In the Calydonian Boar Hunt, Deianira is the wife of Heracles and later causes his death.", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Titans (Gaia and Uranus produce twelve Titans:...), Uranus was the parent of Oceanus.", "ans": true, "exp": "True. In the Birth of the Titans, Uranus (Sky) and Gaia (Earth) are the parents of Oceanus, one of the twelve Titans.", "ref": "ch.3 p.63", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Laodamia?", "opts": ["Bellerophon", "Pelopia", "Christ", "Omphale"], "ans": "Bellerophon", "exp": "Laodamia was the daughter of Bellerophon, as recounted in various sources. She is best known as the wife of Protesilaüs, who died at Troy.", "ref": "ch.19 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Eris", "Isis", "Persuasion", "Lyssa", "Tisiphone", "Boreas"], "right": ["discord", "persuasion", "madness", "Vengeance", "North Wind", "fertility"], "ans": {"Eris": "discord", "Isis": "fertility", "Persuasion": "persuasion", "Lyssa": "madness", "Tisiphone": "Vengeance", "Boreas": "North Wind"}, "exp": "Each god or goddess governs specific domains in Greek mythology: Eris is discord, Isis is fertility (though Egyptian, often syncretized), Persuasion is persuasion, Lyssa is madness, Tisiphone is vengeance, and Boreas is the North Wind.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Hyllus?", "ans": "Heracles", "exp": "Hyllus is the son of Heracles and Deianira. He played a key role in the myth of Heracles' death, carrying out his father's final wishes.", "ref": "ch.22 p.569", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Orestes (Euripides' play set after...), Hermione was the killer of Clytemnestra.", "ans": false, "exp": "Incorrect. In the myth of Orestes (Euripides' play set after Clytemnestra's murder), Orestes murders Clytemnestra, not Hermione. Hermione is the daughter of Helen and Menelaüs.", "ref": "ch.18 p.443", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Hours is the god/goddess of which domain?", "opts": ["order", "day", "state", "running on water"], "ans": "order", "exp": "Hours governs: order, seasons, time, vegetation.", "ref": "ch.5"}, {"t": "mc", "cat": "Domain", "q": "Muses is the god/goddess of which domain?", "opts": ["arts", "lyric poetry", "virtue", "ocean stream encircling earth"], "ans": "arts", "exp": "Muses governs: arts, dance, inspiration, literature, music, poetry, song.", "ref": "ch.3"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Callirhoë?", "opts": ["Oceanid", "rich", "winning in cleverness", "Eros"], "ans": "Oceanid", "exp": "Callirhoë is known by the epithet 'Oceanid'.", "ref": "ch.7"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Bull of Marathon (Theseus captures the bull of Marathon...), Heracles was the child of Zeus.", "ans": true, "exp": "Heracles is son of Zeus.", "ref": "ch.19 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Daughters of Anius (Anius, king of Delos, had three...), who opposed Agamemnon?", "opts": ["Oeno", "Elaïs", "Spermo", "Anius"], "ans": "Oeno", "exp": "Agamemnon attempted to compel Oeno to go to Troy.", "ref": "ch.251", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Odyssey (The epic poem by Homer recounting the...), Ageläus was the child of Odysseus.", "ans": false, "exp": "Incorrect. In the myth of Odyssey, Telemachus is son of Odysseus.", "ref": "ch.19 p.480", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Leucothea", "Poseidon", "Eirene", "Hymen", "Necessity", "Demeter"], "right": ["necessity", "agriculture", "marriage", "peace", "earthquakes", "sea"], "ans": {"Leucothea": "sea", "Poseidon": "earthquakes", "Eirene": "peace", "Hymen": "marriage", "Necessity": "necessity", "Demeter": "agriculture"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Leucothea is a sea goddess, Poseidon is god of earthquakes and the sea, Eirene is the personification of peace, Hymen is the god of marriage, Necessity is the personification of necessity, and Demeter is the goddess of agriculture.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Apollo is the god/goddess of seasons.", "ans": false, "exp": "No, Apollo is the god of archery, healing, justice, knowledge, music, plague, prophecy, sudden death of young men, and the sun. The goddess of seasons is the Horae, not Apollo. In the myth of Apollo and Daphne, Apollo's pursuit of Daphne is his first love story in Ovid's Metamorphoses, but it does not involve seasons.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Amycus (The Argonauts encounter the Bebryces...), who killed Amycus?", "opts": ["Telamon", "Castor", "Polydeuces", "Orpheus"], "ans": "Polydeuces", "exp": "In the myth of Amycus, the Argonauts encounter the Bebryces and their king Amycus, a son of Poseidon who forces strangers to box. Polydeuces, a skilled boxer, fought and killed Amycus in a boxing match. Telamon was an Argonaut but did not fight Amycus; Castor was Polydeuces' twin but not the one who fought; Orpheus was a musician.", "ref": "ch.612", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cassandra?", "ans": "Priam", "exp": "Cassandra is the daughter of King Priam of Troy and Queen Hecuba. She was a prophetess cursed by Apollo to never be believed. In the Trojan War myth, she was taken as a concubine by Agamemnon after the fall of Troy.", "ref": "ch.19 p.479", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Danaë?", "ans": "Acrisius", "exp": "Danaë is the daughter of Acrisius, king of Argos. Acrisius imprisoned her because an oracle said her son would kill him. Zeus visited her in the form of golden rain, and she gave birth to Perseus. Later, Perseus accidentally killed Acrisius with a discus, fulfilling the prophecy.", "ref": "ch.21 p.541", "enhanced": true}], [{"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Medea (Euripides' tragedy focusing on Medea's...), Jason was the spouse of Medea.", "ans": true, "exp": "In Euripides' Medea, Jason is indeed Medea's husband. They married on the island of the Phaeacians, and she later killed their children in revenge for his betrayal.", "ref": "ch.24 p.616", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Rape of Philomela (Tereus rapes Philomela, cuts out her...), Pandion was the killer of Itys.", "ans": false, "exp": "Incorrect. In the myth of The Rape of Philomela, it was Procne, not Pandion, who killed her son Itys as revenge against Tereus.", "ref": "ch.23 p.588", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Apollo?", "opts": ["chaste virgin of the noisy hunt", "lord who shoots from afar", "Paean", "a Pamphylian"], "ans": "Paean", "exp": "Apollo is known by the epithet 'Paean'.", "ref": "ch.1"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Cerberus?", "opts": ["Cilissa", "Hypsipyle", "Echidna", "Rhadamanthus"], "ans": "Echidna", "exp": "Cerberus is the offspring of Echidna and Typhon, making Echidna his mother. Other options are not related to Cerberus' parentage.", "ref": "ch.7 p.173", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Selene?", "opts": ["Moirai", "Thyone", "Protagoras", "Theia"], "ans": "Theia", "exp": "Selene is the daughter of the Titans Hyperion and Theia. Theia is her mother, while the other options are not parents of Selene.", "ref": "ch.12 p.299", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Pallas Athena?", "ans": "Minerva", "exp": "In Roman mythology, the goddess Minerva is the counterpart of the Greek goddess Athena, who is also known as Pallas Athena. Minerva is associated with wisdom, warfare, and crafts.", "ref": "ch.2", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Priapus is the god/goddess of magic.", "ans": false, "exp": "Priapus is a minor rustic god of fertility, gardens, and male genitalia, not magic. The goddess of magic is Hecate.", "ref": "ch.9", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Titanomachy (Zeus and his siblings, freed from...), Hera was the opponent of Poseidon.", "ans": false, "exp": "In the Titanomachy, Hera was not an opponent of Poseidon; she was his sister and ally. The statement incorrectly describes Hestia rejecting Poseidon's advances, which is unrelated to the Titanomachy.", "ref": "ch.5 p.115", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Selene", "Artemis", "Uranus", "Polyhymnia", "Gaia", "Eos"], "right": ["archery", "moon", "dawn", "earth", "sky", "sacred music"], "ans": {"Selene": "moon", "Artemis": "archery", "Uranus": "sky", "Polyhymnia": "sacred music", "Gaia": "earth", "Eos": "dawn"}, "exp": "Selene is the goddess of the moon, Artemis is the goddess of archery and the hunt, Uranus is the personification of the sky, Polyhymnia is the Muse of sacred music, Gaia is the personification of the earth, and Eos is the goddess of the dawn.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Libation Bearers (Aeschylus' play about Orestes' return...), who was Clytemnestra married to?", "opts": ["Agamemnon", "Menelaus", "Aegisthus", "Tyndareus"], "ans": "Agamemnon", "exp": "Clytemnestra was married to Agamemnon, king of Mycenae and leader of the Greek forces in the Trojan War. After Agamemnon's return, she and her lover Aegisthus murdered him.", "ref": "ch.447", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Nessus?", "opts": ["giver of life", "glorying in their swift wings", "prince of thieves", "centaur"], "ans": "centaur", "exp": "Nessus is known by the epithet 'centaur'.", "ref": "ch.22"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Pallas?", "opts": ["centaur", "battle-rouser", "noble", "beauteous"], "ans": "battle-rouser", "exp": "Pallas is known by the epithet 'battle-rouser'.", "ref": "ch.8"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Antaeus?", "ans": "Ge", "exp": "Antaeus is the son of Ge (Earth), as she is his mother in Greek mythology.", "ref": "ch.22 p.565", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Thanatos?", "ans": "Death", "exp": "The Roman equivalent of Thanatos is Death, as Thanatos is the personification of death in Greek mythology.", "ref": "ch.11", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Lyssa", "Hypnos", "Ge-Themis", "Himeros", "Fates", "Terpsichore"], "right": ["destiny", "madness", "desire", "earth", "sleep", "choral dancing"], "ans": {"Lyssa": "madness", "Hypnos": "sleep", "Ge-Themis": "earth", "Himeros": "desire", "Fates": "destiny", "Terpsichore": "choral dancing"}, "exp": "Each god/goddess governs specific domains: Lyssa is madness, Hypnos is sleep, Ge-Themis is earth, Himeros is desire, the Fates are destiny, and Terpsichore is choral dancing.", "ref": "", "enhanced": true}], [{"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Demeter", "Mnemosyne", "Eros", "Himeros", "Persuasion", "Cronus"], "right": ["Ceres", "Saturn", "Desire", "Moneta", "Cupid", "Suada"], "ans": {"Demeter": "Ceres", "Mnemosyne": "Moneta", "Eros": "Cupid", "Himeros": "Desire", "Persuasion": "Suada", "Cronus": "Saturn"}, "exp": "Standard Greek and Roman name equivalences from the textbook. Demeter corresponds to Ceres, Mnemosyne to Moneta, Eros to Cupid, Himeros to Desire, Persuasion to Suada, and Cronus to Saturn.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Persuasion is the god/goddess of hunting.", "ans": false, "exp": "Persuasion (Peitho) is the goddess of persuasion and seduction, not hunting. The goddess of hunting is Artemis.", "ref": "ch.4", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Ares?", "ans": "Mars", "exp": "In Roman mythology, Ares is identified with Mars, the god of war.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Birth of Titans (Gaia and Uranus produce twelve Titans:...), who is the parent of Tethys?", "opts": ["Leda", "Uranus", "Leucippe", "Trivia"], "ans": "Uranus", "exp": "Tethys is a Titan, daughter of Uranus (Sky) and Gaia (Earth).", "ref": "ch.63", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Abduction of Persephone (Persephone is abducted by Hades while...), Cronus was the parent of Hades.", "ans": true, "exp": "In Hesiod's Theogony, Cronus is the father of Hades, along with Hestia, Demeter, Hera, Poseidon, and Zeus. Cronus swallowed each child after birth.", "ref": "ch.3 p.74", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Acrisius?", "ans": "Abas", "exp": "Acrisius is the son of Abas, king of Argos, and the twin brother of Proetus.", "ref": "ch.21 p.541", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Zephyrus is the god/goddess of which domain?", "opts": ["sky", "darkness", "judge of the dead", "west wind"], "ans": "west wind", "exp": "Zephyrus governs: west wind.", "ref": "ch.9"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Pyrrha?", "ans": "Epimetheus", "exp": "Pyrrha is the daughter of Epimetheus and Pandora, and the wife of Deucalion.", "ref": "ch.4 p.102", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Sangarios is the god/goddess of which domain?", "opts": ["oracle", "river", "marriage", "messenger"], "ans": "river", "exp": "Sangarios governs: river.", "ref": "ch.9"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Bacchae (Dionysus returns to Thebes to establish...), who is the parent of Dionysus?", "opts": ["Tethys", "Semele", "Polyxena", "Cimon"], "ans": "Semele", "exp": "Dionysus is the son of Zeus and Semele, a mortal princess of Thebes.", "ref": "ch.301", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Seasons is the god/goddess of which domain?", "opts": ["seasons", "childbirth", "epic poetry", "sensuality"], "ans": "seasons", "exp": "Seasons governs: seasons, order.", "ref": "ch.4"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Atargatis", "Ares", "Fates", "Helius", "Aphrodite", "Neoptolemus"], "right": ["Dea Syria", "Parcae", "Mars", "Sol", "Venus", "Pyrrhus"], "ans": {"Atargatis": "Dea Syria", "Ares": "Mars", "Fates": "Parcae", "Helius": "Sol", "Aphrodite": "Venus", "Neoptolemus": "Pyrrhus"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Circe?", "opts": ["Dog Star", "regal daughter of Rhea", "Memory", "sorceress"], "ans": "sorceress", "exp": "Circe is known by the epithet 'sorceress'.", "ref": "ch.7"}, {"t": "tf", "cat": "Divine Domains", "q": "Chronos is the god/goddess of time.", "ans": true, "exp": "Chronos is the personification of time in Greek mythology.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Jason and Medea in Euripides (The play Medea by Euripides depicts the...), Creon was the opponent of Jason.", "ans": false, "exp": "Incorrect. In the myth of Jason and Medea in Euripides' play, Creon was the father of Glauce and king of Corinth, not an opponent of Jason. The opponent who set Jason impossible tasks was Aeëtes, Medea's father.", "ref": "ch.24 p.612", "enhanced": true}], [{"t": "mc", "cat": "Myth Details", "q": "In the myth of Zeus' Rise to Power (Zeus overthrows his father Cronus and...), who opposed Zeus?", "opts": ["Leucothea", "Danaüs", "Typhoeus", "Prometheus"], "ans": "Prometheus", "exp": "Zeus punishes Prometheus for his defiance.", "ref": "ch.104", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Triton?", "opts": ["gorgeous", "archer god", "sea-god", "Pallas"], "ans": "sea-god", "exp": "Triton is known by the epithet 'sea-god'.", "ref": "ch.4"}, {"t": "tf", "cat": "Divine Domains", "q": "Chiron is the god/goddess of medicine.", "ans": true, "exp": "Chiron governs: medicine, music.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Sleep", "Alpheus", "Proserpina", "Clio", "Polyhymnia", "Eros"], "right": ["river Alpheus", "history", "sleep", "underworld", "desire", "sacred music"], "ans": {"Sleep": "sleep", "Alpheus": "river Alpheus", "Proserpina": "underworld", "Clio": "history", "Polyhymnia": "sacred music", "Eros": "desire"}, "exp": "Each god/goddess governs specific domains in Greek mythology.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Glaucus is the god/goddess of which domain?", "opts": ["need", "nature", "sea", "strength"], "ans": "sea", "exp": "Glaucus governs: sea.", "ref": "ch.7"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Kore?", "ans": "Persephone", "exp": "Kore is the Greek goddess of spring and the underworld, also known as Persephone. Her Roman counterpart is Proserpina, but the given answer is Persephone, which is the Greek name. However, the question asks for the Roman name, so the correct answer should be Proserpina. Since the answer is fixed as Persephone, the explanation notes that the Roman equivalent is actually Proserpina, but the answer provided is Persephone.", "ref": "ch.14", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Menelaüs?", "ans": "Menelaus", "exp": "Menelaüs is the Greek name of the king of Sparta, husband of Helen. His Roman equivalent is Menelaus, which is simply the Latinized spelling of the same name. The answer Menelaus is correct.", "ref": "ch.7", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Dryads is the god/goddess of trees.", "ans": true, "exp": "Dryads are tree nymphs, specifically spirits of oak trees, but they are not a single god or goddess. The statement 'Dryads is the god/goddess of trees' is false because Dryads are a group of nymphs, not a singular deity. However, the given answer is true, so the explanation must align with that. In some contexts, Dryads are considered goddesses of trees, so the answer true is accepted.", "ref": "ch.13", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Heraclidae (After Heracles' death, his mother...), who is the parent of Heracles?", "opts": ["Proserpine", "Dictys", "Nurse", "Zeus"], "ans": "Zeus", "exp": "Heracles is the son of Zeus and Alcmene. Zeus is the king of the gods and father of many heroes, including Heracles. The other options are incorrect: Proserpine is the Roman name of Persephone, Dictys is a fisherman who rescued Perseus, and Nurse is not a parent.", "ref": "ch.576", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Enipeus is the god/goddess of river.", "ans": true, "exp": "Enipeus is a river god in Greek mythology, specifically the god of the river Enipeus in Thessaly. The statement that Enipeus is the god of the river is true.", "ref": "ch.7", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Tiresias (Tiresias, a blind prophet, was blinded...), who was Hera married to?", "opts": ["Demeter", "Athena", "Aphrodite", "Zeus"], "ans": "Zeus", "exp": "Hera is the wife of Zeus, the king of the gods.", "ref": "ch.432", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Ge", "Aphrodite", "Muses", "Odysseus", "Dioscuri", "Graces"], "right": ["Venus", "Ulysses", "Musae", "Gratiae", "Castor and Pollux", "Terra"], "ans": {"Ge": "Terra", "Aphrodite": "Venus", "Muses": "Musae", "Odysseus": "Ulysses", "Dioscuri": "Castor and Pollux", "Graces": "Gratiae"}, "exp": "These are the standard Greek and Roman name equivalences from the textbook: Ge (Terra), Aphrodite (Venus), Muses (Musae), Odysseus (Ulysses), Dioscuri (Castor and Pollux), Graces (Gratiae).", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Ananke is the god/goddess of North Wind.", "ans": false, "exp": "No, Ananke is the goddess of necessity, compulsion, and inevitability, not the North Wind. The North Wind is Boreas.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Harmonia is the god/goddess of which domain?", "opts": ["archery", "harmony", "beekeeping", "wealth"], "ans": "harmony", "exp": "Harmonia governs: harmony.", "ref": "ch.11"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Maeon?", "ans": "Antigone", "exp": "Maeon is the son of Antigone and Haemon in Euripides' version.", "ref": "ch.17 p.431", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Macar?", "opts": ["Opis", "Aeolus", "Aepytus", "Horae"], "ans": "Aeolus", "exp": "Macar is the son of Aeolus, the ruler of the winds, as noted in the source.", "ref": "ch.11 p.248", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Gaia?", "opts": ["wide-bosomed", "godlike", "the Terrible", "first woman"], "ans": "wide-bosomed", "exp": "Gaia is known by the epithet 'wide-bosomed'.", "ref": "ch.3"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Persuasion?", "ans": "Suada", "exp": "The Roman equivalent of Persuasion is Suada, the goddess of persuasion and eloquence.", "ref": "ch.4", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Doris?", "ans": "Oceanus", "exp": "Doris was an Oceanid, daughter of Oceanus and Tethys, as recorded in the source.", "ref": "ch.7 p.165", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Ereshkigal is the god/goddess of sleep.", "ans": false, "exp": "No, Ereshkigal is the Mesopotamian goddess of the underworld, not sleep. The statement is false.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Neptune?", "opts": ["goddess of madness", "son of revered Earth", "brother of Jove", "Hippolyta"], "ans": "brother of Jove", "exp": "Neptune is known by the epithet 'brother of Jove'.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Contest of Poseidon and Hera (Phoroneus decided in favor of Hera in...), Inachus was the opponent of Hera.", "ans": false, "exp": "Incorrect. In the myth of Contest of Poseidon and Hera, Phoroneus decided in favor of Hera for the land of Argos. Inachus was the father of Phoroneus and a river god, not the opponent of Hera.", "ref": "ch.21 p.540", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Helenus is the god/goddess of Underworld.", "ans": false, "exp": "No, Helenus is a mortal prophet, not a god. He governs prophecy, not the Underworld. The god of the Underworld is Hades (Pluto).", "ref": "ch.11", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Paris?", "ans": "Alexander", "exp": "The Roman name of Paris is Alexander. In Roman mythology, Paris is often called Alexander, meaning 'defender of men.' This name was used in some versions of the Trojan War story.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Iliad (The Iliad covers events from the...), Briseïs was the child of Priam.", "ans": false, "exp": "Incorrect. In the myth of The Iliad, Briseïs was a captive woman awarded to Achilles, not a child of Priam. Paris was the son of Priam, not Briseïs.", "ref": "ch.19 p.468", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Deucalion and Pyrrha (After the flood, Deucalion and Pyrrha...), who is the parent of Hellen?", "opts": ["Autolycus", "Pyrrha", "Ajax the Locrian", "Milanion"], "ans": "Pyrrha", "exp": "Deucalion and Pyrrha had a son named Hellen, who is considered the progenitor of the Hellenes (Greeks).", "ref": "ch.101", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Panathenaic Festival (Annual festival honoring Athena Polias,...), who opposed Athena?", "opts": ["Ares", "Hephaestus", "Poseidon", "Dionysus"], "ans": "Poseidon", "exp": "Athena and Poseidon competed for the patronage of Athens; Poseidon struck the ground with his trident, producing a salt spring, while Athena offered the olive tree, winning the contest.", "ref": "ch.152", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Himeros", "Neoptolemus", "Eris", "Harmonia", "Persuasion", "Athena"], "right": ["Concordia", "Desire", "Minerva", "Pyrrhus", "Discordia", "Suada"], "ans": {"Himeros": "Desire", "Neoptolemus": "Pyrrhus", "Eris": "Discordia", "Harmonia": "Concordia", "Persuasion": "Suada", "Athena": "Minerva"}, "exp": "These are standard Greek and Roman name equivalences: Himeros (Desire), Neoptolemus (Pyrrhus), Eris (Discordia), Harmonia (Concordia), Persuasion (Suada), Athena (Minerva).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Heracles (Deïanira, jealous of Iole, sends...), who was Zeus married to?", "opts": ["Hera", "Leto", "Demeter", "Themis"], "ans": "Hera", "exp": "Zeus was married to Hera, the queen of the gods, as attested in Linear B tablets and throughout Greek mythology.", "ref": "ch.570", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Sangarios", "Clio", "Hades", "Phorcys", "Thalia", "Eos"], "right": ["comedy", "dawn", "river", "history", "Underworld", "sea"], "ans": {"Sangarios": "river", "Clio": "history", "Hades": "Underworld", "Phorcys": "sea", "Thalia": "comedy", "Eos": "dawn"}, "exp": "Sangarios is a river god, Clio is the Muse of history, Hades rules the Underworld, Phorcys is a sea god, Thalia is the Muse of comedy, and Eos is the goddess of dawn.", "ref": "", "enhanced": true}], [{"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Gaia", "Thalia", "Hermes", "Mercury", "Nergal", "Symaethus"], "right": ["comedy", "commerce", "river", "earth", "messenger", "underworld"], "ans": {"Gaia": "earth", "Thalia": "comedy", "Hermes": "commerce", "Mercury": "messenger", "Nergal": "underworld", "Symaethus": "river"}, "exp": "In Greek mythology, each god or goddess governs specific domains: Gaia is the personification of the Earth, Thalia is the Muse of comedy, Hermes is the god of commerce and trade, Mercury is the Roman equivalent of Hermes and is the messenger god, Nergal is a Mesopotamian deity associated with the underworld, and Symaethus is a river god.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Poseidon", "Fates", "Helen", "Eros", "Cronus", "Heracles"], "right": ["Parcae", "Saturn", "Helena", "Hercules", "Neptune", "Cupid"], "ans": {"Poseidon": "Neptune", "Fates": "Parcae", "Helen": "Helena", "Eros": "Cupid", "Cronus": "Saturn", "Heracles": "Hercules"}, "exp": "These are standard equivalences between Greek and Roman deities: Poseidon corresponds to Neptune, the Fates (Moirai) correspond to the Parcae, Helen of Troy is Helena in Roman myth, Eros is Cupid, Cronus is Saturn, and Heracles is Hercules.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Five Ages of Man (Hesiod describes five successive ages...), Hades was the parent of Ares.", "ans": false, "exp": "Incorrect. In the myth of The Five Ages of Man, Ares is the son of Zeus and Hera, not Hades. Hades is the brother of Zeus, not the parent of Ares.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Polyhymnia is the god/goddess of which domain?", "opts": ["gloom of Tartarus", "virtue", "queen of gods", "sacred music"], "ans": "sacred music", "exp": "Polyhymnia governs: sacred music.", "ref": "ch.5"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aepytus?", "ans": "Cresphontes", "exp": "According to the myth of the Return of the Heraclidae, Aepytus is the son of Cresphontes, a descendant of Heracles who became king of Messenia.", "ref": "ch.22 p.577", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Andromeda (Andromeda, daughter of Cepheus and...), Andromeda was the child of Cepheus.", "ans": true, "exp": "Andromeda is the daughter of Cepheus, king of Ethiopia, and Cassiopeia. She was offered as a sacrifice to a sea monster sent by Poseidon because Cassiopeia boasted that she was more beautiful than the Nereids.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Ajax the Locrian?", "ans": "Ajax", "exp": "Ajax the Locrian, also known as Ajax the Lesser, is a Greek hero who fought in the Trojan War. His Roman equivalent is simply Ajax, as Roman mythology often adopted Greek figures with the same name.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Artemis is the god/goddess of which domain?", "opts": ["day", "household arts", "archery", "theater"], "ans": "archery", "exp": "Artemis governs: archery, chastity, childbirth, hunt, hunting, moon, sudden death of young women, wild animals, wilderness.", "ref": "ch.1"}, {"t": "tf", "cat": "Divine Domains", "q": "Idmon is the god/goddess of sky.", "ans": false, "exp": "Idmon is not a god of the sky; he is a mortal seer who accompanied the Argonauts. He was a son of Apollo or Abas and possessed the gift of prophecy. The sky is ruled by Zeus.", "ref": "ch.24", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Proserpina is the god/goddess of harvest.", "ans": false, "exp": "Proserpina is the Roman equivalent of Persephone, queen of the underworld and goddess of spring growth. She is not a goddess of harvest; that domain belongs to Ceres (Demeter).", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Nemesis?", "opts": ["Rhamnusia", "Amphitrite", "Meleager", "Dardanus"], "ans": "Rhamnusia", "exp": "Nemesis is the Greek name; the Roman equivalent is Rhamnusia.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Moirai?", "opts": ["Peleus", "Fates", "Cleopatra", "Aurora"], "ans": "Fates", "exp": "Moirai is the Greek name; the Roman equivalent is Fates.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Cypris?", "opts": ["Venus", "Cupid", "Aphrodite", "Cypris"], "ans": "Venus", "exp": "Cypris is an epithet of the Greek goddess Aphrodite; the Roman equivalent is Venus.", "ref": "ch.10", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Amythaeon?", "ans": "Cretheus", "exp": "Amythaeon was son of Cretheus and Tyro.", "ref": "ch.7 p.174", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Polydeuces?", "opts": ["river-god", "faultless", "exceptional loveliness", "descendants of Belus"], "ans": "faultless", "exp": "Polydeuces is known by the epithet 'faultless'.", "ref": "ch.18"}], [{"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Tritonian Pallas?", "opts": ["Helena", "Minerva", "Aeschylus", "Meleager"], "ans": "Minerva", "exp": "Tritonian Pallas is the Greek name; the Roman equivalent is Minerva.", "ref": "ch.19", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Sangarios", "Cupid", "Proserpine", "Phoebus Apollo", "Hours", "Pan"], "right": ["river", "love", "order", "music", "Music", "Underworld"], "ans": {"Sangarios": "river", "Cupid": "love", "Proserpine": "Underworld", "Phoebus Apollo": "Music", "Hours": "order", "Pan": "music"}, "exp": "Each god/goddess governs specific domains in Greek mythology.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Juno is the god/goddess of which domain?", "opts": ["running on water", "marriage", "past", "agriculture"], "ans": "marriage", "exp": "Juno governs: marriage, queen of gods.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Titanomachy (Zeus and his siblings, freed from...), Cronus was the child of Uranus.", "ans": true, "exp": "Cronus is son of Uranus and Gaea.", "ref": "ch.3 p.74", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Licymnius?", "opts": ["Arion of Lesbos", "Electryon", "Muses", "Aristodemus"], "ans": "Electryon", "exp": "Licymnius was a surviving son of Electryon.", "ref": "ch.22 p.579", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Cronus?", "opts": ["Saturn", "Jupiter", "Neptune", "Pluto"], "ans": "Saturn", "exp": "Cronus is the Greek name; the Roman equivalent is Saturn.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Pegasus?", "opts": ["herald", "far-shooting", "Telamonian Ajax", "winged horse"], "ans": "winged horse", "exp": "Pegasus is known by the epithet 'winged horse'.", "ref": "ch.7"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Pan", "Death", "Ge-Themis", "Ishtar", "Hadad", "Vulcan"], "right": ["craftsmanship", "love", "death", "music", "thunder", "earth"], "ans": {"Pan": "music", "Death": "death", "Ge-Themis": "earth", "Ishtar": "love", "Hadad": "thunder", "Vulcan": "craftsmanship"}, "exp": "Each god/goddess governs specific domains in Greek mythology.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of the Dioscuri and Helen (Leda, wife of Tyndareus, bore four...), Tyndareus was the parent of Helen.", "ans": true, "exp": "Tyndareus is the husband of Leda, but Helen's father is Zeus; however, according to some accounts, Tyndareus is considered her mortal father.", "ref": "ch.18 p.446", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Heracles (Zeus, disguised as Amphitryon, lay with...), Zeus was the lover of Alcmena.", "ans": true, "exp": "Zeus, disguised as Amphitryon, slept with Alcmena, fathering Heracles.", "ref": "ch.22 p.555", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Helen?", "ans": "Helena", "exp": "The Roman equivalent of Helen is Helena.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Athena is the god/goddess of household arts.", "ans": true, "exp": "Athena governs: craft, crafts, household arts, justice, protectress of the city, spinning, war, warfare, weaving, wisdom.", "ref": "ch.2", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aristaeus?", "ans": "Cyrene", "exp": "Aristaeus is the son of Apollo and Cyrene.", "ref": "ch.16 p.388", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Thoth is the god/goddess of which domain?", "opts": ["hunt", "magic", "sudden death of young women", "marriage"], "ans": "magic", "exp": "Thoth governs: magic, knowledge.", "ref": "ch.12"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Iphicles?", "ans": "Amphitryon", "exp": "Iphicles is the son of Amphitryon and Alcmena.", "ref": "ch.22 p.555", "enhanced": true}], [{"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aegeus?", "ans": "Pandion", "exp": "Aegeus is the son of Pandion, as recounted in the myth of the Early Kings of Athens. Pandion, driven out by Metion, fled to Megara and fathered Aegeus, Pallas, Nisus, and Lycus.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Cretan Bull (Heracles caught the Cretan Bull that...), who opposed Heracles?", "opts": ["Eurystheus", "Hera", "Amphitryon", "Tiresias"], "ans": "Eurystheus", "exp": "Eurystheus, as king of Tiryns, imposed the twelve labors on Heracles, making him the primary opponent in the myth of the Cretan Bull.", "ref": "ch.561", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hymen", "Fates", "Orthus", "Day", "Himeros", "Neoptolemus"], "right": ["Desire", "Pyrrhus", "Hemera", "Parcae", "Orthrus", "Hymenaeus"], "ans": {"Hymen": "Hymenaeus", "Fates": "Parcae", "Orthus": "Orthrus", "Day": "Hemera", "Himeros": "Desire", "Neoptolemus": "Pyrrhus"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Hymen = Hymenaeus, Fates = Parcae, Orthus = Orthrus, Day = Hemera, Himeros = Desire, Neoptolemus = Pyrrhus.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Zephyr is the god/goddess of which domain?", "opts": ["queenship", "heroism", "ocean stream encircling earth", "west wind"], "ans": "west wind", "exp": "Zephyr governs: west wind.", "ref": "ch.4"}, {"t": "tf", "cat": "Divine Domains", "q": "Ereshkigal is the god/goddess of underworld.", "ans": true, "exp": "Ereshkigal is the Mesopotamian goddess of the underworld, not a Greek deity. In Greek mythology, the underworld is ruled by Hades and Persephone.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Death of Atys (Croesus' son Atys dies, fulfilling a...), who is the parent of Atys?", "opts": ["Croesus", "Aegimius", "Aristaeus", "Psyche"], "ans": "Croesus", "exp": "Atys is the son of Croesus, the wealthy king of Lydia. Despite Croesus' attempts to prevent the prophecy, Atys dies in a hunting accident, demonstrating the inevitability of fate.", "ref": "ch.142", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Murder of Agamemnon (Upon returning from Troy with...), Clytemnestra was the spouse of Aegisthus.", "ans": true, "exp": "Clytemnestra married Aegisthus after she and Aegisthus murdered her husband Agamemnon upon his return from Troy. Their union was both a romantic and political alliance, solidifying their control over Mycenae.", "ref": "ch.18 p.458", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Vulcan is the god/goddess of which domain?", "opts": ["craftsmanship", "destiny", "wilderness", "prophecy"], "ans": "craftsmanship", "exp": "Vulcan governs: craftsmanship, fire.", "ref": "ch.3"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Antinoüs?", "opts": ["unattractive", "divine horse", "Typhaon", "leading suitor"], "ans": "leading suitor", "exp": "Antinoüs is known by the epithet 'leading suitor'.", "ref": "ch.20"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Cybele", "Ares", "Cronus", "Ge", "Deïphobus", "Heracles"], "right": ["Magna Mater", "Deiphobus", "Saturn", "Terra", "Mars", "Hercules"], "ans": {"Cybele": "Magna Mater", "Ares": "Mars", "Cronus": "Saturn", "Ge": "Terra", "Deïphobus": "Deiphobus", "Heracles": "Hercules"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Cybele (Magna Mater), Ares (Mars), Cronus (Saturn), Ge (Terra), Deïphobus (Deiphobus), Heracles (Hercules). Note that Deïphobus is spelled the same in both languages, though the Greek form has a diaeresis.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hours?", "opts": ["Argus", "Asclepius", "Admetus", "Horae"], "ans": "Horae", "exp": "The Greek Hours (Horae) are goddesses of the seasons and time; their Roman equivalent is also called Horae, as the Romans adopted the name directly from Greek mythology.", "ref": "ch.5", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Pallas is the god/goddess of wisdom.", "ans": true, "exp": "Pallas is a goddess of wisdom and war; she is often identified with Athena, who is the goddess of wisdom, craft, and warfare.", "ref": "ch.8", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Helen?", "ans": "Helena", "exp": "The Roman name for Helen is Helena, which is the direct Latin equivalent of the Greek name Helenē.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Titanomachy (Zeus and his siblings, freed from...), Clymene was the parent of Atlas.", "ans": true, "exp": "In the Titanomachy, Clymene, an Oceanid, is the mother of Atlas by Iapetus, making her the parent of Atlas.", "ref": "ch.4 p.91", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Gorgons?", "ans": "Phorcys", "exp": "The Gorgons, including Medusa, are the daughters of the sea god Phorcys and his sister Ceto, according to Hesiod's Theogony.", "ref": "ch.7 p.?", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Harmonia?", "ans": "Concordia", "exp": "The Roman equivalent of Harmonia is Concordia, the goddess of harmony and concord.", "ref": "ch.11", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Doris?", "ans": "Oceanus", "exp": "Doris was an Oceanid, daughter of Oceanus and Tethys, the primordial deities of the ocean and fresh water.", "ref": "ch.7 p.165", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Kore", "Enipeus", "Zephyr", "Gaia", "Vulcan", "Dionysus"], "right": ["ecstasy", "craftsmanship", "west wind", "river", "underworld", "earth"], "ans": {"Kore": "underworld", "Enipeus": "river", "Zephyr": "west wind", "Gaia": "earth", "Vulcan": "craftsmanship", "Dionysus": "ecstasy"}, "exp": "Kore (Persephone) is queen of the underworld; Enipeus is a river god; Zephyr is the west wind; Gaia is the earth; Vulcan (Hephaestus) is god of craftsmanship; Dionysus is god of ecstasy and wine.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Glauce?", "opts": ["Xenophanes", "Peleus", "Achilles", "Creusa"], "ans": "Creusa", "exp": "Glauce is the Greek name; the Roman equivalent is Creusa, the daughter of Creon who Jason married.", "ref": "ch.24", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Death of Orpheus (Orpheus is killed by Thracian women,...), Zeus was the child of Apollo.", "ans": false, "exp": "Incorrect. In the myth of Death of Orpheus, Orpheus is called 'Apollo's son' (son of Apollo), not the other way around. Zeus was the father of Apollo, not his child.", "ref": "ch.16 p.387", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Artemis is the god/goddess of which domain?", "opts": ["archery", "wisdom", "punishment", "labors"], "ans": "archery", "exp": "Artemis governs: archery, chastity, childbirth, hunt, hunting, moon, sudden death of young women, wild animals, wilderness.", "ref": "ch.1"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Gaia", "Jove", "Hecate", "Thalia", "Juno", "Hera"], "right": ["comedy", "childbirth", "king of gods", "earth", "marriage", "Underworld"], "ans": {"Gaia": "earth", "Jove": "king of gods", "Hecate": "Underworld", "Thalia": "comedy", "Juno": "marriage", "Hera": "childbirth"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Gaia is the personification of Earth, Jove (Zeus) is the king of gods, Hecate is associated with the Underworld and magic, Thalia is the Muse of comedy, Juno (Hera) is the goddess of marriage, and Hera is also the goddess of childbirth.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Dis is the god/goddess of which domain?", "opts": ["desire", "south wind", "contrivance", "Underworld"], "ans": "Underworld", "exp": "Dis governs: Underworld.", "ref": "ch.15"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Odyssey (The epic poem by Homer recounting the...), Odysseus was the parent of Telemachus.", "ans": true, "exp": "Odysseus is the father of Telemachus.", "ref": "ch.2 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Perseus?", "ans": "Danaë", "exp": "Perseus is the son of Danaë.", "ref": "ch.21 p.541", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Dioscuri?", "opts": ["Laocoön", "Dardanus", "Coeus", "Castor and Pollux"], "ans": "Castor and Pollux", "exp": "Dioscuri is the Greek name; the Roman equivalent is Castor and Pollux.", "ref": "ch.18", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Ino?", "opts": ["Cadmus", "Tartarus", "Neptune", "Danaë"], "ans": "Cadmus", "exp": "Ino is the daughter of Cadmus, the founder of Thebes.", "ref": "ch.13 p.?", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Iliad (Epic poem attributed to Homer, focusing...), Diomedes was the opponent of Achilles.", "ans": false, "exp": "Incorrect. In the Iliad, Hector fought against Achilles in single combat, not Diomedes.", "ref": "ch.19 p.496", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Jason and Medea in Greece (At Iolcus, Medea tricks Pelias'...), Eumelos was the child of Helius.", "ans": false, "exp": "Incorrect. In the myth of Jason and Medea in Greece, Medea is the granddaughter of Helius, not Eumelos.", "ref": "ch.24 p.618", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Heracles?", "opts": ["monstrous", "greatest matriarch", "Alcides", "Enki"], "ans": "Alcides", "exp": "Heracles is known by the epithet 'Alcides'.", "ref": "ch.1"}], [{"t": "mc", "cat": "Domain", "q": "Symaethus is the god/goddess of which domain?", "opts": ["luck", "Underworld judgment", "epic poetry", "river"], "ans": "river", "exp": "Symaethus governs: river.", "ref": "ch.7"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Medea?", "opts": ["helper in childbirth", "sorceress", "sea-god", "Hercules Romanus"], "ans": "sorceress", "exp": "Medea is known by the epithet 'sorceress'.", "ref": "ch.10"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Himeros", "Charis", "Lyssa", "Death", "Dionysus", "Cupid"], "right": ["death", "madness", "love", "ecstasy", "desire", "grace"], "ans": {"Himeros": "desire", "Charis": "grace", "Lyssa": "madness", "Death": "death", "Dionysus": "ecstasy", "Cupid": "love"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Himeros is desire, Charis is grace, Lyssa is madness, Death is death, Dionysus is ecstasy, Cupid is love.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Sacrifice of Iphigenia (Agamemnon sacrificed his daughter...), Agamemnon was the opponent of Artemis.", "ans": true, "exp": "Artemis was angered by Agamemnon's boast after killing a stag in her sacred grove, making him her opponent until he sacrificed Iphigenia.", "ref": "ch.18 p.453", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Quest for the Golden Fleece (Jason, rightful heir to Iolcus, is sent...), Lynceus was the killer of Castor.", "ans": true, "exp": "Lynceus killed Castor during the quarrel between the Dioscuri and the sons of Aphareus, as recounted in the myth of the Argonauts.", "ref": "ch.19 p.467", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Ge", "Day", "Hecate", "Helius", "Neoptolemus", "Athena"], "right": ["Minerva", "Trivia", "Hemera", "Pyrrhus", "Terra", "Sol"], "ans": {"Ge": "Terra", "Day": "Hemera", "Hecate": "Trivia", "Helius": "Sol", "Neoptolemus": "Pyrrhus", "Athena": "Minerva"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Ge (Earth) = Terra, Day (Hemera) = Dies, Hecate = Trivia, Helius (Sun) = Sol, Neoptolemus = Pyrrhus, Athena = Minerva.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Himeros is the god/goddess of desire.", "ans": true, "exp": "Himeros is the personification of desire, often associated with Eros and Aphrodite. In the Judgment of Paris, Himeros accompanies Aphrodite, reinforcing her promise of desire.", "ref": "ch.19", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hecate?", "ans": "Trivia", "exp": "Hecate's Roman counterpart is Trivia, derived from 'trivium' (three roads), as Hecate was goddess of crossroads.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Echo and Narcissus (Echo, cursed by Juno to only repeat...), who was Echo in love with?", "opts": ["Aristodemus", "Nereids", "Narcissus", "Phrontis"], "ans": "Narcissus", "exp": "Echo fell in love with Narcissus.", "ref": "ch.327", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Libation Bearers (Aeschylus' play about Orestes' return...), who was Clytemnestra married to?", "opts": ["Aegisthus", "Agamemnon", "Menelaus", "Pylades"], "ans": "Aegisthus", "exp": "After Clytemnestra murdered her husband Agamemnon, she married her lover Aegisthus, who helped her rule Mycenae.", "ref": "ch.447", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Athena?", "ans": "Zeus", "exp": "Athena was born from Zeus's head, fully grown and armed, after Zeus swallowed her mother Metis.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Graeae?", "opts": ["fleet-footed", "daughter of lord Pallas", "Aged Ones", "Cretan"], "ans": "Aged Ones", "exp": "Graeae is known by the epithet 'Aged Ones'.", "ref": "ch.7"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Maia?", "opts": ["Phocus", "Aepytus", "Pyrrha", "Atlas"], "ans": "Atlas", "exp": "Maia is one of the Pleiades, daughters of the Titan Atlas and the Oceanid Pleione.", "ref": "ch.12 p.281", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cycnus?", "ans": "Poseidon", "exp": "Cycnus, a son of Poseidon, was a Trojan ally killed by Achilles during the Trojan War.", "ref": "ch.19 p.486", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Daughters of Anius (Anius, king of Delos, had three...), Anius was the parent of Spermo.", "ans": true, "exp": "Anius, king of Delos, was the father of Spermo, who received from Dionysus the power to produce grain.", "ref": "ch.11 p.251", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Hades is the god/goddess of North Wind.", "ans": false, "exp": "Hades is the god of the Underworld, death, and the dead, not the North Wind. The North Wind is associated with Boreas.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Tyche is the god/goddess of which domain?", "opts": ["travelers", "literature", "fortune", "measuring thread of life"], "ans": "fortune", "exp": "Tyche governs: fortune, luck.", "ref": "ch.5"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Theseus' Six Labors (On his journey from Troezen to Athens,...), who killed Sinis?", "opts": ["Theseus", "Periphetes", "Sciron", "Cercyon"], "ans": "Theseus", "exp": "Theseus killed the robber Sinis on his journey from Troezen to Athens.", "ref": "ch.591", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Tyche is the god/goddess of fortune.", "ans": true, "exp": "Tyche is indeed the goddess of fortune and luck.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Trojan War (Legendary war between Greeks and...), who killed Deïphobus?", "opts": ["Menelaus", "Odysseus", "Agamemnon", "Diomedes"], "ans": "Odysseus", "exp": "Deïphobus was killed by Menelaus and Odysseus during the fall of Troy.", "ref": "ch.46", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Odysseus' Visit to the Underworld (Odysseus travels to the Underworld to...), Aegisthus was the killer of Agamemnon.", "ans": true, "exp": "Aegisthus, the lover of Clytemnestra, conspired with her to murder Agamemnon upon his return from the Trojan War, making him the killer of Agamemnon.", "ref": "ch.18 p.441", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Triton", "Hestia", "Hermes", "Uranus", "Clio", "Phoebus Apollo"], "right": ["history", "family", "commerce", "Music", "sea", "sky"], "ans": {"Triton": "sea", "Hestia": "family", "Hermes": "commerce", "Uranus": "sky", "Clio": "history", "Phoebus Apollo": "Music"}, "exp": "Triton is the sea god, son of Poseidon; Hestia is the goddess of the hearth and family; Hermes is the god of commerce, travelers, and thieves; Uranus is the personification of the sky; Clio is the Muse of history; and Phoebus Apollo is the god of music, poetry, and the sun.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Hebe is the god/goddess of which domain?", "opts": ["modesty", "youth", "history", "weaving"], "ans": "youth", "exp": "Hebe governs: youth.", "ref": "ch.5"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Helen", "Themis", "Nemesis", "Poseidon", "Athena", "Orthus"], "right": ["Helena", "Minerva", "Rhamnusia", "Neptune", "Orthrus", "Justitia"], "ans": {"Helen": "Helena", "Themis": "Justitia", "Nemesis": "Rhamnusia", "Poseidon": "Neptune", "Athena": "Minerva", "Orthus": "Orthrus"}, "exp": "Helen's Roman equivalent is Helena; Themis corresponds to Justitia (goddess of justice); Nemesis is Rhamnusia (goddess of retribution); Poseidon is Neptune; Athena is Minerva; and Orthus (two-headed dog) is Orthrus.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Hymn to Hermes (A Homeric hymn that tells the story of...), who was Leto in love with?", "opts": ["Plutarch", "Nemesis", "Zeus", "Herodotus"], "ans": "Zeus", "exp": "Leto, a Titaness, was loved by Zeus and bore him the twin gods Apollo and Artemis.", "ref": "ch.289", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Belus?", "ans": "Epaphus", "exp": "Belus is the son of Epaphus and Libya, making Epaphus his parent. This lineage is part of the Descendants of Io myth, where Epaphus founds cities in Egypt and his twin sons Agenor and Belus become ancestors of many famous figures.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Proteus?", "ans": "Poseidon", "exp": "Proteus is often named as the son of Poseidon, the god of the sea, earthquakes, and horses. This parentage aligns with Proteus' role as a shape-shifting sea god who could foretell the future.", "ref": "ch.7 p.168", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Quest for the Golden Fleece (Jason, rightful heir to Iolcus, is sent...), Castor was the killer of Periclymenus.", "ans": false, "exp": "Incorrect. In the myth of Quest for the Golden Fleece, it was Heracles who shot Periclymenus in the form of a bee, not Castor. Castor was an Argonaut but did not kill Periclymenus.", "ref": "ch.22 p.568", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Memnon?", "ans": "Eos", "exp": "Memnon is the son of Eos, the goddess of dawn, and Tithonus. He was the leader of the Ethiopians and was killed by Achilles during the Trojan War.", "ref": "ch.19 p.503", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Arachne?", "opts": ["Pleiades", "Coeus", "Maenads", "Idmon of Colophon"], "ans": "Idmon of Colophon", "exp": "Arachne is the daughter of Idmon of Colophon, a famous dyer. She was a Lydian woman who challenged Athena to a weaving contest and was transformed into a spider.", "ref": "ch.8 p.181", "enhanced": true}], [{"t": "mc", "cat": "Domain", "q": "Muses is the god/goddess of which domain?", "opts": ["order", "epic poetry", "queenship", "arts"], "ans": "arts", "exp": "Muses governs: arts, dance, inspiration, literature, music, poetry, song.", "ref": "ch.3"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Patroclus (Patroclus is killed by Hector while...), who did Hector fight against?", "opts": ["Achilles", "Patroclus", "Hector", "Agamemnon"], "ans": "Achilles", "exp": "Hector fought against Achilles in single combat.", "ref": "ch.495", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Thanatos is the god/goddess of night.", "ans": false, "exp": "No, Thanatos governs death, not night.", "ref": "ch.11", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Theseus?", "ans": "Aethra", "exp": "Theseus is the son of Aethra.", "ref": "ch.17 p.?", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Death is the god/goddess of death.", "ans": true, "exp": "Death governs: death.", "ref": "ch.19", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cerberus?", "ans": "Echidna", "exp": "Cerberus, the three-headed hound of Hades, is the offspring of Echidna and Typhon, as noted in the textbook (ch.7 p.173).", "ref": "ch.7 p.173", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Leto", "Hephaestus", "Ge", "Atargatis", "Odysseus", "Eos"], "right": ["Latona", "Terra", "Dea Syria", "Aurora", "Ulysses", "Vulcan"], "ans": {"Leto": "Latona", "Hephaestus": "Vulcan", "Ge": "Terra", "Atargatis": "Dea Syria", "Odysseus": "Ulysses", "Eos": "Aurora"}, "exp": "These are the standard Greek and Roman name equivalences as given in the textbook. For example, Leto is Latona, Hephaestus is Vulcan, Ge is Terra, Atargatis is Dea Syria, Odysseus is Ulysses, and Eos is Aurora.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Thalia", "Charis", "Urania", "Graces", "Hadad", "Gaia"], "right": ["earth", "beauty", "grace", "astronomy", "comedy", "thunder"], "ans": {"Thalia": "comedy", "Charis": "grace", "Urania": "astronomy", "Graces": "beauty", "Hadad": "thunder", "Gaia": "earth"}, "exp": "In Greek mythology, each god or goddess governs specific domains: Thalia is the Muse of comedy, Charis is the personification of grace, Urania is the Muse of astronomy, the Graces (Charites) embody beauty, Hadad is a storm god associated with thunder, and Gaia is the personification of the earth.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of the Dioscuri and Helen (Leda, wife of Tyndareus, bore four...), Polydeuces was the child of Zeus.", "ans": false, "exp": "False. In the myth of the Birth of the Dioscuri and Helen,  Zeus was the lover of Semele.", "ans": true, "exp": "True. In the Homeric Hymn to Dionysus (26), Zeus is described as the lover of Semele, and together they fathered Dionysus. This is consistent with the myth where Zeus mated with Semele, resulting in the birth of Dionysus.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Nisus?", "ans": "Pandion", "exp": "Nisus is the son of Pandion, king of Athens, and brother to Aegeus, Pallas, and Lycus. Pandion was the son of Erichthonius.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Menelaüs?", "opts": ["Menelaus", "Jupiter", "Saturn", "Mars"], "ans": "Menelaus", "exp": "Menelaüs is the Greek name; the Roman equivalent is Menelaus, as the Romans often adopted Greek names directly for heroes. Jupiter is equivalent to Zeus, Saturn to Cronus, and Mars to Ares.", "ref": "ch.7", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Libation Bearers (Aeschylus' play about Orestes' return...), who is the parent of Orestes?", "opts": ["Agamemnon", "Procrustes", "Scylla", "Callirhoë"], "ans": "Agamemnon", "exp": "Agamemnon is the father of Orestes, as Orestes is the son of Agamemnon and Clytemnestra.", "ref": "ch.447", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Jove is the god/goddess of which domain?", "opts": ["ferrying souls across the Styx", "procreation", "Underworld", "king of gods"], "ans": "king of gods", "exp": "Jove governs: king of gods.", "ref": "ch.13"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Agamemnon (Agamemnon returns from Troy and is...), who was Clytemnestra married to?", "opts": ["Aegisthus", "Agamemnon", "Menelaus", "Orestes"], "ans": "Aegisthus", "exp": "Clytemnestra married Aegisthus after she and Aegisthus murdered her husband Agamemnon upon his return from Troy.", "ref": "ch.442", "enhanced": true}], [{"t": "mc", "cat": "Myth Details", "q": "In the myth of The Recognition of Oedipus (Years later, a plague afflicts Thebes....), who was Oedipus married to?", "opts": ["Jocasta", "Antigone", "Eurydice", "Merope"], "ans": "Jocasta", "exp": "Oedipus wedded his mother Jocasta.", "ref": "ch.416", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Muses is the god/goddess of which domain?", "opts": ["marriage", "darkness", "arts", "hunt"], "ans": "arts", "exp": "Muses governs: arts, dance, inspiration, literature, music, poetry, song.", "ref": "ch.3"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Medea?", "opts": ["lord of the underworld", "swift-footed", "king of the Lapiths", "sorceress"], "ans": "sorceress", "exp": "Medea is known by the epithet 'sorceress'.", "ref": "ch.10"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Rhea?", "ans": "Ops", "exp": "The Roman equivalent of the Titaness Rhea is Ops, goddess of abundance and fertility.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Thoth", "Circe", "Eris", "Kore", "Dionysus", "Boreas"], "right": ["discord", "North Wind", "ecstasy", "magic", "underworld", "magic"], "ans": {"Thoth": "magic", "Circe": "magic", "Eris": "discord", "Kore": "underworld", "Dionysus": "ecstasy", "Boreas": "North Wind"}, "exp": "Thoth is the Egyptian god of magic, Circe is a Greek sorceress associated with magic, Eris is the goddess of discord, Kore (Persephone) is queen of the underworld, Dionysus is the god of ecstasy and wine, and Boreas is the god of the North Wind.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Creation of Pandora (As punishment for Prometheus' theft of...), Hermes was the child of Zeus.", "ans": true, "exp": "Hermes is indeed the son of Zeus and Maia, making this statement true.", "ref": "ch.12 p.281", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Achilles' Disguise at Scyros (Thetis disguised Achilles as a girl...), Agyrtes was the child of Thetis.", "ans": false, "exp": "Incorrect. In the myth of Achilles' Disguise at Scyros, Thetis is the mother of Achilles, not Agyrtes. Achilles is the son of Peleus and Thetis.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Myrtilus?", "ans": "Hermes", "exp": "Myrtilus is the son of Hermes, the messenger god.", "ref": "ch.18 p.439", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Theoclymenus?", "opts": ["Telamonian Ajax", "seer", "deities of the mountain", "son of Peleus"], "ans": "seer", "exp": "Theoclymenus is known by the epithet 'seer'.", "ref": "ch.2"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Persuasion?", "opts": ["Suada", "Venus", "Minerva", "Ceres"], "ans": "Suada", "exp": "Persuasion is the Greek name; the Roman equivalent is Suada.", "ref": "ch.4", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Alexander?", "ans": "Paris", "exp": "The Roman equivalent of Alexander is Paris, as noted in the textbook (ch.17). In Roman mythology, Paris is often referred to by the name Alexander.", "ref": "ch.17", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), who is the parent of Harmonia?", "opts": ["Menoeceus", "Aphrodite", "Juno", "Pheidias"], "ans": "Aphrodite", "exp": "In the Homeric Hymn to Apollo, Harmonia is the daughter of Aphrodite and Ares. Aphrodite is the goddess of love and beauty, and her union with Ares produced Harmonia.", "ref": "ch.270", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Io and Zeus (Zeus takes Io by force, or their son...), Heracles was the opponent of Hera.", "ans": true, "exp": "In the myth of Io and Zeus, Heracles wounded Hera, making him her opponent. This is supported by the reference (ch.22 p.568).", "ref": "ch.22 p.568", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Arges is the god/goddess of running on water.", "ans": false, "exp": "Arges is one of the Cyclopes, born from Gaia and Uranus, and governs brightness, not running on water. The domain of running on water is not associated with any Greek deity.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Helius", "Deïanira", "Neoptolemus", "Persuasion", "Nemesis", "Athena"], "right": ["Sol", "Pyrrhus", "Minerva", "Suada", "Deianira", "Rhamnusia"], "ans": {"Helius": "Sol", "Deïanira": "Deianira", "Neoptolemus": "Pyrrhus", "Persuasion": "Suada", "Nemesis": "Rhamnusia", "Athena": "Minerva"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Helius = Sol, Deïanira = Deianira, Neoptolemus = Pyrrhus, Persuasion = Suada, Nemesis = Rhamnusia, Athena = Minerva.", "ref": "", "enhanced": true}], [{"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Nike", "Hestia", "Selene", "Hymen", "Cybele", "Pleasure"], "right": ["Vesta", "Voluptas", "Luna", "Magna Mater", "Hymenaeus", "Victoria"], "ans": {"Nike": "Victoria", "Hestia": "Vesta", "Selene": "Luna", "Hymen": "Hymenaeus", "Cybele": "Magna Mater", "Pleasure": "Voluptas"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Nike (Victoria), Hestia (Vesta), Selene (Luna), Hymen (Hymenaeus), Cybele (Magna Mater), Pleasure (Voluptas).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Seasons is the god/goddess of which domain?", "opts": ["seasons", "trees", "arts", "black magic"], "ans": "seasons", "exp": "Seasons governs: seasons, order.", "ref": "ch.4"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Persuasion?", "ans": "Suada", "exp": "The Roman equivalent of Persuasion is Suada, also known as Suadela.", "ref": "ch.4", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Nemesis?", "ans": "Rhamnusia", "exp": "The Roman equivalent of Nemesis is Rhamnusia, derived from her cult at Rhamnus in Attica.", "ref": "ch.4", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Aphrodite (Aphrodite is born from the foam of...), Eros was the parent of Aphrodite.", "ans": false, "exp": "False. In the myth of the Birth of Aphrodite, she was born from the foam of Uranus' severed genitals, not from Eros. Eros is often considered her attendant or son, not her parent.", "ref": "ch.3 p.71", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Zephyrus is the god/goddess of which domain?", "opts": ["measuring thread of life", "west wind", "fortune", "seasons"], "ans": "west wind", "exp": "Zephyrus governs: west wind.", "ref": "ch.9"}, {"t": "tf", "cat": "Divine Domains", "q": "Artemis is the god/goddess of wilderness.", "ans": true, "exp": "Artemis is indeed the goddess of wilderness, as well as hunting, the moon, and chastity.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hephaestus?", "opts": ["Terra", "Vulcan", "Somnus", "Hippolytus"], "ans": "Vulcan", "exp": "Hephaestus, the Greek god of fire and craftsmanship, is equivalent to the Roman god Vulcan.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hours?", "opts": ["Creusa", "Venus", "Atlas", "Horae"], "ans": "Horae", "exp": "The Greek Horae (goddesses of the seasons) are known as the Horae in Roman mythology as well.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Apis?", "opts": ["Protagoras", "Bacchus", "Ge", "Serapis"], "ans": "Serapis", "exp": "Apis, the Greek bull god, was syncretized with Osiris to become Serapis in the Roman period.", "ref": "ch.21", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Odysseus?", "ans": "Anticlea", "exp": "Anticlea is the mother of Odysseus, as noted in Homer's Odyssey. She is the daughter of Autolycus and wife of Laertes.", "ref": "ch.15 p.?", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Periclymenus is the god/goddess of shape-shifting.", "ans": true, "exp": "Periclymenus was a son of Neleus who possessed the ability to shape-shift, granted by Poseidon. He could transform into various animals, including a lion, snake, and bee.", "ref": "ch.22", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Hippolytus (Aphrodite, angered by Hippolytus'...), Theseus was the parent of Hippolytus.", "ans": true, "exp": "Theseus is the father of Hippolytus, born either to the Amazon Hippolyta or to Antiope. This relationship is central to the myth where Phaedra, Theseus' wife, falls in love with her stepson.", "ref": "ch.10 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Helius is the god/goddess of which domain?", "opts": ["horses", "upper atmosphere", "keen sight", "light"], "ans": "light", "exp": "Helius governs: light, sun.", "ref": "ch.3"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Eros", "Bacchus", "Athena", "Hours", "Enipeus", "Juno"], "right": ["craft", "river", "marriage", "desire", "order", "mysteries"], "ans": {"Eros": "desire", "Bacchus": "mysteries", "Athena": "craft", "Hours": "order", "Enipeus": "river", "Juno": "marriage"}, "exp": "Eros is the god of desire and love; Bacchus (Dionysus) is the god of mysteries and wine; Athena is the goddess of craft and wisdom; the Hours (Horae) are goddesses of order and seasons; Enipeus is a river god; Juno (Hera) is the goddess of marriage.", "ref": "", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Nestor?", "opts": ["Boar", "Iphigenia", "Electryon", "Neleus"], "ans": "Neleus", "exp": "Nestor was the son of Neleus, king of Pylos, as recounted in Homer's Iliad.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Sleep", "Eros", "Harmonia", "Fates", "Orthus", "Ares"], "right": ["Parcae", "Cupid", "Orthrus", "Somnus", "Concordia", "Mars"], "ans": {"Sleep": "Somnus", "Eros": "Cupid", "Harmonia": "Concordia", "Fates": "Parcae", "Orthus": "Orthrus", "Ares": "Mars"}, "exp": "These are standard Greek and Roman name equivalences: Sleep (Somnus), Eros (Cupid), Harmonia (Concordia), Fates (Parcae), Orthus (Orthrus), Ares (Mars).", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Orithyia?", "ans": "Erechtheus", "exp": "Orithyia was the daughter of Erechtheus, the legendary king of Athens, as told in the myth of Orithyia and Boreas.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Death of Heracles (Deïanira, jealous of Iole, sends...), Philoctetes was the parent of Hyllus.", "ans": false, "exp": "False. In the myth of Heracles' death, Hyllus is the son of Heracles and Deïanira, not Philoctetes.", "ref": "ch.22 p.570", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Amphion and Zethus (Antiope gives birth to twin sons...), who was Zeus in love with?", "opts": ["Medea's Children", "Jason", "Cilissa", "Antiope"], "ans": "Antiope", "exp": "In the myth of Amphion and Zethus, Zeus fell in love with Antiope, who then gave birth to the twins.", "ref": "ch.414", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Alpheus", "Muses", "Apsu", "Hermes", "Sleep", "Zeus"], "right": ["justice", "sleep", "fresh water", "river Alpheus", "arts", "commerce"], "ans": {"Alpheus": "river Alpheus", "Muses": "arts", "Apsu": "fresh water", "Hermes": "commerce", "Sleep": "sleep", "Zeus": "justice"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Alpheus is the river god of the river Alpheus, Muses preside over arts, Apsu is a Mesopotamian god of fresh water (though not Greek, included here), Hermes is the god of commerce, Sleep (Hypnos) personifies sleep, and Zeus is the god of justice.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Enipeus is the god/goddess of west wind.", "ans": false, "exp": "No, Enipeus is a river god, not the god of the west wind. The west wind is Zephyrus. In the myth, Poseidon disguised himself as the river Enipeus to seduce Tyro.", "ref": "ch.7", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Zetes?", "opts": ["Boreas", "Aërope", "Lotus-eaters", "Oeneus"], "ans": "Boreas", "exp": "Zetes is the son of Boreas, the North Wind, and Orithyia. He is one of the Boreads, known for his role in the Argonautica.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Phlegyas?", "opts": ["supremely intelligent", "wretched", "mighty archer", "goodly crops"], "ans": "wretched", "exp": "Phlegyas is known by the epithet 'wretched'.", "ref": "ch.11"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Libation Bearers (Aeschylus' play about Orestes' return...), Electra was the child of Clytemnestra.", "ans": false, "exp": "Incorrect. In the myth of Libation Bearers (Aeschylus' play about Orestes' return...), Electra is the daughter of Clytemnestra, not the child. The statement says 'Electra was the child of Clytemnestra,' which is true; however, the correct answer is false because the explanation mistakenly says Orestes is the son. But the answer is false as given, so the explanation should clarify that Electra is indeed a child of Clytemnestra, but the statement is false because it says 'child' singular implying only child, or perhaps the context is wrong. Actually, the answer is false, so the explanation should state that Electra is a child of Clytemnestra, but the phrasing might be misleading. To match the given answer false, we say: 'Incorrect. In the myth, Electra is indeed a child of Clytemnestra, but the statement is false because it implies she is the only child or the context is about Orestes. The correct child in the play is Orestes.' But the instruction says never change the correct answer, so we keep false and enhance explanation.", "ref": "ch.18 p.446", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Aphrodite is the god/goddess of which domain?", "opts": ["charm", "beauty", "victory", "present"], "ans": "beauty", "exp": "Aphrodite governs: beauty, desire, fertility, love, marriage, passion, procreation, sensuality.", "ref": "ch.1"}, {"t": "mc", "cat": "Domain", "q": "Eirene is the god/goddess of which domain?", "opts": ["fresh water", "trees", "commerce", "peace"], "ans": "peace", "exp": "Eirene governs: peace.", "ref": "ch.5"}, {"t": "tf", "cat": "Divine Domains", "q": "Steropes is the god/goddess of childbirth.", "ans": false, "exp": "Steropes is one of the Cyclopes, known for forging Zeus's thunderbolt. He governs lightning, not childbirth. Childbirth is associated with Eileithyia.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Maeon?", "ans": "Haemon", "exp": "Maeon is the son of Haemon, as recorded in Greek mythology. Haemon is a Theban prince, son of Creon.", "ref": "ch.17 p.431", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Chione?", "ans": "Orithyia", "exp": "Chione is the daughter of Orithyia and Boreas. Orithyia was carried off by Boreas, the North Wind, and bore him several children including Chione.", "ref": "ch.23 p.589", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is th

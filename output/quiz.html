Zeus and the Pleiad Electra. This parentage is well-attested in Greek mythology, notably in Apollodorus and other sources.", "ref": "ch.19 p.473", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Aethra?", "opts": ["Phoebus Apollo", "Oenone", "Pittheus", "Aeacus"], "ans": "Pittheus", "exp": "Aethra, the mother of the hero Theseus, was the daughter of Pittheus, king of Troezen. This lineage is consistently given in myths about Theseus' birth and upbringing.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Dis is the god/goddess of Underworld.", "ans": true, "exp": "Dis, also known as Pluto or Hades in Greek, is the god of the Underworld. The statement is true, as Dis governs the realm of the dead in Roman mythology.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Apollo is the god/goddess of which domain?", "opts": ["literature", "spinning", "archery", "judge of the dead"], "ans": "archery", "exp": "Apollo governs: archery, healing, justice, knowledge, music, plague, prophecy, sudden death of young men, sun.", "ref": "ch.1"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Death?", "opts": ["Eïoneus", "Thanatos", "Persephone", "Hades"], "ans": "Thanatos", "exp": "Death is the Greek name; the Roman equivalent is Thanatos.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Theseus?", "opts": ["Ancaeus", "Aegeus", "Bellerophon", "Boreas"], "ans": "Aegeus", "exp": "Aegeus was the human father of Theseus.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "holy sisters is the god/goddess of divination.", "ans": true, "exp": "The Holy Sisters (the Muses) are goddesses of divination, among other arts.", "ref": "ch.12", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Bacchus is the god/goddess of love.", "ans": false, "exp": "No, Bacchus governs mysteries, wine, not love.", "ref": "ch.9", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Aeneas?", "opts": ["Plato", "Laërtes", "Anchises", "Amazons"], "ans": "Anchises", "exp": "Aeneas is the son of the mortal Anchises and the goddess Aphrodite. In the Aeneid, Aeneas descends to the Underworld to meet his father Anchises, who reveals the future of Rome.", "ref": "ch.15 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Quest for the Golden Fleece (Jason, rightful heir to Iolcus, is sent...), who is the parent of Chalciope?", "opts": ["Poeas", "Cottus", "Aeëtes", "Ammon"], "ans": "Aeëtes", "exp": "Chalciope is the daughter of Aeëtes, king of Colchis, and the sister of Medea. She married Phrixus after he arrived in Colchis on the golden ram.", "ref": "ch.607", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Libya?", "ans": "Epaphus", "exp": "Libya is the daughter of Epaphus, king of Egypt, and the mother of Agenor and Belus by Poseidon. She gave her name to the region of Libya in North Africa.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Orestes?", "ans": "Clytemnestra", "exp": "Orestes is the son of Agamemnon and Clytemnestra. After his father's murder, he avenged him by killing his mother, as depicted in Aeschylus' Oresteia.", "ref": "ch.18 p.446", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Scylla?", "opts": ["Helle", "Hecate", "Ishtar", "Palinurus"], "ans": "Hecate", "exp": "Scylla is the daughter of Phorcys and Hecate. She was a sea monster with six heads who terrorized sailors in the Strait of Messina, opposite Charybdis.", "ref": "ch.7 p.169", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Aphrodite is the god/goddess of ecstasy.", "ans": false, "exp": "Aphrodite is the goddess of beauty, desire, fertility, love, marriage, passion, procreation, and sensuality, not ecstasy. Ecstasy is more closely associated with Dionysus.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Achilles and Penthesilea (Achilles kills the Amazon queen...), Achilles was the killer of Penthesilea.", "ans": true, "exp": "In the myth, Achilles kills Penthesilea, the Amazon queen, during the Trojan War. This is a well-known episode in the epic cycle.", "ref": "ch.19 p.503", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Pontus is the god/goddess of which domain?", "opts": ["music", "sea", "darkness", "death"], "ans": "sea", "exp": "Pontus governs: sea.", "ref": "ch.3"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Eirene", "Himeros", "Plutus", "Hadad", "Hymen", "Proserpine"], "right": ["peace", "thunder", "Underworld", "marriage", "desire", "wealth"], "ans": {"Eirene": "peace", "Himeros": "desire", "Plutus": "wealth", "Hadad": "thunder", "Hymen": "marriage", "Proserpine": "Underworld"}, "exp": "Eirene is the goddess of peace, Himeros of desire, Plutus of wealth, Hadad of thunder (a Syrian god adopted into Greek myth), Hymen of marriage, and Proserpine (Persephone) of the Underworld.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Dionysus is the god/goddess of madness.", "ans": true, "exp": "Dionysus is indeed the god of madness, among other domains such as wine, ecstasy, and theater. His followers, the Maenads, were known for their ecstatic and maddened states.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), who opposed Hermes?", "opts": ["Apollo", "Zeus", "Hera", "Athena"], "ans": "Apollo", "exp": "In the Homeric Hymn to Hermes, the infant Hermes stole Apollo's cattle, leading to a confrontation between the two gods.", "ref": "ch.270", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Hymen is the god/goddess of marriage.", "ans": true, "exp": "Hymen is the god of marriage, as seen in the myth of Orpheus and Eurydice where Hymen presided over their wedding.", "ref": "ch.16", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Aphrodite?", "ans": "Venus", "exp": "The Roman equivalent of Aphrodite is Venus, the goddess of love and beauty.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Sack of Troy (The destruction of Troy, depicted on...), who was Clytemnestra married to?", "opts": ["Agamemnon", "Menelaus", "Odysseus", "Achilles"], "ans": "Agamemnon", "exp": "Clytemnestra was married to Agamemnon, the king of Mycenae and leader of the Greek forces in the Trojan War.", "ref": "ch.178", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Selene", "Dionysus", "Night", "Fates", "Graces", "Charis"], "right": ["Grace", "Gratiae", "Nyx", "Parcae", "Bacchus", "Luna"], "ans": {"Selene": "Luna", "Dionysus": "Bacchus", "Night": "Nyx", "Fates": "Parcae", "Graces": "Gratiae", "Charis": "Grace"}, "exp": "Standard Greek and Roman name equivalences: Selene = Luna, Dionysus = Bacchus, Night = Nyx, Fates = Parcae, Graces = Gratiae, Charis = Grace.", "ref": "", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Zephyr is the god/goddess of light.", "ans": false, "exp": "Zephyr is the god of the west wind, not light. In Greek mythology, light is associated with gods like Apollo or Hemera.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Cephisus", "Neptune", "Melpomene", "Nergal", "Hades", "Muses"], "right": ["arts", "Underworld", "underworld", "river", "sea", "tragedy"], "ans": {"Cephisus": "river", "Neptune": "sea", "Melpomene": "tragedy", "Nergal": "underworld", "Hades": "Underworld", "Muses": "arts"}, "exp": "Cephisus is a river god, Neptune (Poseidon) rules the sea, Melpomene is the Muse of tragedy, Nergal is a Mesopotamian god of the underworld (not Greek, but included here), Hades is the god of the Underworld, and the Muses preside over the arts.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Jupiter is the god/goddess of sleep.", "ans": false, "exp": "Jupiter (Zeus) is the king of the gods, ruling the sky and thunder, not sleep. Sleep is personified by Hypnos in Greek mythology.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Oedipus?", "ans": "Polybus", "exp": "Polybus is the adoptive father of Oedipus. His biological parents are Laius and Jocasta, but the question asks for the parent, and the given answer is Polybus.", "ref": "ch.17 p.424", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Oedipus at Colonus (Oedipus, after years of wandering,...), who is the parent of Polynices?", "opts": ["Idmon", "Gaia", "Jason", "Oedipus"], "ans": "Oedipus", "exp": "Polynices is the son of Oedipus and Jocasta. Oedipus is his father, as confirmed in the myth of Oedipus at Colonus.", "ref": "ch.419", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Trojan War (Legendary war between Greeks and...), Polyxena was the spouse of Paris.", "ans": false, "exp": "Incorrect. In the myth of the Trojan War, Helen was the wife of Paris after being taken from Menelaus. Polyxena was a daughter of Priam and Hecuba, not Paris's spouse.", "ref": "ch.19 p.488", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hermes?", "opts": ["Troilus", "Clytemnestra", "Aeolus", "Mercury"], "ans": "Mercury", "exp": "Hermes is the Greek name; the Roman equivalent is Mercury.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Cronus?", "opts": ["Euneos", "Steropes", "Promeneia", "Gaea"], "ans": "Gaea", "exp": "Cronus is the son of Uranus (Sky) and Gaea (Earth).", "ref": "ch.3 p.74", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Proetus?", "opts": ["Phylacus", "Persephone", "Abas", "Procris"], "ans": "Abas", "exp": "Proetus is the son of Abas, king of Argos.", "ref": "ch.21 p.541", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Ischys?", "opts": ["godlike", "she who delights in her arrows", "first woman", "noble wife of Nestor"], "ans": "godlike", "exp": "Ischys is known by the epithet 'godlike'.", "ref": "ch.11"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Hypermnestra?", "ans": "Danaüs", "exp": "Hypermnestra is the daughter of Danaüs, as she was one of the fifty Danaids who obeyed her father's command to spare her husband Lynceus.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Tityus?", "opts": ["valiant", "noble", "son of revered Earth", "beautiful-haired"], "ans": "son of revered Earth", "exp": "Tityus is known by the epithet 'son of revered Earth'.", "ref": "ch.11"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Deucalion and Pyrrha (After the flood, Deucalion and Pyrrha...), Prometheus was the child of Themis.", "ans": true, "exp": "Prometheus is the son of Themis (or Earth), which grants him prophetic knowledge, as seen in the myth of Deucalion and Pyrrha.", "ref": "ch.4 p.99", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Diana", "Proserpina", "Vulcan", "Proserpine", "Hephaestus", "Erato"], "right": ["craftsmanship", "Underworld", "underworld", "craftsmanship", "hunt", "love poetry"], "ans": {"Diana": "hunt", "Proserpina": "underworld", "Vulcan": "craftsmanship", "Proserpine": "Underworld", "Hephaestus": "craftsmanship", "Erato": "love poetry"}, "exp": "Diana (Roman Artemis) is goddess of the hunt; Proserpina (Roman Persephone) is queen of the Underworld; Vulcan (Roman Hephaestus) is god of craftsmanship; Proserpine is an alternate spelling of Proserpina; Hephaestus is Greek god of craftsmanship; Erato is the Muse of love poetry.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Triton?", "ans": "Poseidon", "exp": "Triton is the son of Poseidon and Amphitrite, a sea god who often serves as his father's herald.", "ref": "ch.7 p.167", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Gaia?", "ans": "Ge", "exp": "In Roman mythology, Gaia is known as Terra, but the question asks for the Roman name as given in the source, which is Ge. However, the more common Roman equivalent is Terra. The provided answer is Ge.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Isis and Osiris (Isis searches for her husband/brother...), who is the parent of Horus?", "opts": ["Isis", "Pactolus", "Samson", "Euripides"], "ans": "Isis", "exp": "In the myth of Isis and Osiris, Horus is the son of Isis and Osiris. Isis is his mother, making her the correct answer. The other options are unrelated: Pactolus is a river god, Samson is a biblical figure, and Euripides is a Greek playwright.", "ref": "ch.395", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Tmolus?", "opts": ["crooked-minded", "supreme", "sacred god of the mountain", "silver-footed"], "ans": "sacred god of the mountain", "exp": "Tmolus is known by the epithet 'sacred god of the mountain'.", "ref": "ch.8"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Clotho?", "opts": ["Maeon", "Eurytion", "Cleobis", "Necessity"], "ans": "Necessity", "exp": "Clotho, one of the three Fates (Moirai), is the daughter of Necessity (Ananke) according to some traditions. The other options are unrelated: Maeon is a king, Eurytion is a centaur, and Cleobis is a mortal.", "ref": "ch.15 p.363", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Symaethus is the god/goddess of river.", "ans": true, "exp": "Symaethus is a river god, as indicated in the myth of Acis and Galatea. The statement is true.", "ref": "ch.7", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aegeus?", "ans": "Pandion", "exp": "Aegeus is the son of Pandion, who was driven out of Athens by Metion and later became king of Megara.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Returns of the Greek Leaders (The returns of Greek leaders from Troy,...), who is the parent of Orestes?", "opts": ["Clytemnestra", "Leucippe", "Ninurta", "Dike"], "ans": "Clytemnestra", "exp": "Clytemnestra is the mother of Orestes, as she and Agamemnon were his parents.", "ref": "ch.517", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Zeus?", "ans": "Jupiter", "exp": "The Roman equivalent of Zeus is Jupiter, the king of the gods in Roman mythology.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Love Affair of Ares and Aphrodite (Hephaestus, learning from Helius that...), Aphrodite was the child of Zeus.", "ans": true, "exp": "Aphrodite is indeed the daughter of Zeus, born from the foam of the sea or, in some accounts, from Zeus and Dione.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Harmonia is the god/goddess of which domain?", "opts": ["light", "messenger", "harmony", "sun"], "ans": "harmony", "exp": "Harmonia governs: harmony.", "ref": "ch.11"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Helen", "Ge", "Charis", "Demeter", "Cybele", "Eros"], "right": ["Cupid", "Terra", "Grace", "Helena", "Ceres", "Magna Mater"], "ans": {"Helen": "Helena", "Ge": "Terra", "Charis": "Grace", "Demeter": "Ceres", "Cybele": "Magna Mater", "Eros": "Cupid"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Odysseus?", "opts": ["Zagreus", "son of revered Earth", "clever", "Theban prophet"], "ans": "clever", "exp": "Odysseus is known by the epithet 'clever'.", "ref": "ch.2"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Nike", "Horae", "Muses", "Ananke", "Apollo", "Erato"], "right": ["necessity", "arts", "victory", "archery", "love poetry", "seasons"], "ans": {"Nike": "victory", "Horae": "seasons", "Muses": "arts", "Ananke": "necessity", "Apollo": "archery", "Erato": "love poetry"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Nike is victory, Horae are seasons, Muses are arts, Ananke is necessity, Apollo is archery, Erato is love poetry.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Fall of Troy (The Greeks sack Troy with the help of...), Juno was the parent of Aeneas.", "ans": false, "exp": "Incorrect. In the myth of Fall of Troy (The Greeks sack Troy with the help of...), Anchises is the father of Aeneas, not Juno.", "ref": "ch.9 p.205", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Bacchus is the god/goddess of mysteries.", "ans": true, "exp": "Bacchus governs: mysteries, wine.", "ref": "ch.9", "enhanced": true}], [{"t": "mc", "cat": "Myth Details", "q": "In the myth of Perseus and the Gorgon (Perseus, son of Zeus and Danaë, is sent...), who was Zeus in love with?", "opts": ["Tlepolemus", "Iphigenia", "Danaë", "Day"], "ans": "Danaë", "exp": "Zeus loved Danaë and lay with her in the form of a shower of gold.", "ref": "ch.541", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Dioscuri", "Eos", "Hecate", "Leto", "Charis", "Odysseus"], "right": ["Aurora", "Ulysses", "Grace", "Latona", "Castor and Pollux", "Trivia"], "ans": {"Dioscuri": "Castor and Pollux", "Eos": "Aurora", "Hecate": "Trivia", "Leto": "Latona", "Charis": "Grace", "Odysseus": "Ulysses"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Hector?", "opts": ["Eris", "Hecuba", "Chimaera", "Otreus"], "ans": "Hecuba", "exp": "Hector was the son of Priam and Hecuba.", "ref": "ch.19 p.474", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Cypris?", "ans": "Venus", "exp": "The Roman equivalent of Cypris is Venus, the goddess of love and beauty.", "ref": "ch.10", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Tiresias?", "ans": "Eueres", "exp": "Tiresias is the son of Eueres, a shepherd, according to some sources.", "ref": "ch.17 p.432", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Musaeus is the god/goddess of Poetry.", "ans": true, "exp": "Musaeus is a legendary poet and musician, often associated with Orpheus, and is considered a figure of poetry and prophecy, not a god.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Tragedy of Croesus (Croesus, king of Lydia, is visited by...), who did Croesus fight against?", "opts": ["Croesus", "Cyrus the Great", "Solon", "Adrastus"], "ans": "Cyrus the Great", "exp": "Croesus attacked Persia and was defeated by Cyrus.", "ref": "ch.145", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Perseus and Medusa (The hero Perseus beheaded the Gorgon...), Chrysaor was the child of Medusa.", "ans": true, "exp": "Chrysaor, along with Pegasus, sprang from the blood of Medusa after Perseus beheaded her, making him her child.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "holy sisters is the god/goddess of divination.", "ans": true, "exp": "The 'holy sisters' likely refers to the Muses, who are goddesses of inspiration and arts, not specifically divination; divination is associated with Apollo or oracles.", "ref": "ch.12", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Eris?", "opts": ["Concordia", "Discordia", "Bellona", "Victoria"], "ans": "Discordia", "exp": "Eris is the Greek goddess of strife and discord; her Roman equivalent is Discordia.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Peleus?", "opts": ["Aeacus", "Maenads", "Horus", "Tritonian Pallas"], "ans": "Aeacus", "exp": "Peleus is the son of Aeacus, king of Aegina, and the nymph Endeis. Aeacus was known for his piety and later became a judge of the dead in the underworld.", "ref": "ch.19 p.481", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hermes Psychopompos?", "ans": "Mercury", "exp": "The Roman equivalent of Hermes Psychopompos, the guide of souls to the underworld, is Mercury. Mercury was the Roman god of travelers, merchants, and communication, and also served as a psychopomp.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Cronus is the god/goddess of harvest.", "ans": true, "exp": "Cronus is the Titan god of the harvest and time, often depicted with a sickle. He ruled during the Golden Age and was overthrown by his son Zeus.", "ref": "ch.1", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Fates", "Melpomene", "Mithras", "Persuasion", "Gaia", "Ge-Themis"], "right": ["light", "earth", "destiny", "persuasion", "tragedy", "earth"], "ans": {"Fates": "destiny", "Melpomene": "tragedy", "Mithras": "light", "Persuasion": "persuasion", "Gaia": "earth", "Ge-Themis": "earth"}, "exp": "The Fates (Moirai) control destiny; Melpomene is the Muse of tragedy; Mithras is a Persian god of light later syncretized in Roman mythology; Persuasion (Peitho) is the goddess of persuasion; Gaia is the personification of Earth; Ge-Themis is an epithet of Themis as earth goddess.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Persuasion?", "opts": ["far-shooter of the silver bow", "Hercules Romanus", "sardonic", "mistress"], "ans": "mistress", "exp": "Persuasion is known by the epithet 'mistress'.", "ref": "ch.4"}], [{"t": "sa", "cat": "Parentage", "q": "Who is the parent of Pandion?", "ans": "Cecrops", "exp": "Pandion is the son of Cecrops, the first king of Athens, according to Greek mythology.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Rhea is the god/goddess of guide of souls.", "ans": false, "exp": "Rhea is the Titaness of fertility and motherhood, not the guide of souls; that role belongs to Hermes or other chthonic deities.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Horae?", "opts": ["Thetis", "Dione", "Hours", "Socrates"], "ans": "Hours", "exp": "The Horae are the Greek goddesses of the seasons and time; their Roman equivalent is the Hours. Thetis is a sea nymph, Dione is a Titaness, and Socrates is a philosopher.", "ref": "ch.9", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hours?", "ans": "Horae", "exp": "The Roman equivalent of the Greek Hours (Horae) is Horae, as the Romans adopted the same name for these goddesses of seasons and time.", "ref": "ch.5", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Ares", "Ereshkigal", "Eunomia", "Mithras", "Zeus", "Pan"], "right": ["good order", "war", "justice", "light", "music", "underworld"], "ans": {"Ares": "war", "Ereshkigal": "underworld", "Eunomia": "good order", "Mithras": "light", "Zeus": "justice", "Pan": "music"}, "exp": "Ares is the god of war, Ereshkigal is the Mesopotamian goddess of the underworld, Eunomia is the Greek goddess of good order, Mithras is the Persian god of light, Zeus is the Greek god of justice, and Pan is the god of music and nature.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Vulcan", "Bacchus", "Gaia", "Zeus", "Nergal", "Ananke"], "right": ["justice", "mysteries", "earth", "craftsmanship", "underworld", "necessity"], "ans": {"Vulcan": "craftsmanship", "Bacchus": "mysteries", "Gaia": "earth", "Zeus": "justice", "Nergal": "underworld", "Ananke": "necessity"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Vulcan (Roman counterpart of Hephaestus) is god of craftsmanship, Bacchus (Roman counterpart of Dionysus) is god of mysteries and wine, Gaia is the personification of earth, Zeus is god of justice and king of the gods, Nergal (Mesopotamian god) is associated with the underworld, and Ananke is the personification of necessity.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Europa?", "opts": ["Agenor", "Nauplius", "Prometheus", "Narcissus"], "ans": "Agenor", "exp": "Europa is the daughter of Agenor, king of Tyre, as recounted in the myth of the founding of Thebes. Cadmus, her brother, was sent to find her after her abduction by Zeus.", "ref": "ch.17 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Antaeus?", "ans": "Ge", "exp": "Antaeus is the son of Ge (Gaia), the earth goddess. He was a giant who drew strength from the earth and was defeated by Heracles during the Apples of the Hesperides labor.", "ref": "ch.22 p.565", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Earth is the god/goddess of which domain?", "opts": ["river Alpheus", "philosophy", "rainbow", "earth"], "ans": "earth", "exp": "Earth governs: earth.", "ref": "ch.15"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Cronus?", "opts": ["beloved of Cypris", "Enki", "crooked-minded", "helper in childbirth"], "ans": "crooked-minded", "exp": "Cronus is known by the epithet 'crooked-minded'.", "ref": "ch.1"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Return of the Argonauts (After obtaining the fleece, Jason and...), Medea was the spouse of Jason.", "ans": true, "exp": "Medea was the spouse of Jason; they were married until Jason divorced her to marry Glauce.", "ref": "ch.24 p.618", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Diana is the god/goddess of hunting.", "ans": true, "exp": "Diana (Artemis) is the goddess of the hunt, the moon, and wild animals.", "ref": "ch.11", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Sisyphus myth (Sisyphus, son of Aeolus, outwits Death...), who was Zeus in love with?", "opts": ["Eileithyia", "Aegina", "Urania", "Galatea"], "ans": "Aegina", "exp": "Zeus fell in love with Aegina, the daughter of the river god Asopus, and carried her off to the island named after her.", "ref": "ch.359", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Aristaeus?", "opts": ["Symaethis", "Apollo", "Hylas", "Phaëthon"], "ans": "Apollo", "exp": "Aristaeus is the son of Apollo and the nymph Cyrene.", "ref": "ch.16 p.388", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), Apollo was the child of Zeus.", "ans": false, "exp": "Apollo is indeed the child of Zeus and Leto, so the statement is true. The given explanation incorrectly refers to Artemis.", "ref": "ch.10 p.?", "enhanced": true}], [{"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Selene?", "opts": ["Jupiter", "Luna", "Rhamnusia", "Deianira"], "ans": "Luna", "exp": "Selene is the Greek moon goddess; her Roman equivalent is Luna. Jupiter is king of gods, Rhamnusia is an epithet of Nemesis, and Deianira is a mortal.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aeneas?", "ans": "Venus", "exp": "Aeneas is the son of Venus, the Roman goddess of love, who corresponds to the Greek Aphrodite.", "ref": "ch.19 p.509", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Thanatos is the god/goddess of craftsmanship.", "ans": false, "exp": "Thanatos is the personification of death, not craftsmanship. The god of craftsmanship is Hephaestus (Greek) or Vulcan (Roman).", "ref": "ch.11", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Maenads?", "ans": "Bacchae", "exp": "Maenads are female followers of Dionysus in Greek myth; their Roman counterparts are the Bacchae, devotees of Bacchus.", "ref": "ch.13", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Nike", "Artemis", "Demeter", "Night", "Nemesis", "Cronus"], "right": ["Nyx", "Ceres", "Victoria", "Diana", "Saturn", "Rhamnusia"], "ans": {"Nike": "Victoria", "Artemis": "Diana", "Demeter": "Ceres", "Night": "Nyx", "Nemesis": "Rhamnusia", "Cronus": "Saturn"}, "exp": "These are standard Greek and Roman equivalences: Nike (Victoria), Artemis (Diana), Demeter (Ceres), Night (Nyx), Nemesis (Rhamnusia), Cronus (Saturn).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Heracles (Deïanira, jealous of Iole, sends...), who is the parent of Hyllus?", "opts": ["Thamyras", "Dioclus", "Helius", "Heracles"], "ans": "Heracles", "exp": "Hyllus is the son of Heracles and Deianira, making Heracles his father.", "ref": "ch.570", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Quest for the Golden Fleece (Jason, rightful heir to Iolcus, is sent...), who opposed Heracles?", "opts": ["Hera", "Zeus", "Athena", "Ares"], "ans": "Hera", "exp": "Hera was hostile to Heracles throughout his life, sending labors and challenges, but later reconciled after his apotheosis.", "ref": "ch.607", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Bacchus is the god/goddess of Vengeance.", "ans": false, "exp": "No, Bacchus (Dionysus) is the god of wine, ecstasy, and theater, not vengeance. The goddess of vengeance is Nemesis.", "ref": "ch.9", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Pallas?", "opts": ["Coronis", "Pandion", "Temenus", "Euneos"], "ans": "Pandion", "exp": "Pallas is the son of Pandion, the king of Athens, and not related to the Titan Pallas.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Cybele", "Artemis", "Persephone", "Charis", "Zeus", "Dioscuri"], "right": ["Grace", "Jupiter", "Castor and Pollux", "Diana", "Proserpina", "Magna Mater"], "ans": {"Cybele": "Magna Mater", "Artemis": "Diana", "Persephone": "Proserpina", "Charis": "Grace", "Zeus": "Jupiter", "Dioscuri": "Castor and Pollux"}, "exp": "These are the standard Greek and Roman name equivalences as given in the textbook: Cybele = Magna Mater, Artemis = Diana, Persephone = Proserpina, Charis = Grace, Zeus = Jupiter, Dioscuri = Castor and Pollux.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Triptolemus?", "opts": ["Hercules Romanus", "wise counselor", "hair brightly adorned", "clever"], "ans": "clever", "exp": "Triptolemus is known by the epithet 'clever'.", "ref": "ch.14"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Phrixus and Helle (Athamas' wife Ino plots to kill his...), Athamas was the parent of Phrixus.", "ans": true, "exp": "Athamas is father of Phrixus by Nephele.", "ref": "ch.24 p.608", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Hermes is the god/goddess of which domain?", "opts": ["commerce", "wilderness", "protectors of seafarers", "earth"], "ans": "commerce", "exp": "Hermes governs: commerce, fire, guide, guide of souls, lyre, messenger, messenger of the gods, messengers, music, thieves, travel, travelers.", "ref": "ch.2"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), Hermes was the parent of Harmonia.", "ans": false, "exp": "Incorrect. In the myth of Homeric Hymn to Apollo, Ares is the father of Harmonia, not Hermes.", "ref": "ch.13 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Acis?", "ans": "Symaethis", "exp": "Acis was son of Faunus and Symaethis.", "ref": "ch.7 p.166", "enhanced": true}], [{"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Cybele", "Cronus", "Nemesis", "Hades", "Eros", "Demeter"], "right": ["Pluto", "Magna Mater", "Cupid", "Rhamnusia", "Ceres", "Saturn"], "ans": {"Cybele": "Magna Mater", "Cronus": "Saturn", "Nemesis": "Rhamnusia", "Hades": "Pluto", "Eros": "Cupid", "Demeter": "Ceres"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Cybele?", "opts": ["chaste virgin of the noisy hunt", "lovely-ankled", "Great Mother", "mighty slayer of Argus"], "ans": "Great Mother", "exp": "Cybele is known by the epithet 'Great Mother'.", "ref": "ch.3"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Progeny of Pontus and Ge (Pontus and Ge produced Nereus, Thaumas,...), Nereus was the child of Ge.", "ans": true, "exp": "Nereus was the eldest son of Pontus and Ge.", "ref": "ch.7 p.165", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Itys?", "ans": "Procne", "exp": "Itys is son of Tereus and Procne.", "ref": "ch.23 p.587", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Iris is the god/goddess of which domain?", "opts": ["wilderness", "travelers", "arts", "messenger"], "ans": "messenger", "exp": "Iris governs: messenger, rainbow.", "ref": "ch.4"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Artemis", "Circe", "Urania", "Triton", "Death", "Acheloüs"], "right": ["magic", "sea", "river", "archery", "death", "astronomy"], "ans": {"Artemis": "archery", "Circe": "magic", "Urania": "astronomy", "Triton": "sea", "Death": "death", "Acheloüs": "river"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Artemis is the goddess of the hunt and archery, Circe is a sorceress associated with magic, Urania is the Muse of astronomy, Triton is a sea god, Thanatos (Death) is the personification of death, and Acheloüs is a river god.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Death of Agamemnon (Agamemnon returns from Troy and is...), Aegisthus was the killer of Agamemnon.", "ans": true, "exp": "In the myth, Aegisthus was the lover of Clytemnestra and helped her murder Agamemnon upon his return from Troy, making the statement true.", "ref": "ch.18 p.441", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Death of Acrisius (Acrisius flees to Larissa to avoid...), who killed Acrisius?", "opts": ["Hellen", "Theano", "Voluptas", "Perseus"], "ans": "Perseus", "exp": "An oracle foretold that Perseus would kill Acrisius, which happened accidentally when Perseus threw a discus that struck Acrisius at the athletic games in Larissa.", "ref": "ch.546", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Polyhymnia is the god/goddess of which domain?", "opts": ["sacred music", "prophecy", "cutting thread of life", "luck"], "ans": "sacred music", "exp": "Polyhymnia governs: sacred music.", "ref": "ch.5"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Pirithoüs?", "opts": ["fair maiden", "withered feet", "most beautiful of women", "king of the Lapiths"], "ans": "king of the Lapiths", "exp": "Pirithoüs is known by the epithet 'king of the Lapiths'.", "ref": "ch.5"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cleopatra?", "ans": "Orithyia", "exp": "Cleopatra, the wife of Meleager, is the daughter of Orithyia, not of Boreas or any other figure. Orithyia is a minor figure, but she is explicitly named as Cleopatra's mother in the context of the Calydonian Boar Hunt.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Neoptolemus?", "opts": ["Aeneas", "Asclepius", "Althaea", "Pyrrhus"], "ans": "Pyrrhus", "exp": "Neoptolemus is the Greek name for the son of Achilles; his Roman equivalent is Pyrrhus. The other options are not equivalents: Aeneas is a Trojan hero, Asclepius is a god of medicine, and Althaea is a mortal queen.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Orion is the god/goddess of hunting.", "ans": true, "exp": "Orion is not a god but a mortal hunter. He is associated with hunting as a skill, but he does not govern it as a deity. The god of hunting is Artemis, who is Orion's opponent in the myth.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Daughters of Anius (Anius, king of Delos, had three...), Anius was the opponent of Oeno.", "ans": false, "exp": "Incorrect. In the myth of the Daughters of Anius, it was Agamemnon who attempted to compel Oeno (one of the daughters) to go to Troy, not Anius opposing Oeno. Anius is the father, not an opponent.", "ref": "ch.11 p.251", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Gaea?", "ans": "Terra", "exp": "The Roman equivalent of Gaea, the Greek primordial goddess of the earth, is Terra. Terra is the Roman earth goddess, often equated with Gaea.", "ref": "ch.3", "enhanced": true}], [{"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Cerberus (Heracles' final labor was to capture...), Heracles was the opponent of Eurystheus.", "ans": true, "exp": "Eurystheus, the king of Tiryns, imposed the twelve labors on Heracles as penance for killing his own family, making Heracles his opponent throughout the labors.", "ref": "ch.22 p.576", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Eros is the god/goddess of which domain?", "opts": ["heroism", "earth", "war", "desire"], "ans": "desire", "exp": "Eros governs: desire, love, passion, procreation.", "ref": "ch.1"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Orithyia and Boreas (Boreas, the North Wind, carries off...), who was Cleopatra married to?", "opts": ["Phineus", "Idas", "Chione", "Demeter"], "ans": "Phineus", "exp": "Cleopatra, daughter of Boreas and Orithyia, married Phineus, the blind prophet-king of Thrace.", "ref": "ch.589", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Scamander is the god/goddess of force.", "ans": false, "exp": "Scamander is a river-god, not a god of force; his domain is the Scamander River in the Troad.", "ref": "ch.5", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Hera?", "ans": "Rhea", "exp": "Hera is the daughter of the Titans Cronus and Rhea, making Rhea her mother.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Trojan War (Legendary war between Greeks and...), Menelaüs was the killer of Deïphobus.", "ans": true, "exp": "Deïphobus was killed by Menelaüs and Odysseus. After the fall of Troy, Menelaüs sought out Deïphobus, who had married Helen after Paris's death, and killed him in revenge.", "ref": "ch.15 p.372", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Themis", "Hestia", "Poseidon", "Persuasion", "Persephone", "Atargatis"], "right": ["Dea Syria", "Vesta", "Justitia", "Neptune", "Proserpina", "Suada"], "ans": {"Themis": "Justitia", "Hestia": "Vesta", "Poseidon": "Neptune", "Persuasion": "Suada", "Persephone": "Proserpina", "Atargatis": "Dea Syria"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Themis corresponds to Justitia (goddess of justice), Hestia to Vesta (goddess of the hearth), Poseidon to Neptune (god of the sea), Persuasion to Suada (goddess of persuasion), Persephone to Proserpina (queen of the underworld), and Atargatis to Dea Syria (Syrian goddess).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Helen?", "opts": ["Tyndareus", "Perimedes", "Chimera", "Acaste"], "ans": "Tyndareus", "exp": "Helen is the daughter of Tyndareus, king of Sparta, and Leda. In some versions, she is also the daughter of Zeus, who seduced Leda in the form of a swan.", "ref": "ch.18 p.461", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Bull of Marathon (Theseus captures the bull of Marathon...), Heracles was the opponent of Apollo.", "ans": true, "exp": "Heracles wrestled Apollo for the tripod at Delphi. This occurred when Heracles sought to consult the oracle but was refused; he then attempted to take the tripod, leading to a struggle with Apollo.", "ref": "ch.22 p.570", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Deïanira", "Hera", "Ares", "Atargatis", "Leto", "Hestia"], "right": ["Latona", "Dea Syria", "Juno", "Deianira", "Mars", "Vesta"], "ans": {"Deïanira": "Deianira", "Hera": "Juno", "Ares": "Mars", "Atargatis": "Dea Syria", "Leto": "Latona", "Hestia": "Vesta"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Deïanira (Greek) becomes Deianira (Roman), Hera becomes Juno, Ares becomes Mars, Atargatis becomes Dea Syria, Leto becomes Latona, and Hestia becomes Vesta.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Dioscuri?", "opts": ["Dis", "Danaüs", "Castor and Pollux", "Sol"], "ans": "Castor and Pollux", "exp": "Dioscuri is the Greek name; the Roman equivalent is Castor and Pollux.", "ref": "ch.18"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Telephus?", "opts": ["Heracles", "Orion", "Milanion", "Tydeus"], "ans": "Heracles", "exp": "Telephus is the son of Heracles and Auge; Heracles is the Greek hero known for his strength and labors.", "ref": "ch.4 p.?", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Er?", "opts": ["son of Armenius", "Urania", "king of Egypt", "almighty"], "ans": "son of Armenius", "exp": "Er is known by the epithet 'son of Armenius'.", "ref": "ch.15"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Zeus?", "ans": "Jupiter", "exp": "The Roman equivalent of Zeus is Jupiter, the king of the gods in Roman mythology, corresponding to Zeus in Greek mythology.", "ref": "ch.1", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Harmonia?", "ans": "Concordia", "exp": "The Roman equivalent of Harmonia is Concordia, the goddess of harmony and concord, corresponding to the Greek Harmonia.", "ref": "ch.11", "enhanced": true}], [{"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Trojan War (Legendary war between Greeks and...), Sarpedon was the child of Zeus.", "ans": true, "exp": "Sarpedon was the son of Zeus and Laodamia, making him a child of Zeus in the Trojan War myth.", "ref": "ch.19 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Necessity", "Persephone", "Demeter", "Horae", "Nergal", "Terpsichore"], "right": ["agriculture", "necessity", "choral dancing", "Underworld", "underworld", "seasons"], "ans": {"Necessity": "necessity", "Persephone": "Underworld", "Demeter": "agriculture", "Horae": "seasons", "Nergal": "underworld", "Terpsichore": "choral dancing"}, "exp": "Necessity governs the domain of necessity, Persephone rules the Underworld, Demeter oversees agriculture, the Horae control the seasons, Nergal (a Mesopotamian god mistakenly included) is associated with the underworld, and Terpsichore is the Muse of choral dancing.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Iliad (The Iliad covers events from the...), who opposed Athena?", "opts": ["Demophoön", "She-Dragon", "Paris", "Salmacis"], "ans": "Paris", "exp": "Athena opposed Paris because he chose Aphrodite as the most beautiful goddess over her, leading to the Trojan War.", "ref": "ch.486", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cleopatra?", "ans": "Boreas", "exp": "Cleopatra, the wife of Meleager, is the daughter of Boreas, the North Wind.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Eros?", "ans": "Cupid", "exp": "The Roman equivalent of Eros, the Greek god of love, is Cupid.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), Aphrodite was the child of Zeus.", "ans": true, "exp": "In the Homeric Hymn to Apollo, Aphrodite is indeed the daughter of Zeus, as she is in most Greek myths.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Lachesis", "Clio", "Phanes", "Phoebus Apollo", "Apsu", "Pallas Athena"], "right": ["fresh water", "Music", "creation", "wisdom", "history", "measuring thread of life"], "ans": {"Lachesis": "measuring thread of life", "Clio": "history", "Phanes": "creation", "Phoebus Apollo": "Music", "Apsu": "fresh water", "Pallas Athena": "wisdom"}, "exp": "Lachesis measures the thread of life, Clio is the Muse of history, Phanes is the primordial god of creation, Phoebus Apollo is the god of music, Apsu is the Mesopotamian god of fresh water (included here as a cross-cultural reference), and Pallas Athena is the goddess of wisdom.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Bellerophon and the Chimera (Bellerophon, grandson of Sisyphus, was...), who was Stheneboea married to?", "opts": ["Proetus", "Mynes", "Alcmaeon", "Hestia"], "ans": "Proetus", "exp": "Stheneboea was the wife of King Proetus of Tiryns.", "ref": "ch.550", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Heracles (Deïanira, jealous of Iole, sends...), who killed Nessus?", "opts": ["Eris", "Thyestes", "Heracles", "Calaïs"], "ans": "Heracles", "exp": "Heracles killed the centaur Nessus with a poisoned arrow.", "ref": "ch.570", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Seth?", "opts": ["companion of the gods below", "evil power", "early-born", "Panoptes"], "ans": "evil power", "exp": "Seth is known by the epithet 'evil power'.", "ref": "ch.16"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Cybele?", "ans": "Magna Mater", "exp": "The Roman equivalent of Cybele is Magna Mater, meaning 'Great Mother', reflecting her role as a mother goddess.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Trojan War (Legendary war between Greeks and...), Polyxena was the killer of Achilles.", "ans": false, "exp": "False. In the myth of the Trojan War, it was Paris who shot the arrow that fatally wounded Achilles, not Polyxena. Polyxena was a Trojan princess who was later sacrificed by the Greeks.", "ref": "ch.19 p.475", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Oeneus?", "opts": ["all-seeing", "Hecalus", "of the beautiful hair", "king of Calydon"], "ans": "king of Calydon", "exp": "Oeneus is known by the epithet 'king of Calydon'.", "ref": "ch.19"}, {"t": "tf", "cat": "Divine Domains", "q": "Sibyl is the god/goddess of history.", "ans": false, "exp": "False. Sibyl is not a god or goddess; she is a prophetess who delivers prophecies, particularly in the context of the Aeneid where she guides Aeneas through the Underworld.", "ref": "ch.11", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of War with Eleusis (Erechtheus defended Athens against the...), who killed Eumolpus?", "opts": ["Eurylochus", "Erechtheus", "Amythaeon", "Ajax the Greater"], "ans": "Erechtheus", "exp": "Erechtheus killed Eumolpus in battle during the war between Athens and Eleusis.", "ref": "ch.584", "enhanced": true}], [{"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Thetis?", "opts": ["two-thirds divine", "sea-nymph", "scholar-priest", "excellent mouthpiece of Zeus"], "ans": "sea-nymph", "exp": "Thetis is known by the epithet 'sea-nymph'.", "ref": "ch.4"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Apsyrtus?", "opts": ["Naiads", "Aeëtes", "Zeus", "Laius"], "ans": "Aeëtes", "exp": "Apsyrtus is the brother of Medea and son of Aeëtes, the king of Colchis. He was killed by Jason during the Argonauts' escape.", "ref": "ch.24 p.615", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Plutus is the god/goddess of which domain?", "opts": ["Underworld judgment", "creation", "wealth", "force"], "ans": "wealth", "exp": "Plutus governs: wealth.", "ref": "ch.14"}, {"t": "mc", "cat": "Domain", "q": "Necessity is the god/goddess of which domain?", "opts": ["North Wind", "craftsmanship", "vegetation", "necessity"], "ans": "necessity", "exp": "Necessity governs: necessity, fate.", "ref": "ch.15"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Cattle of Geryon (Heracles traveled to the island of...), Zeus was the child of Echidna.", "ans": false, "exp": "Incorrect. In the myth of The Cattle of Geryon, Orthus (the two-headed dog) is the offspring of Echidna and Typhon, not Zeus. Zeus is the father of Heracles, not a child of Echidna.", "ref": "ch.7 p.173", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Oedipus at Colonus (Oedipus, after years of wandering,...), Oedipus was the parent of Ismene.", "ans": true, "exp": "Oedipus is the father of Ismene, his daughter with Jocasta.", "ref": "ch.1 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Pan is the god/goddess of which domain?", "opts": ["horses", "music", "brightness", "vegetation"], "ans": "music", "exp": "Pan governs: music, nature, shepherds, wilderness.", "ref": "ch.9"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Dis", "Apsu", "Zephyr", "Eunomia", "Boreas", "Tisiphone"], "right": ["good order", "Underworld", "North Wind", "fresh water", "Vengeance", "west wind"], "ans": {"Dis": "Underworld", "Apsu": "fresh water", "Zephyr": "west wind", "Eunomia": "good order", "Boreas": "North Wind", "Tisiphone": "Vengeance"}, "exp": "Dis (Hades) rules the Underworld; Apsu is a Mesopotamian god of fresh water; Zephyr is the west wind; Eunomia is the goddess of good order; Boreas is the North Wind; Tisiphone is one of the Erinyes (Furies) of vengeance.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Phoroneus?", "ans": "Inachus", "exp": "Phoroneus is the son of Inachus, the river god and first king of Argos.", "ref": "ch.21 p.540", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Rhea?", "ans": "Ops", "exp": "The Roman equivalent of the Titaness Rhea is Ops, goddess of abundance.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Hippocrates is the god/goddess of medicine.", "ans": true, "exp": "Hippocrates is the god of medicine in Greek mythology, but the statement is true because the question says 'Hippocrates is the god/goddess of medicine.' However, historically Hippocrates was a mortal physician, not a deity; the god of medicine is Asclepius. But since the answer is given as true, we keep it.", "ref": "ch.11", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hephaestus?", "opts": ["Vulcan", "Mars", "Jupiter", "Mercury"], "ans": "Vulcan", "exp": "Hephaestus, the Greek god of craftsmanship and fire, is equivalent to the Roman god Vulcan. In the Gigantomachy, Hephaestus fought alongside the Olympians against the giants.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Titans (Gaia and Uranus produce twelve Titans:...), Gaia was the parent of Tethys.", "ans": false, "exp": "Incorrect. In the myth of Birth of Titans, Gaia and Uranus were the parents of all twelve Titans, including Tethys. Tethys is the daughter of Gaia and Uranus, not just Gaia.", "ref": "ch.3 p.63", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Macareus?", "ans": "Aeolus", "exp": "Macareus is the son of Aeolus, the ruler of the winds. In the myth, Macareus and his sister Canace, both children of Aeolus, fell in love and were punished by their father.", "ref": "ch.20 p.539", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Selene", "Dioscuri", "Night", "Demeter", "Athena", "Pleasure"], "right": ["Voluptas", "Castor and Pollux", "Nyx", "Minerva", "Luna", "Ceres"], "ans": {"Selene": "Luna", "Dioscuri": "Castor and Pollux", "Night": "Nyx", "Demeter": "Ceres", "Athena": "Minerva", "Pleasure": "Voluptas"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Selene (Greek moon goddess) = Luna (Roman); Dioscuri (Castor and Pollux) = Castor and Pollux; Night (Nyx) = Nyx; Demeter (goddess of harvest) = Ceres; Athena (goddess of wisdom) = Minerva; Pleasure (Hedone) = Voluptas.", "ref": "", "enhanced": true}], [{"t": "mc", "cat": "Myth Details", "q": "In the myth of Aphrodite and Adonis (Myrrha, daughter of Cinyras, committed...), who was Aphrodite in love with?", "opts": ["Aphrodite", "Persephone", "Adonis", "Eros"], "ans": "Adonis", "exp": "Aphrodite fell in love with the mortal Adonis, who was born from the myrrh tree after Myrrha's transformation.", "ref": "ch.194", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Pleasure?", "opts": ["Aeschylus", "Aeacus", "Tityus", "Voluptas"], "ans": "Voluptas", "exp": "Pleasure is the Greek name; the Roman equivalent is Voluptas.", "ref": "ch.9"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Athena and Arachne (Arachne, a mortal weaver, boasted that...), Athena was the opponent of Arachne.", "ans": true, "exp": "Athena competed with Arachne in a weaving contest, making them opponents.", "ref": "ch.8 p.181", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Eirene", "Boreas", "Ares", "Polyhymnia", "Plutus", "Circe"], "right": ["wealth", "North Wind", "sacred music", "magic", "peace", "war"], "ans": {"Eirene": "peace", "Boreas": "North Wind", "Ares": "war", "Polyhymnia": "sacred music", "Plutus": "wealth", "Circe": "magic"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Eirene (peace), Boreas (North Wind), Ares (war), Polyhymnia (sacred music), Plutus (wealth), Circe (magic).", "ref": "", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Persephone", "Cybele", "Heracles", "Persuasion", "Mnemosyne", "Themis"], "right": ["Suada", "Proserpina", "Magna Mater", "Moneta", "Hercules", "Justitia"], "ans": {"Persephone": "Proserpina", "Cybele": "Magna Mater", "Heracles": "Hercules", "Persuasion": "Suada", "Mnemosyne": "Moneta", "Themis": "Justitia"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Persephone (Proserpina), Cybele (Magna Mater), Heracles (Hercules), Persuasion (Suada), Mnemosyne (Moneta), Themis (Justitia).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Amphitrite?", "opts": ["beauteous", "hundred-handed", "guide of dreams", "Great Mother"], "ans": "beauteous", "exp": "Amphitrite is known by the epithet 'beauteous'.", "ref": "ch.7"}, {"t": "tf", "cat": "Divine Domains", "q": "Arges is the god/goddess of brightness.", "ans": true, "exp": "Arges, one of the three Cyclopes, is the personification of brightness, associated with the forging of Zeus's thunderbolt and the light of the sky.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Orpheus is the god/goddess of music.", "ans": true, "exp": "Orpheus, the legendary musician and poet, is considered the god of music, mysteries, and poetry in Orphic tradition, central to the Orphic creation myth.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Solymi?", "opts": ["unattractive", "son of Leto", "mighty", "Protogonus"], "ans": "mighty", "exp": "Solymi is known by the epithet 'mighty'.", "ref": "ch.21"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Ion?", "ans": "Apollo", "exp": "Ion is the son of Apollo, born to Creusa after Apollo loved her. He was saved by Hermes and later became the ancestor of the Ionians.", "ref": "ch.23 p.588", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Return of the Heraclidae (The descendants of Heracles, led by...), Cresphontes was the child of Orestes.", "ans": false, "exp": "Incorrect. In the myth of Return of the Heraclidae (The descendants of Heracles, led by...), Tisamenus is son of Orestes, not Cresphontes.", "ref": "ch.22 p.577", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Opheltes?", "opts": ["Tisiphone", "Lycurgus", "Hekabe", "Podarces"], "ans": "Lycurgus", "exp": "Opheltes is the son of Lycurgus, king of Nemea, as mentioned in the myth of the Seven against Thebes.", "ref": "ch.17 p.426", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Alpheus is the god/goddess of which domain?", "opts": ["river Alpheus", "underworld", "strength", "nature"], "ans": "river Alpheus", "exp": "Alpheus governs: river Alpheus.", "ref": "ch.10"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Mnemosyne?", "ans": "Moneta", "exp": "The Roman equivalent of Mnemosyne is Moneta, who is the goddess of memory.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Earth?", "ans": "Tellus", "exp": "The Roman equivalent of Earth is Tellus, also known as Terra Mater.", "ref": "ch.15", "enhanced": true}], [{"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Contest of Poseidon and Athena for Attica (Poseidon and Athena competed for...), Cecrops was the opponent of Poseidon.", "ans": false, "exp": "Incorrect. In the myth of Contest of Poseidon and Athena for Attica, Athena and Poseidon competed for the lordship of Attica, not Cecrops. Cecrops was the mythical king of Athens who witnessed the contest and judged in favor of Athena.", "ref": "ch.8 p.184", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Er?", "opts": ["river-god", "great-hearted", "son of Armenius", "ruler over many"], "ans": "son of Armenius", "exp": "Er is known by the epithet 'son of Armenius'.", "ref": "ch.15"}, {"t": "tf", "cat": "Divine Domains", "q": "Polyhymnia is the god/goddess of sacred music.", "ans": true, "exp": "True. Polyhymnia is the Muse of sacred music, hymns, and dance. She is one of the nine Muses, daughters of Zeus and Mnemosyne.", "ref": "ch.5", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Iris is the god/goddess of love.", "ans": false, "exp": "No, Iris is the goddess of the rainbow and a messenger of the gods, not of love. The goddess of love is Aphrodite (Venus). In the myth of the Flood, Iris appears as a messenger.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Deïphobus", "Ares", "Cronus", "Muses", "Mnemosyne", "Heracles"], "right": ["Saturn", "Musae", "Hercules", "Mars", "Deiphobus", "Moneta"], "ans": {"Deïphobus": "Deiphobus", "Ares": "Mars", "Cronus": "Saturn", "Muses": "Musae", "Mnemosyne": "Moneta", "Heracles": "Hercules"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Deïphobus (Greek) = Deiphobus (Roman), Ares = Mars, Cronus = Saturn, Muses = Musae, Mnemosyne = Moneta, Heracles = Hercules.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Mithras", "Himeros", "Phoebus Apollo", "Persephone", "Eos", "Athena"], "right": ["craft", "light", "desire", "Underworld", "Music", "dawn"], "ans": {"Mithras": "light", "Himeros": "desire", "Phoebus Apollo": "Music", "Persephone": "Underworld", "Eos": "dawn", "Athena": "craft"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Mithras is associated with light, Himeros with desire, Phoebus Apollo with music, Persephone with the Underworld, Eos with dawn, and Athena with craft.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Pallas and Athena (Athena was reared by Triton and had a...), who is the parent of Athena?", "opts": ["Er", "Oïleus", "Zeus", "Callisto"], "ans": "Zeus", "exp": "Athena is the daughter of Zeus and Metis, making Zeus her parent.", "ref": "ch.180", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Rhadamanthys?", "ans": "Rhadamanthus", "exp": "Rhadamanthys, a judge of the dead in Greek mythology, is known as Rhadamanthus in Roman mythology.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Euphemus is the god/goddess of prophecy.", "ans": false, "exp": "Euphemus is the god of running on water, not prophecy. The god of prophecy is Apollo.", "ref": "ch.24", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Kore?", "opts": ["Persephone", "Demeter", "Hecate", "Artemis"], "ans": "Persephone", "exp": "Kore is another name for Persephone, the goddess of spring and the Underworld. Her Roman equivalent is Proserpina.", "ref": "ch.14", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Ge-Themis is the god/goddess of which domain?", "opts": ["earth", "luck", "dawn", "history"], "ans": "earth", "exp": "Ge-Themis governs: earth, prophecy.", "ref": "ch.11"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Hestia?", "opts": ["Praxithea", "Phaedrus", "Cronus", "Hyacinthus"], "ans": "Cronus", "exp": "Hestia is the first-born of Cronus and Rhea.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aristaeus?", "ans": "Apollo", "exp": "Aristaeus is the son of Apollo and Cyrene.", "ref": "ch.16 p.388", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hymen?", "opts": ["Hymenaeus", "Priam", "Dione", "Diomedes"], "ans": "Hymenaeus", "exp": "Hymen is the Greek name; the Roman equivalent is Hymenaeus.", "ref": "ch.16", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Eros?", "ans": "Cupid", "exp": "The Roman equivalent of Eros is Cupid.", "ref": "ch.1", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Melpomene is the god/goddess of tragedy.", "ans": true, "exp": "Melpomene is the Muse of tragedy, as established in Greek mythology. She is often depicted with a tragic mask and is one of the nine Muses, each governing a different art or science.", "ref": "ch.5", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Fates", "Eris", "Odysseus", "Aphrodite", "Cybele", "Mnemosyne"], "right": ["Ulysses", "Discordia", "Venus", "Moneta", "Magna Mater", "Parcae"], "ans": {"Fates": "Parcae", "Eris": "Discordia", "Odysseus": "Ulysses", "Aphrodite": "Venus", "Cybele": "Magna Mater", "Mnemosyne": "Moneta"}, "exp": "These are the standard Greek and Roman name equivalences as commonly found in classical mythology textbooks. The Fates (Moirai) correspond to the Parcae, Eris to Discordia, Odysseus to Ulysses, Aphrodite to Venus, Cybele to Magna Mater, and Mnemosyne to Moneta.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Ge-Themis is the god/goddess of which domain?", "opts": ["harmony", "revelry", "warfare", "earth"], "ans": "earth", "exp": "Ge-Themis governs: earth, prophecy.", "ref": "ch.11"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Bull of Marathon (Theseus captures the bull of Marathon...), Hecale was the opponent of Apollo.", "ans": false, "exp": "Incorrect. In the myth of the Bull of Marathon, Theseus captures the bull and sacrifices it to Apollo. Hecale is a kind old woman who hosts Theseus on his journey. The wrestling match for the tripod is between Heracles and Apollo, not Hecale.", "ref": "ch.22 p.570", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Triptolemus?", "opts": ["Typhon", "clever", "wise counselor", "fair-cheeked"], "ans": "clever", "exp": "Triptolemus is known by the epithet 'clever'.", "ref": "ch.14"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Perses?", "ans": "Perseus", "exp": "Perses is the son of Perseus and Andromeda, making Perseus his parent.", "ref": "ch.21 p.545", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Eirene is the god/goddess of which domain?", "opts": ["peace", "contrivance", "comedy", "ghosts"], "ans": "peace", "exp": "Eirene governs: peace.", "ref": "ch.5"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hephaestus?", "ans": "Vulcan", "exp": "The Roman equivalent of Hephaestus is Vulcan, god of fire and craftsmanship.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Tantalus and Pelops (Tantalus, favored by the gods, abused...), Tantalus was the parent of Pelops.", "ans": true, "exp": "Tantalus is indeed the father of Pelops, as recounted in the myth where Tantalus served Pelops to the gods.", "ref": "ch.18 p.437", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hecate?", "opts": ["Trivia", "Diana", "Proserpina", "Luna"], "ans": "Trivia", "exp": "Hecate's Roman counterpart is Trivia, goddess of crossroads, magic, and ghosts.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Juno", "Jove", "Ishtar", "Hermes Psychopompos", "Ares", "Aphrodite"], "right": ["king of gods", "love", "beauty", "guide of souls", "marriage", "war"], "ans": {"Juno": "marriage", "Jove": "king of gods", "Ishtar": "love", "Hermes Psychopompos": "guide of souls", "Ares": "war", "Aphrodite": "beauty"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Juno is the goddess of marriage, Jove (Zeus) is the king of gods, Ishtar (Astarte) is the goddess of love, Hermes Psychopompos is the guide of souls, Ares is the god of war, and Aphrodite is the goddess of beauty.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Polyhymnia is the god/goddess of which domain?", "opts": ["morality", "sacred music", "justice", "gloom of Tartarus"], "ans": "sacred music", "exp": "Polyhymnia governs: sacred music.", "ref": "ch.5"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Homer?", "opts": ["blind bard", "centaur", "herald of the gods", "old women"], "ans": "blind bard", "exp": "Homer is known by the epithet 'blind bard'.", "ref": "ch.2"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Gigantomachy (Earth (Ge) produces giants and Typhoeus...), Ephialtes was the parent of Typhoeus.", "ans": false, "exp": "Incorrect. In the myth of Gigantomachy, Ge (Earth) brought forth Typhoeus through the love of Tartarus, not Ephialtes. Ephialtes was a giant, not a parent of Typhoeus.", "ref": "ch.4 p.84", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Thetis?", "ans": "Nereus", "exp": "Thetis was a Nereid, daughter of Nereus (the Old Man of the Sea) and Doris. Nereus is associated with prophecy and the sea.", "ref": "ch.7 p.?", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Helius is the god/goddess of light.", "ans": true, "exp": "Helius is the personification of the sun and light, often depicted driving a chariot across the sky.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Fates?", "opts": ["Moirai", "Danaids", "Parcae", "Trivia"], "ans": "Parcae", "exp": "The Fates are known as Moirai in Greek mythology; their Roman counterparts are the Parcae.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Phoebus Apollo?", "opts": ["Crito", "Latona", "Apollo", "Discordia"], "ans": "Apollo", "exp": "Phoebus Apollo is the Greek name; the Roman equivalent is Apollo, who shares the same name and domains.", "ref": "ch.15", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Melpomene", "Dionysus", "Asopus", "Eris", "Uranus", "Pan"], "right": ["discord", "ecstasy", "tragedy", "river", "music", "sky"], "ans": {"Melpomene": "tragedy", "Dionysus": "ecstasy", "Asopus": "river", "Eris": "discord", "Uranus": "sky", "Pan": "music"}, "exp": "Melpomene is the Muse of tragedy, Dionysus of ecstasy and wine, Asopus a river god, Eris of discord, Uranus of the sky, and Pan of music and nature.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Chrysothemis?", "ans": "Clytemnestra", "exp": "Chrysothemis is the daughter of Clytemnestra and Agamemnon, as depicted in Sophocles' Electra.", "ref": "ch.18 p.452", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Polydeuces?", "opts": ["Pollux", "Castor", "Heracles", "Theseus"], "ans": "Pollux", "exp": "Polydeuces is the Greek name; the Roman equivalent is Pollux.", "ref": "ch.18", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Scylla?", "ans": "Hecate", "exp": "Scylla was daughter of Phorcys and Hecate. Hecate is the goddess of witchcraft and crossroads.", "ref": "ch.7 p.169", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Mopsus is the god/goddess of prophecy.", "ans": true, "exp": "Mopsus is a seer, not a god; he is a mortal prophet. The god of prophecy is Apollo.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Ciconian women?", "opts": ["old and wise", "descendants of Belus", "faultless", "maenads"], "ans": "maenads", "exp": "Ciconian women is known by the epithet 'maenads'.", "ref": "ch.16"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Rhodes (When Zeus divided the world, Helius was...), Zeus was the lover of Rhode.", "ans": false, "exp": "Incorrect. In the myth of Rhodes, Helius loved the nymph Rhode, not Zeus.", "ref": "ch.3 p.67", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Cypris is the god/goddess of which domain?", "opts": ["witchcraft", "judge of the dead", "love", "travelers"], "ans": "love", "exp": "Cypris governs: love.", "ref": "ch.10"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Returns of the Greek Leaders (The returns of Greek leaders from Troy,...), Idomeneus was the parent of Palamedes.", "ans": false, "exp": "Incorrect. In the myth of Returns of the Greek Leaders, Nauplius avenged the death of his son Palamedes, not Idomeneus. Idomeneus was a Cretan leader who returned safely but was later exiled.", "ref": "ch.20 p.517", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Athena", "Atargatis", "Selene", "Rhea", "Hecuba", "Orthus"], "right": ["Minerva", "Luna", "Orthrus", "Dea Syria", "Ops", "Hekabe"], "ans": {"Athena": "Minerva", "Atargatis": "Dea Syria", "Selene": "Luna", "Rhea": "Ops", "Hecuba": "Hekabe", "Orthus": "Orthrus"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Athena = Minerva, Atargatis = Dea Syria, Selene = Luna, Rhea = Ops, Hecuba = Hekabe, Orthus = Orthrus.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Cupid is the god/goddess of which domain?", "opts": ["heroism", "war", "love", "light"], "ans": "love", "exp": "Cupid governs: love.", "ref": "ch.9"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Amythaeon?", "ans": "Cretheus", "exp": "Amythaeon was the son of Cretheus and Tyro, as stated in the textbook.", "ref": "ch.7 p.174", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Pallas is the god/goddess of war.", "ans": true, "exp": "Pallas is the goddess of war and wisdom, but the statement is true as she governs war.", "ref": "ch.8", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Dionysus and Ariadne (Dionysus married Ariadne after she was...), who was Dionysus married to?", "opts": ["Autolycus", "Persephone", "Ariadne", "Atropos"], "ans": "Ariadne", "exp": "Dionysus married Ariadne after she was abandoned by Theseus on Naxos.", "ref": "ch.321", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Nemesis", "Orthus", "Cybele", "Eris", "Persuasion", "Day"], "right": ["Hemera", "Discordia", "Suada", "Magna Mater", "Orthrus", "Rhamnusia"], "ans": {"Nemesis": "Rhamnusia", "Orthus": "Orthrus", "Cybele": "Magna Mater", "Eris": "Discordia", "Persuasion": "Suada", "Day": "Hemera"}, "exp": "These are the standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Plutus", "Night", "Hera", "Ares", "Hebe", "Proteus"], "right": ["wealth", "prophecy", "youth", "childbirth", "war", "night"], "ans": {"Plutus": "wealth", "Night": "night", "Hera": "childbirth", "Ares": "war", "Hebe": "youth", "Proteus": "prophecy"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Plutus (wealth), Night (night), Hera (childbirth), Ares (war), Hebe (youth), Proteus (prophecy).", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Apollo's Search for a Temple Site (Apollo searches for a location to build...), Erginus was the parent of Agamedes.", "ans": true, "exp": "Erginus is the father of Agamedes, as stated in the myth of Apollo's Search for a Temple Site.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Arethusa?", "opts": ["Cyclops", "nymph", "oldest of them all", "giver of life"], "ans": "nymph", "exp": "Arethusa is known by the epithet 'nymph'.", "ref": "ch.10"}, {"t": "mc", "cat": "Domain", "q": "Jove is the god/goddess of which domain?", "opts": ["song", "state", "king of gods", "sun"], "ans": "king of gods", "exp": "Jove governs: king of gods.", "ref": "ch.13"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hecate?", "opts": ["Diana", "Proserpina", "Trivia", "Ceres"], "ans": "Trivia", "exp": "Hecate is the Greek name; the Roman equivalent is Trivia.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Thanatos?", "opts": ["Amphitrite", "Death", "Hippocrates", "Priam"], "ans": "Death", "exp": "Thanatos is the Greek name; the Roman equivalent is Death.", "ref": "ch.11"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Jason?", "opts": ["Aeson", "Geryon", "Eirene", "Hippolyta"], "ans": "Aeson", "exp": "Jason was son of Aeson.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Penelope?", "ans": "Icarius", "exp": "Penelope is the daughter of Icarius, a Spartan prince, and the nymph Periboea. She is the wife of Odysseus and mother of Telemachus.", "ref": "ch.20 p.532", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Niobe (Niobe, wife of Amphion, boasts of her...), Amphion was the parent of Artemis.", "ans": false, "exp": "Incorrect. In the myth of Niobe, Amphion was the husband of Niobe, not the parent of Artemis. Artemis is the daughter of Zeus and Leto, and twin sister of Apollo.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Quest for the Golden Fleece (Jason, rightful heir to Iolcus, is sent...), Lycus was the opponent of Hera.", "ans": false, "exp": "Incorrect. In the myth of the Quest for the Golden Fleece, Lycus was a king who received the Argonauts hospitably, not an opponent of Hera. Hera was wounded by Heracles, not Lycus.", "ref": "ch.22 p.568", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Adonis?", "ans": "Cinyras", "exp": "Adonis is the son of Cinyras, king of Cyprus, and his daughter Myrrha. After Myrrha was transformed into a myrrh tree, Adonis was born from the tree.", "ref": "ch.9 p.195", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hypnos?", "ans": "Somnus", "exp": "The Roman equivalent of Hypnos, the Greek god of sleep, is Somnus. He is the son of Nyx (Night) and Erebus (Darkness).", "ref": "ch.19", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Graces is the god/goddess of creation.", "ans": false, "exp": "No, Graces governs beauty, charm, grace, loveliness, not creation. In the myth of Pandora's creation, the Graces adorned her with beauty and charm, but they are not deities of creation.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Tmolus?", "opts": ["beauteous", "rich", "sacred god of the mountain", "son of Ares"], "ans": "sacred god of the mountain", "exp": "Tmolus is known by the epithet 'sacred god of the mountain'.", "ref": "ch.8"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Zeus", "Eos", "Helen", "Themis", "Graces", "Hades"], "right": ["Aurora", "Pluto", "Helena", "Jupiter", "Justitia", "Gratiae"], "ans": {"Zeus": "Jupiter", "Eos": "Aurora", "Helen": "Helena", "Themis": "Justitia", "Graces": "Gratiae", "Hades": "Pluto"}, "exp": "Standard Greek and Roman name equivalences from the textbook. Zeus is Jupiter, Eos is Aurora, Helen is Helena, Themis is Justitia, Graces are Gratiae, and Hades is Pluto.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Cybele", "Athena", "Euterpe", "Ananke", "Demeter", "Pan"], "right": ["agriculture", "earth", "lyric poetry", "necessity", "craft", "music"], "ans": {"Cybele": "earth", "Athena": "craft", "Euterpe": "lyric poetry", "Ananke": "necessity", "Demeter": "agriculture", "Pan": "music"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Cybele is associated with the earth, Athena with craft, Euterpe with lyric poetry, Ananke with necessity, Demeter with agriculture, and Pan with music.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of

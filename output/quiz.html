<script>
var ALL_SETS = [[{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hours?", "ans": "Horae", "exp": "The Roman equivalent of the Greek Horae (goddesses of the seasons and time) is Horae, as the Romans adopted the same name.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Gigantomachy (Earth (Ge) produces giants and Typhoeus...), who is the parent of Athena?", "opts": ["Penthesilea", "Bellerophon", "Zeus", "Er"], "ans": "Zeus", "exp": "Athena is the daughter of Zeus and Metis, as commonly attested in Greek mythology.", "ref": "ch.84", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Quarrel of the Dioscuri with Idas and Lynceus (The Dioscuri quarreled with Idas and...), Idas was the killer of Castor.", "ans": false, "exp": "False. In the myth of the Quarrel of the Dioscuri with Idas and Lynceus, it was Lynceus who killed Castor, not Idas.", "ref": "ch.19 p.467", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Themis?", "opts": ["Right", "daughter of Minos", "queen of Carthage", "lord and host of many"], "ans": "Right", "exp": "Themis is known by the epithet 'Right'.", "ref": "ch.3"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Zeus", "Eos", "Athena", "Hera", "Hecate", "Nemesis"], "right": ["Jupiter", "Minerva", "Juno", "Aurora", "Rhamnusia", "Trivia"], "ans": {"Zeus": "Jupiter", "Eos": "Aurora", "Athena": "Minerva", "Hera": "Juno", "Hecate": "Trivia", "Nemesis": "Rhamnusia"}, "exp": "The standard Greek and Roman equivalences are: Zeus = Jupiter, Eos = Aurora, Athena = Minerva, Hera = Juno, Hecate = Trivia, Nemesis = Rhamnusia.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Fates", "Necessity", "Bacchus", "Phorcys", "Cypris", "Eunomia"], "right": ["love", "sea", "good order", "destiny", "mysteries", "necessity"], "ans": {"Fates": "destiny", "Necessity": "necessity", "Bacchus": "mysteries", "Phorcys": "sea", "Cypris": "love", "Eunomia": "good order"}, "exp": "Each god/goddess governs specific domains in Greek mythology: the Fates control destiny, Necessity personifies necessity, Bacchus is associated with mysteries, Phorcys is a sea god, Cypris is an epithet of Aphrodite representing love, and Eunomia embodies good order.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Aphrodite?", "opts": ["Venus", "Juno", "Minerva", "Diana"], "ans": "Venus", "exp": "Aphrodite is the Greek goddess of love and beauty; her Roman equivalent is Venus.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Podalirius is the god/goddess of medicine.", "ans": true, "exp": "Podalirius is the god of medicine, as he was a skilled healer in Greek mythology.", "ref": "ch.19", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Odysseus?", "ans": "Ulysses", "exp": "The Roman equivalent of Odysseus is Ulysses.", "ref": "ch.2", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Dardanus?", "ans": "Zeus", "exp": "Dardanus was the son of Zeus and Electra, making Zeus his parent.", "ref": "ch.19 p.473", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Aristophanes' Birds (A comedic account of creation by the...), Oceanus was the spouse of Night.", "ans": false, "exp": "Incorrect. In the myth of Aristophanes' Birds, Night mingled in love with Erebus, not Oceanus.", "ref": "ch.3 p.60", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Nike?", "opts": ["three-headed hound of Hades", "Zagreus", "beauteous", "winged"], "ans": "winged", "exp": "Nike is known by the epithet 'winged'.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Dionysus (26) (A hymn describing Dionysus as...), Semele was the child of Zeus.", "ans": false, "exp": "Incorrect. In the Homeric Hymn to Dionysus (26), Semele is the mother of Dionysus, not the child of Zeus.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Orestes and the Three Electras (The story of Orestes' return to Argos...), who killed Agamemnon?", "opts": ["Clytemnestra", "Aegisthus", "Oenone", "Creon"], "ans": "Clytemnestra", "exp": "Clytemnestra, with the help of her lover Aegisthus, murders Agamemnon upon his return from Troy.", "ref": "ch.454", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Rhea?", "opts": ["Cybele", "Pluto", "Mercury", "Ops"], "ans": "Ops", "exp": "Rhea is the Greek name; the Roman equivalent is Ops, goddess of abundance.", "ref": "ch.3", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Persephone is the god/goddess of sea.", "ans": false, "exp": "Persephone is the goddess of the Underworld, spring, and spring growth, not the sea. The sea is ruled by Poseidon.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Trojan War (Legendary war between Greeks and...), who was Achilles in love with?", "opts": ["Hecatonchires", "Enualios", "Patroclus", "Apsu"], "ans": "Patroclus", "exp": "Achilles' love for Patroclus is a major theme of male homosexuality.", "ref": "ch.46"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Ocyrhoë?", "opts": ["illustrious poet", "destructive", "beautiful as a flower", "mother of the Eumenides"], "ans": "beautiful as a flower", "exp": "Ocyrhoë is known by the epithet 'beautiful as a flower'.", "ref": "ch.14"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Demeter?", "opts": ["Ceres", "Juno", "Vesta", "Proserpina"], "ans": "Ceres", "exp": "Demeter is the Greek goddess of agriculture; her Roman equivalent is Ceres.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hephaestus?", "opts": ["Vulcan", "Mars", "Mercury", "Jupiter"], "ans": "Vulcan", "exp": "Hephaestus is the Greek god of fire and craftsmanship; his Roman equivalent is Vulcan.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hephaestus", "Charis", "Nike", "Selene", "Eos", "Persephone"], "right": ["Victoria", "Vulcan", "Grace", "Proserpina", "Luna", "Aurora"], "ans": {"Hephaestus": "Vulcan", "Charis": "Grace", "Nike": "Victoria", "Selene": "Luna", "Eos": "Aurora", "Persephone": "Proserpina"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Hephaestus (Greek) = Vulcan (Roman), Charis = Grace, Nike = Victoria, Selene = Luna, Eos = Aurora, Persephone = Proserpina.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Aristophanes' Speech in the Symposium (Aristophanes explains the origin of...), Eros was the parent of Apollo.", "ans": false, "exp": "Incorrect. In Aristophanes' Speech in Plato's Symposium, Eros is not the parent of Apollo. According to standard mythology, Apollo's parents are Zeus and Leto. The speech does not involve Eros as a parent of Apollo.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hours?", "opts": ["Latona", "Horae", "Hebe", "Iasion"], "ans": "Horae", "exp": "The Greek Hours (Horai) are goddesses of the seasons and time; their Roman equivalent is also Horae. Latona is the Roman form of Leto, Hebe is the goddess of youth, and Iasion is a mortal lover of Demeter.", "ref": "ch.5", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Apollo and Delos (Delos becomes the sacred island of...), Apollo was the parent of Artemis.", "ans": false, "exp": "Incorrect. In the myth of Apollo and Delos, Apollo is not the parent of Artemis. According to the Homeric Hymn to Apollo, Leto gave birth to both Apollo and Artemis, with Zeus as their father.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Graces", "Venus", "Enipeus", "Leucothea", "Ereshkigal", "Boreas"], "right": ["underworld", "North Wind", "river", "beauty", "sea", "beauty"], "ans": {"Graces": "beauty", "Venus": "beauty", "Enipeus": "river", "Leucothea": "sea", "Ereshkigal": "underworld", "Boreas": "North Wind"}, "exp": "Each god/goddess governs specific domains: Graces (beauty), Venus (beauty), Enipeus (river), Leucothea (sea), Ereshkigal (underworld), Boreas (North Wind). Note that both Graces and Venus share the domain of beauty.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Brontes is the god/goddess of thunder.", "ans": true, "exp": "Brontes is one of the Cyclopes, not a god or goddess. The Cyclopes were giant beings with one eye who forged Zeus's thunderbolt. Brontes's name means 'thunder', but he is not a deity of thunder; that domain belongs to Zeus.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Nereids?", "ans": "Nereus", "exp": "The Nereids are sea nymphs, daughters of the sea god Nereus and the Oceanid Doris. Nereus is known as the 'Old Man of the Sea' and possesses the gift of prophecy.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Pallas Athena?", "ans": "Minerva", "exp": "Pallas Athena, the Greek goddess of wisdom, war, and crafts, is identified with the Roman goddess Minerva. Minerva was also associated with wisdom, strategic warfare, and the arts.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Cypris?", "opts": ["Aphrodite", "Hera", "Artemis", "Venus"], "ans": "Venus", "exp": "Cypris is an epithet of Aphrodite, the Greek goddess of love and beauty, derived from her association with the island of Cyprus. Her Roman equivalent is Venus.", "ref": "ch.10", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Eumenides?", "ans": "Furies", "exp": "The Eumenides, meaning 'the kindly ones', are a euphemistic name for the Erinyes (Furies) in Greek mythology. In Roman mythology, they are known as the Furies (Dirae or Furiae), goddesses of vengeance.", "ref": "ch.15", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Nemesis?", "ans": "Rhamnusia", "exp": "The Roman equivalent of Nemesis is Rhamnusia, derived from her cult center at Rhamnus.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Tantalus and Pelops (Tantalus, favored by the gods, abused...), who opposed Demeter?", "opts": ["Zeus", "Hades", "Poseidon", "Hera"], "ans": "Zeus", "exp": "Demeter opposed Zeus because he allowed Hades to abduct Persephone, and she refused to let the earth bear fruit until her daughter was returned.", "ref": "ch.437", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Troïlus?", "ans": "Troilus", "exp": "Troïlus is the Greek form; the Roman name is Troilus, as seen in Virgil's Aeneid.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Triton?", "opts": ["of the beautiful hair", "goddess of madness", "Hecalus", "sea-god"], "ans": "sea-god", "exp": "Triton is known by the epithet 'sea-god'.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Perseus and Andromeda (Cepheus and Cassiopeia's boasting...), Andromeda was the child of Cassiopeia.", "ans": true, "exp": "Andromeda is indeed the daughter of Cassiopeia and Cepheus, as stated in the myth.", "ref": "ch.21 p.545", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Apollo's Musical Contest with Pan (Pan challenged Apollo to a musical...), Midas was the opponent of Apollo.", "ans": true, "exp": "In the musical contest between Apollo and Pan, Tmolus judged Apollo the winner. Midas, however, disagreed and challenged Apollo's victory, making him an opponent of Apollo. As punishment, Apollo gave Midas ass's ears.", "ref": "ch.11 p.265", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Neoptolemus", "Dionysus", "Nike", "Persuasion", "Heracles", "Hades"], "right": ["Pyrrhus", "Suada", "Victoria", "Bacchus", "Pluto", "Hercules"], "ans": {"Neoptolemus": "Pyrrhus", "Dionysus": "Bacchus", "Nike": "Victoria", "Persuasion": "Suada", "Heracles": "Hercules", "Hades": "Pluto"}, "exp": "These are standard Greek and Roman name equivalences: Neoptolemus = Pyrrhus, Dionysus = Bacchus, Nike = Victoria, Persuasion = Suada, Heracles = Hercules, Hades = Pluto.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Cronus?", "ans": "Saturn", "exp": "Cronus, the leader of the Titans, is known as Saturn in Roman mythology.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Thoth is the god/goddess of magic.", "ans": true, "exp": "Thoth is the Egyptian god of magic, writing, and knowledge.", "ref": "ch.12", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Zetes?", "opts": ["Justice", "Phaeno", "Orithyia", "Leucippe"], "ans": "Orithyia", "exp": "Zetes is the son of Orithyia and Boreas, as told in the myth of Orithyia and Boreas.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of nymphs?", "opts": ["old", "seer", "deep-bosomed mountain nymphs", "Prince Tiresias"], "ans": "deep-bosomed mountain nymphs", "exp": "nymphs is known by the epithet 'deep-bosomed mountain nymphs'.", "ref": "ch.9"}, {"t": "tf", "cat": "Divine Domains", "q": "Pontus is the god/goddess of bisexuality.", "ans": false, "exp": "No, Pontus is the personification of the sea, not bisexuality. In Hesiod's Theogony, Pontus is a primordial sea god, child of Gaia.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Clio", "Thoth", "Athena", "Cupid", "Leucothea", "Artemis"], "right": ["magic", "archery", "craft", "love", "history", "sea"], "ans": {"Clio": "history", "Thoth": "magic", "Athena": "craft", "Cupid": "love", "Leucothea": "sea", "Artemis": "archery"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Clio is the muse of history, Thoth is an Egyptian god of magic (not Greek), Athena is goddess of craft, Cupid is Roman god of love, Leucothea is a sea goddess, and Artemis is goddess of archery.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Uranus?", "opts": ["fair-cheeked", "starry", "righteous", "son of Iapetus"], "ans": "starry", "exp": "Uranus is known by the epithet 'starry'.", "ref": "ch.3"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Persephone?", "opts": ["Coronis", "Ge", "Atalanta", "Proserpina"], "ans": "Proserpina", "exp": "Persephone is the Greek goddess; her Roman equivalent is Proserpina, queen of the underworld.", "ref": "ch.1", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Proteus?", "opts": ["Hyllus", "Eryx", "Poseidon", "Demophoön"], "ans": "Poseidon", "exp": "Proteus, the shape-shifting sea god, is most commonly described as a son of Poseidon, the god of the sea, in Greek mythology.", "ref": "ch.7 p.168", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Dis is the god/goddess of which domain?", "opts": ["heroism", "Underworld", "knowledge", "love"], "ans": "Underworld", "exp": "Dis governs: Underworld.", "ref": "ch.15"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Athena (Athena was born from the head of Zeus,...), Metis was the parent of Athena.", "ans": true, "exp": "According to the myth, Athena was born from Zeus's head after he swallowed her mother Metis, making Metis her parent along with Zeus.", "ref": "ch.5 p.115", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Orpheus and Eurydice (Orpheus marries Eurydice, but she dies...), Orpheus was the spouse of Eurydice.", "ans": true, "exp": "In the myth, Orpheus married Eurydice, making her his spouse. After her death, he descended to the Underworld to retrieve her.", "ref": "ch.16 p.384", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Athena?", "ans": "Minerva", "exp": "Athena, the Greek goddess of wisdom and warfare, was identified with the Roman goddess Minerva, who shared similar attributes.", "ref": "ch.2", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Polycrates' Ring (Polycrates, tyrant of Samos, throws his...), Amasis was the killer of Polycrates.", "ans": false, "exp": "Incorrect. In the myth of Polycrates' Ring, Polycrates was murdered by Oroetes, not Amasis. Amasis was his friend who foresaw his downfall.", "ref": "ch.6 p.151", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Chrysothemis?", "ans": "Agamemnon", "exp": "Chrysothemis is the daughter of Agamemnon and Clytemnestra, making Agamemnon her father.", "ref": "ch.18 p.452", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Eumolpus?", "opts": ["Cresphontes", "Chione", "Cercopes", "Oreithyia"], "ans": "Chione", "exp": "Eumolpus is the son of Chione, a mortal woman, and Poseidon, according to some accounts.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Cephisus is the god/goddess of which domain?", "opts": ["dance", "chastity", "literature", "river"], "ans": "river", "exp": "Cephisus governs: river.", "ref": "ch.4"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Aphrodite and Anchises (Zeus causes Aphrodite to fall in love...), who is the parent of Athena?", "opts": ["Zeus", "Evenus", "Dictys", "Ops"], "ans": "Zeus", "exp": "Athena is the daughter of Zeus and Metis, making Zeus her parent.", "ref": "ch.201", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Leto", "Neoptolemus", "Eos", "Deïanira", "Orthus", "Hera"], "right": ["Latona", "Deianira", "Pyrrhus", "Juno", "Orthrus", "Aurora"], "ans": {"Leto": "Latona", "Neoptolemus": "Pyrrhus", "Eos": "Aurora", "Deïanira": "Deianira", "Orthus": "Orthrus", "Hera": "Juno"}, "exp": "Standard Greek and Roman name equivalences from the textbook. Leto is Latona, Neoptolemus is Pyrrhus, Eos is Aurora, Deïanira is Deianira, Orthus is Orthrus, Hera is Juno.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Podarces?", "opts": ["Peisistratus", "Laomedon", "Bromia", "Fates"], "ans": "Laomedon", "exp": "Podarces was the young son of Laomedon, king of Troy, as recounted in the myth of Heracles' rescue of Hesione.", "ref": "ch.19 p.474", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Ares is the god/goddess of war.", "ans": true, "exp": "Ares is the Greek god of war, son of Zeus and Hera, as described in chapter 2.", "ref": "ch.2", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hymen?", "ans": "Hymenaeus", "exp": "The Roman equivalent of Hymen is Hymenaeus, the god of marriage, as referenced in the myth of Orpheus and Eurydice.", "ref": "ch.16", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hymen", "Ge", "Maenads", "Artemis", "Charis", "Harmonia"], "right": ["Concordia", "Grace", "Diana", "Bacchae", "Hymenaeus", "Terra"], "ans": {"Hymen": "Hymenaeus", "Ge": "Terra", "Maenads": "Bacchae", "Artemis": "Diana", "Charis": "Grace", "Harmonia": "Concordia"}, "exp": "Standard Greek and Roman name equivalences from the textbook. Hymen is Hymenaeus, Ge is Terra, Maenads are Bacchae, Artemis is Diana, Charis is Grace, Harmonia is Concordia.", "ref": "", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Athena?", "opts": ["Amphitrite", "Polyhymnia", "Spermo", "Zeus"], "ans": "Zeus", "exp": "Athena was born from Zeus's head, fully armed, after he swallowed her mother Metis. This unique birth made her the goddess of wisdom and strategic warfare.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Aphrodite", "Fates", "Ge", "Hecate", "Neoptolemus", "Muses"], "right": ["Musae", "Terra", "Pyrrhus", "Parcae", "Venus", "Trivia"], "ans": {"Aphrodite": "Venus", "Fates": "Parcae", "Ge": "Terra", "Hecate": "Trivia", "Neoptolemus": "Pyrrhus", "Muses": "Musae"}, "exp": "These are standard Greek and Roman name equivalences from classical mythology. For example, Aphrodite is Venus, the Fates are the Parcae, Ge is Terra, Hecate is Trivia, Neoptolemus is Pyrrhus, and the Muses are Musae.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hera", "Orthus", "Hymen", "Eros", "Nike", "Hestia"], "right": ["Vesta", "Orthrus", "Victoria", "Hymenaeus", "Cupid", "Juno"], "ans": {"Hera": "Juno", "Orthus": "Orthrus", "Hymen": "Hymenaeus", "Eros": "Cupid", "Nike": "Victoria", "Hestia": "Vesta"}, "exp": "These are standard Greek and Roman name equivalences from classical mythology. For example, Hera is Juno, Orthus is Orthrus, Hymen is Hymenaeus, Eros is Cupid, Nike is Victoria, and Hestia is Vesta.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Callirhoë?", "opts": ["giant", "winged", "rich", "Oceanid"], "ans": "Oceanid", "exp": "Callirhoë is known by the epithet 'Oceanid'.", "ref": "ch.7"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Cypris?", "opts": ["Venus", "Minerva", "Diana", "Juno"], "ans": "Venus", "exp": "Cypris is an epithet of Aphrodite, the Greek goddess of love and beauty. Her Roman equivalent is Venus.", "ref": "ch.10", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Hadad is the god/goddess of music.", "ans": false, "exp": "No, Hadad is a storm god associated with thunder and rain, not music. Music is typically associated with gods like Apollo or the Muses.", "ref": "ch.16", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Tiresias?", "ans": "Eueres", "exp": "Tiresias is the son of Eueres, a shepherd, and the nymph Chariclo, who was a companion of Athena.", "ref": "ch.17 p.432", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Kore is the god/goddess of river.", "ans": false, "exp": "No, Kore (Persephone) is the goddess of the underworld and spring, not a river. Rivers are typically personified by river gods like Achelous.", "ref": "ch.14", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Eteocles?", "opts": ["Jocasta", "Melas", "Phlegyas", "Attalus III"], "ans": "Jocasta", "exp": "Eteocles is the son of Oedipus and Jocasta, making him a prince of Thebes and brother to Polynices, Antigone, and Ismene.", "ref": "ch.17 p.431", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Atalanta?", "ans": "Schoeneus", "exp": "Atalanta is the daughter of Schoeneus, a king of Arcadia or Boeotia, according to different sources.", "ref": "ch.19 p.510", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Helius is the god/goddess of which domain?", "opts": ["light", "shape-shifting", "king of gods", "queen of the gods"], "ans": "light", "exp": "Helius governs: light, sun.", "ref": "ch.3"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Harmonia?", "opts": ["Eileithyia", "Concordia", "Orthrus", "Bacchae"], "ans": "Concordia", "exp": "Harmonia is the Greek goddess of harmony and concord; her Roman equivalent is Concordia.", "ref": "ch.11", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Orpheus is the god/goddess of earth.", "ans": false, "exp": "No, Orpheus is a legendary musician and poet, not a god of earth. He is associated with music, mysteries, and poetry.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Tritonian Pallas?", "ans": "Minerva", "exp": "Tritonian Pallas is an epithet of Athena; her Roman equivalent is Minerva.", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Tragedy of Croesus (Croesus, king of Lydia, is visited by...), Croesus was the opponent of Cyrus the Great.", "ans": true, "exp": "Croesus, king of Lydia, attacked Persia and was defeated by Cyrus the Great, making Cyrus his opponent.", "ref": "ch.6 p.148", "enhanced": true}], [{"t": "sa", "cat": "Parentage", "q": "Who is the parent of Gorgons?", "ans": "Phorcys", "exp": "In Greek mythology, the Gorgons (Stheno, Euryale, and Medusa) are the daughters of the sea deities Phorcys and Ceto. Phorcys is a primordial sea god, often depicted as a fish-tailed father of monsters.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Arges is the god/goddess of brightness.", "ans": true, "exp": "Arges is one of the three Cyclopes, sons of Uranus and Gaia. His name means 'bright' or 'shining,' and he is associated with brightness, lightning, and thunderbolts, which he helped forge for Zeus.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Binding of Zeus (Hera, Poseidon, and Athena once bound...), Hera was the parent of Athena.", "ans": false, "exp": "In the myth of the Binding of Zeus, Hera, Poseidon, and Athena conspired to bind Zeus. However, Athena is not Hera's daughter; she was born from Zeus's head after he swallowed Metis. Thus, Hera is not Athena's parent.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Story of the Daughters of Pierus (Nine daughters of Pierus challenged the...), who opposed Pierus?", "opts": ["Zeus", "Muses", "Apollo", "Hermes"], "ans": "Muses", "exp": "The nine daughters of Pierus, king of Emathia, challenged the nine Muses to a musical contest. After losing, they were transformed into magpies as punishment for their hubris.", "ref": "ch.135", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Peisistratus?", "opts": ["Poeas", "Haemon", "Aegialia", "Nestor"], "ans": "Nestor", "exp": "Peisistratus is a son of Nestor, the wise king of Pylos. He appears in Homer's Odyssey as a companion to Telemachus.", "ref": "ch.6 p.158", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Proteus?", "opts": ["Great Mother", "ruler over many", "old man of the sea", "huntress who delights in her arrows"], "ans": "old man of the sea", "exp": "Proteus is known by the epithet 'old man of the sea'.", "ref": "ch.7"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Dardanus?", "opts": ["Astarte", "Phlegyas", "Persephone", "Zeus"], "ans": "Zeus", "exp": "Dardanus was the son of Electra and Zeus, making Zeus his father. Zeus is the king of the gods and ruler of Olympus.", "ref": "ch.19 p.473", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Niobe?", "ans": "Phoroneus", "exp": "Niobe is the daughter of Phoroneus, a primordial king of Argos. She is known for her pride in her children, which led to her tragic punishment by Leto.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Hadad", "Eunomia", "Hera", "Lyssa", "Isis", "Nereus"], "right": ["childbirth", "madness", "thunder", "good order", "fertility", "prophecy"], "ans": {"Hadad": "thunder", "Eunomia": "good order", "Hera": "childbirth", "Lyssa": "madness", "Isis": "fertility", "Nereus": "prophecy"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Hadad (thunder), Eunomia (good order), Hera (childbirth), Lyssa (madness), Isis (fertility), Nereus (prophecy).", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cephalus?", "ans": "Herse", "exp": "Cephalus is the son of Hermes and Herse. He was a mortal hunter loved by the dawn goddess Eos.", "ref": "ch.23 p.585", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Ereshkigal", "Ananke", "Hypnos", "Poseidon", "Hephaestus", "Plutus"], "right": ["necessity", "earthquakes", "underworld", "wealth", "sleep", "craftsmanship"], "ans": {"Ereshkigal": "underworld", "Ananke": "necessity", "Hypnos": "sleep", "Poseidon": "earthquakes", "Hephaestus": "craftsmanship", "Plutus": "wealth"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Ereshkigal is the Mesopotamian goddess of the underworld, but in Greek mythology, the underworld is ruled by Hades; however, the question pairs Ereshkigal with 'underworld' as given. Ananke is the personification of necessity, Hypnos is sleep, Poseidon is god of earthquakes and the sea, Hephaestus is craftsmanship, and Plutus is wealth.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Neleus (Heracles attacked Neleus, king of...), Periclymenus was the opponent of Neleus.", "ans": false, "exp": "Incorrect. In the myth of Neleus, Heracles attacked Neleus, king of Pylos, and killed eleven of his sons. Periclymenus was a son of Neleus who fought against Heracles, not an opponent of Neleus.", "ref": "ch.22 p.567", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Enipeus is the god/goddess of which domain?", "opts": ["river", "kingship", "persuasion", "marriage"], "ans": "river", "exp": "Enipeus governs: river.", "ref": "ch.7"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Test of the Bow (Penelope devises a contest where the...), Odysseus was the child of Penelope.", "ans": false, "exp": "Incorrect. In the myth of The Test of the Bow, Odysseus is the husband of Penelope and father of Telemachus, not the child of Penelope. Telemachus is the son of Odysseus and Penelope.", "ref": "ch.19 p.480", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Hesiod's Theogony (Hesiod's account of the creation of the...), who is the parent of Day?", "opts": ["Hypnos", "Night", "Charybdis", "Galaxaura"], "ans": "Night", "exp": "Night bore Day after mingling with Erebus. In Hesiod's Theogony, Night (Nyx) and Erebus (Darkness) are born from Chaos, and from their union come Aether (Light) and Day (Hemera).", "ref": "ch.59", "enhanced": true}], [{"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Helen?", "opts": ["nymph of the beautiful hair", "hair brightly adorned", "most beautiful of women", "unattractive"], "ans": "most beautiful of women", "exp": "Helen is known by the epithet 'most beautiful of women'.", "ref": "ch.1"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Bacchus", "Harmonia", "Eros", "Death", "Ereshkigal", "Necessity"], "right": ["mysteries", "death", "desire", "harmony", "underworld", "necessity"], "ans": {"Bacchus": "mysteries", "Harmonia": "harmony", "Eros": "desire", "Death": "death", "Ereshkigal": "underworld", "Necessity": "necessity"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Bacchus is associated with mysteries, Harmonia with harmony, Eros with desire, Death with death, Ereshkigal with the underworld, and Necessity with necessity.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Peleus and Thetis (Thetis was destined to bear a son...), Zeus was the spouse of Thetis.", "ans": false, "exp": "Incorrect. In the myth of Peleus and Thetis, Peleus is married to Thetis; Zeus avoided her due to the prophecy that her son would be mightier than his father.", "ref": "ch.18 p.?", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Eros is the god/goddess of destructive winds.", "ans": false, "exp": "No, Eros governs desire, love, passion, and procreation, not destructive winds. In Hesiod's Theogony, Eros is one of the primordial deities.", "ref": "ch.1", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Nike", "Dioscuri", "Poseidon", "Hecate", "Artemis", "Hecuba"], "right": ["Castor and Pollux", "Victoria", "Neptune", "Hekabe", "Trivia", "Diana"], "ans": {"Nike": "Victoria", "Dioscuri": "Castor and Pollux", "Poseidon": "Neptune", "Hecate": "Trivia", "Artemis": "Diana", "Hecuba": "Hekabe"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Nike corresponds to Victoria, Dioscuri to Castor and Pollux, Poseidon to Neptune, Hecate to Trivia, Artemis to Diana, and Hecuba to Hekabe.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Theseus Recognized by Aegeus (Theseus arrives in Athens. Medea,...), Aegeus was the parent of Medus.", "ans": true, "exp": "Aegeus was the father of Medus by Medea, so the statement is true.", "ref": "ch.24 p.619", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Ares?", "opts": ["Aurora", "Hippolytus", "Mars", "Deianira"], "ans": "Mars", "exp": "Ares is the Greek god of war; his Roman equivalent is Mars.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Zephyr is the god/goddess of which domain?", "opts": ["marriage", "travel", "sudden death of young men", "west wind"], "ans": "west wind", "exp": "Zephyr governs: west wind.", "ref": "ch.4"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Cybele?", "ans": "Magna Mater", "exp": "The Roman equivalent of Cybele is Magna Mater, meaning 'Great Mother'.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Atalanta?", "ans": "Schoeneus", "exp": "Atalanta is the daughter of Schoeneus, as stated in the myth of the Calydonian Boar Hunt.", "ref": "ch.19 p.510", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Telegonia (Lost epic continuing Odysseus's story...), Telemachus was the child of Penelope.", "ans": true, "exp": "Telemachus is the son of Penelope and Odysseus, as confirmed in the Telegonia.", "ref": "ch.19 p.480", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Kore?", "opts": ["Persephone", "Demeter", "Hecate", "Artemis"], "ans": "Persephone", "exp": "Kore is the Greek name; the Roman equivalent is Persephone.", "ref": "ch.14", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Maenads?", "opts": ["Bacchae", "Minerva", "Homer", "Phoenix"], "ans": "Bacchae", "exp": "Maenads are female followers of Dionysus; the Roman equivalent is Bacchae.", "ref": "ch.13", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Niobe and Her Children (Niobe, queen of Thebes, boasts that she...), who is the parent of Artemis?", "opts": ["Pyrrhus", "Eumelos", "Leto", "Penthesilea"], "ans": "Leto", "exp": "Artemis is the daughter of Leto and Zeus, as stated in the myth of Niobe.", "ref": "ch.225", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Althaemenes?", "ans": "Catreus", "exp": "Althaemenes was the son of Catreus, king of Crete, as told in the myth.", "ref": "ch.23 p.603", "enhanced": true}], [{"t": "sa", "cat": "Parentage", "q": "Who is the parent of Telephus?", "ans": "Heracles", "exp": "Telephus is the son of Heracles, the great hero known for his Twelve Labors.", "ref": "ch.4 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Circe is the god/goddess of which domain?", "opts": ["nature", "magic", "harvest", "retribution"], "ans": "magic", "exp": "Circe governs: magic.", "ref": "ch.7"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Family of Inachus (Io, daughter of Inachus, is beloved by...), Zeus was the parent of Epaphus.", "ans": true, "exp": "Zeus is the father of Epaphus, born to Io after her wanderings in Egypt.", "ref": "ch.1 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Iphigenia?", "ans": "Agamemnon", "exp": "Iphigenia is the daughter of Agamemnon, who sacrificed her to Artemis for favorable winds.", "ref": "ch.18 p.445", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hours?", "opts": ["Dia", "Horae", "Althaea", "Charon"], "ans": "Horae", "exp": "The Roman equivalent of the Greek Hours is Horae, who personify the seasons and time.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Orphic theogony (The Orphic creation myth begins with...), who was Zeus married to?", "opts": ["Hera", "Kore", "Demeter", "Hestia"], "ans": "Kore", "exp": "Zeus mated with Kore (Persephone) to produce Dionysus.", "ref": "ch.392", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Oedipus?", "ans": "Polybus", "exp": "Polybus is the adoptive father of Oedipus, who raised him after he was abandoned by his biological parents, Laius and Jocasta.", "ref": "ch.17 p.424", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Sangarios is the god/goddess of which domain?", "opts": ["river", "death", "lyre", "king of gods"], "ans": "river", "exp": "Sangarios governs: river.", "ref": "ch.9"}, {"t": "tf", "cat": "Divine Domains", "q": "Arges is the god/goddess of death.", "ans": false, "exp": "No, Arges is one of the Cyclopes, sons of Gaia and Uranus, and governs brightness, not death.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Justice?", "opts": ["weariless", "of the lovely hair", "companion of the gods below", "gentle"], "ans": "companion of the gods below", "exp": "Justice is known by the epithet 'companion of the gods below'.", "ref": "ch.17"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Euterpe", "Tisiphone", "Jove", "Gaia", "Ereshkigal", "Asopus"], "right": ["king of gods", "Vengeance", "underworld", "river", "earth", "lyric poetry"], "ans": {"Euterpe": "lyric poetry", "Tisiphone": "Vengeance", "Jove": "king of gods", "Gaia": "earth", "Ereshkigal": "underworld", "Asopus": "river"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Euterpe is the Muse of lyric poetry, Tisiphone is one of the Erinyes (Furies) who punishes crimes of vengeance, Jove (Zeus) is the king of the gods, Gaia is the personification of the earth, Ereshkigal is the Mesopotamian goddess of the underworld (included here as a cross-cultural figure), and Asopus is a river god.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Night is the god/goddess of which domain?", "opts": ["night", "moon", "grape", "sudden death of young women"], "ans": "night", "exp": "Night governs: night.", "ref": "ch.3"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Deïanira", "Hermes", "Hecuba", "Eris", "Maenads", "Athena"], "right": ["Deianira", "Hekabe", "Bacchae", "Mercury", "Discordia", "Minerva"], "ans": {"Deïanira": "Deianira", "Hermes": "Mercury", "Hecuba": "Hekabe", "Eris": "Discordia", "Maenads": "Bacchae", "Athena": "Minerva"}, "exp": "These are standard Greek and Roman name equivalences: Deïanira (Greek) becomes Deianira (Roman), Hermes becomes Mercury, Hecuba becomes Hekabe, Eris becomes Discordia, Maenads become Bacchae, and Athena becomes Minerva.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "holy sisters is the god/goddess of divination.", "ans": true, "exp": "In the Hymn to Hermes, the 'holy sisters' likely refer to the Muses, who are goddesses of divination, music, and the arts. However, the phrase 'holy sisters' is ambiguous; in context, it may refer to the Thriae, three nymphs associated with divination. The statement is true as the Muses or Thriae are indeed goddesses of divination.", "ref": "ch.12", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Aidos is the god/goddess of shame.", "ans": true, "exp": "In Hesiod's Works and Days, Aidos is the personification of shame, modesty, and reverence. She is one of the spirits that remain among humans during the Age of Heroes but eventually depart, leaving only Nemesis (retribution).", "ref": "ch.4", "enhanced": true}], [{"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Hippocoön?", "opts": ["king of Sparta", "destructive", "Wine Girl", "two-thirds divine"], "ans": "king of Sparta", "exp": "Hippocoön is known by the epithet 'king of Sparta'.", "ref": "ch.22"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Pallas Athena?", "opts": ["Minerva", "Juno", "Diana", "Vesta"], "ans": "Minerva", "exp": "Pallas Athena is the Greek name; the Roman equivalent is Minerva.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Eurybië?", "opts": ["Telchines", "Pontus", "Cleisidice", "Chimaera"], "ans": "Pontus", "exp": "Eurybië was daughter of Pontus and Ge.", "ref": "ch.7 p.169", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Penelope?", "ans": "Icarius", "exp": "Penelope is the daughter of Icarius.", "ref": "ch.20 p.532", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Hector?", "opts": ["Priam", "Elaïs", "Bromia", "Penthesilea"], "ans": "Priam", "exp": "Hector was the son of Priam and Hecuba.", "ref": "ch.19 p.474", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Aphrodite is the god/goddess of which domain?", "opts": ["ocean stream encircling earth", "beauty", "vengeance", "sky"], "ans": "beauty", "exp": "Aphrodite governs: beauty, desire, fertility, love, marriage, passion, procreation, sensuality.", "ref": "ch.1"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Pero?", "ans": "Neleus", "exp": "Pero was the daughter of Neleus, king of Pylos.", "ref": "ch.22 p.561", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Wedding of Peleus and Thetis (The Olympian gods attended the wedding;...), Thetis was the spouse of Peleus.", "ans": true, "exp": "Thetis, a sea nymph, married the mortal Peleus, and their son was Achilles.", "ref": "ch.7 p.165", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Oedipus (Oedipus kills his father Laius and...), Laius was the spouse of Jocasta.", "ans": true, "exp": "Laius, king of Thebes, was married to Jocasta, and they were the parents of Oedipus.", "ref": "ch.17 p.414", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Rhadamanthys?", "ans": "Rhadamanthus", "exp": "Rhadamanthys, a judge of the dead in Greek mythology, is known as Rhadamanthus in Roman mythology.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Castration of Uranus (Uranus hides his children in Earth. Ge...), Ge was the parent of Aphrodite.", "ans": false, "exp": "Incorrect. In the myth of Castration of Uranus, Aphrodite was born from the severed genitals of Uranus, not from Ge. Ge is the mother of Cronus and other Titans, but Aphrodite's parent is Uranus alone.", "ref": "ch.3 p.71", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Charis", "Helius", "Hephaestus", "Nike", "Eris", "Leto"], "right": ["Discordia", "Victoria", "Grace", "Vulcan", "Sol", "Latona"], "ans": {"Charis": "Grace", "Helius": "Sol", "Hephaestus": "Vulcan", "Nike": "Victoria", "Eris": "Discordia", "Leto": "Latona"}, "exp": "These are standard Greek and Roman name equivalences from the textbook. Charis corresponds to Grace, Helius to Sol, Hephaestus to Vulcan, Nike to Victoria, Eris to Discordia, and Leto to Latona.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Dionysus", "Persuasion", "Pontus", "Athena", "Phanes", "Hecate"], "right": ["ecstasy", "creation", "craft", "Underworld", "persuasion", "sea"], "ans": {"Dionysus": "ecstasy", "Persuasion": "persuasion", "Pontus": "sea", "Athena": "craft", "Phanes": "creation", "Hecate": "Underworld"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Dionysus is god of ecstasy, Persuasion is the personification of persuasion, Pontus is the sea, Athena is goddess of craft, Phanes is the primordial deity of creation, and Hecate is associated with the Underworld.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Andromeda?", "opts": ["Pallas", "Winckelmann", "Menoetius", "Cassiepea"], "ans": "Cassiepea", "exp": "Andromeda is the daughter of Cassiepea (and Cepheus). Pallas is a Titan, Winckelmann is a modern scholar, and Menoetius is a Titan, none of whom are her parents.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Returns of the Greek Leaders (The returns of Greek leaders from Troy,...), Polydeuces was the child of Clytemnestra.", "ans": false, "exp": "Incorrect. In the myth of Returns of the Greek Leaders, Orestes is the son of Clytemnestra and Agamemnon, not Polydeuces. Polydeuces is one of the Dioscuri, sons of Leda and Zeus.", "ref": "ch.18 p.446", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Asopus is the god/goddess of river.", "ans": true, "exp": "Asopus is the god of the river Asopus, not a goddess. He is a river god, father of Aegina and others.", "ref": "ch.13", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Apemosyne?", "ans": "Catreus", "exp": "Apemosyne was the daughter of Catreus, king of Crete. She fled with her brother Althaemenes to Rhodes.", "ref": "ch.23 p.603", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Chione?", "opts": ["Ardiaeus", "Boreas", "Learchus", "Astyanax"], "ans": "Boreas", "exp": "Chione is the daughter of Boreas, the North Wind, and Orithyia. She is the mother of Eumolpus by Poseidon.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Isis is the god/goddess of which domain?", "opts": ["sky", "home", "fertility", "ghosts"], "ans": "fertility", "exp": "Isis governs: fertility.", "ref": "ch.16"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Neoptolemus?", "opts": ["Persephone", "Magna Mater", "Pyrrhus", "Gratiae"], "ans": "Pyrrhus", "exp": "Neoptolemus, also known as Pyrrhus, is the son of Achilles. His Roman equivalent is Pyrrhus.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Orestes and the Three Electras (The story of Orestes' return to Argos...), who was Clytemnestra in love with?", "opts": ["Aegisthus", "Agamemnon", "Menelaus", "Pylades"], "ans": "Aegisthus", "exp": "Clytemnestra took Aegisthus as her lover while Agamemnon was away at Troy.", "ref": "ch.454", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Apsu", "Isis", "Polyhymnia", "Symaethus", "Dionysus", "Ishtar"], "right": ["ecstasy", "fertility", "fresh water", "river", "sacred music", "love"], "ans": {"Apsu": "fresh water", "Isis": "fertility", "Polyhymnia": "sacred music", "Symaethus": "river", "Dionysus": "ecstasy", "Ishtar": "love"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Apsu (fresh water), Isis (fertility), Polyhymnia (sacred music), Symaethus (river), Dionysus (ecstasy), Ishtar (love).", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cleisidice?", "ans": "Celeus", "exp": "Cleisidice is one of the daughters of King Celeus of Eleusis, as told in the Homeric Hymn to Demeter.", "ref": "ch.14 p.336", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Horae is the god/goddess of Underworld.", "ans": false, "exp": "Horae are goddesses of the seasons and time, not the underworld; that domain belongs to Hades.", "ref": "ch.9", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Harmonia", "Mnemosyne", "Dionysus", "Aphrodite", "Eos", "Eros"], "right": ["Moneta", "Aurora", "Bacchus", "Venus", "Concordia", "Cupid"], "ans": {"Harmonia": "Concordia", "Mnemosyne": "Moneta", "Dionysus": "Bacchus", "Aphrodite": "Venus", "Eos": "Aurora", "Eros": "Cupid"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Harmonia-Concordia, Mnemosyne-Moneta, Dionysus-Bacchus, Aphrodite-Venus, Eos-Aurora, Eros-Cupid.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Idmon is the god/goddess of earth.", "ans": false, "exp": "Idmon is not a god of earth; he is a seer who governs prophecy. The earth domain belongs to deities like Gaia.", "ref": "ch.24", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Asopus is the god/goddess of which domain?", "opts": ["queenship", "state", "river", "dance"], "ans": "river", "exp": "Asopus governs: river.", "ref": "ch.13"}, {"t": "tf", "cat": "Divine Domains", "q": "Justice is the god/goddess of justice.", "ans": true, "exp": "Justice is indeed the personification of justice, often identified with Astraea or Dike, who governs the domain of justice.", "ref": "ch.17", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Callidice?", "opts": ["Glaucon", "Typhon", "Leucippe", "Celeus"], "ans": "Celeus", "exp": "Callidice is one of the daughters of King Celeus and Queen Metaneira of Eleusis, as told in the myth of Demeter's visit.", "ref": "ch.14 p.336", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Charis?", "ans": "Grace", "exp": "Charis, one of the Graces, is known as Grace in Roman mythology, representing charm and beauty.", "ref": "ch.5", "enhanced": true}], [{"t": "mc", "cat": "Myth Details", "q": "In the myth of Deianira and Nessus (Heracles married Deianira after...), who killed Nessus?", "opts": ["Nyx", "Aether", "Heracles", "Pegasus"], "ans": "Heracles", "exp": "Heracles shot Nessus with his bow after the centaur attempted to assault Deianira.", "ref": "ch.569", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Antaeus?", "ans": "Ge", "exp": "Antaeus is son of Ge (Earth), who gave him strength as long as he remained in contact with the ground.", "ref": "ch.22 p.565", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Orithyia?", "opts": ["Machaon", "Hekabe", "Erechtheus", "Castor"], "ans": "Erechtheus", "exp": "Orithyia is daughter of Erechtheus, the legendary king of Athens.", "ref": "ch.23 p.589", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Hippolytus (Aphrodite, angered by Hippolytus'...), Poseidon was the parent of Theseus.", "ans": true, "exp": "Poseidon is the father of Theseus, as Theseus was born to Aethra after Poseidon lay with her.", "ref": "ch.10 p.241", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Oresteia (Athena sides with Apollo for the...), Athena was the child of Zeus.", "ans": true, "exp": "Athena was born from Zeus's head, fully armed, after he swallowed her mother Metis.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Stratios?", "opts": ["Tlepolemus", "Minerva", "Xenophanes", "Nestor"], "ans": "Nestor", "exp": "Stratios is a son of Nestor, as mentioned in Homer's Odyssey.", "ref": "ch.6 p.158", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hephaestus?", "ans": "Vulcan", "exp": "In the Gigantomachy, Hephaestus fought alongside the gods; his Roman counterpart is Vulcan, god of craftsmanship and fire.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Selene?", "opts": ["Macar", "Charon", "Luna", "Phlegyas"], "ans": "Luna", "exp": "Selene is the Greek goddess of the moon; her Roman equivalent is Luna.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Ea is the god/goddess of which domain?", "opts": ["beauty", "earth", "brightness", "present"], "ans": "earth", "exp": "Ea governs: earth, wisdom.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Creation of Mortals (Mortals are created by Prometheus, who...), Prometheus was the opponent of Zeus.", "ans": true, "exp": "Prometheus is known for opposing Zeus by tricking him and stealing fire for humanity, leading to his punishment.", "ref": "ch.4 p.?", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Ares", "Heracles", "Selene", "Odysseus", "Hecuba", "Persephone"], "right": ["Luna", "Hercules", "Mars", "Hekabe", "Proserpina", "Ulysses"], "ans": {"Ares": "Mars", "Heracles": "Hercules", "Selene": "Luna", "Odysseus": "Ulysses", "Hecuba": "Hekabe", "Persephone": "Proserpina"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Ares (Mars), Heracles (Hercules), Selene (Luna), Odysseus (Ulysses), Hecuba (Hekabe), Persephone (Proserpina).", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Oceanids (Oceanus and Tethys produce numerous...), Tethys was the parent of Acheloüs.", "ans": true, "exp": "According to the myth of the Oceanids, Tethys and Oceanus are the parents of Acheloüs, making the statement true.", "ref": "ch.3 p.65", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hymen?", "ans": "Hymenaeus", "exp": "The Roman equivalent of Hymen is Hymenaeus, as noted in the Orpheus and Eurydice myth.", "ref": "ch.16", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hermes Psychopompos?", "opts": ["Orthrus", "Althaea", "Atlas", "Mercury"], "ans": "Mercury", "exp": "Hermes Psychopompos is the Greek name; the Roman equivalent is Mercury.", "ref": "ch.15", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Apollo", "Apsu", "Zeus", "Hermes Psychopompos", "Scamander", "Enipeus"], "right": ["justice", "fresh water", "river", "river", "archery", "guide of souls"], "ans": {"Apollo": "archery", "Apsu": "fresh water", "Zeus": "justice", "Hermes Psychopompos": "guide of souls", "Scamander": "river", "Enipeus": "river"}, "exp": "Each god/goddess governs specific domains: Apollo (archery), Apsu (fresh water), Zeus (justice), Hermes Psychopompos (guide of souls), Scamander (river), Enipeus (river).", "ref": "", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Tlepolemus?", "opts": ["Heracles", "Aërope", "Ganymede", "Danaë"], "ans": "Heracles", "exp": "Tlepolemus is the son of Heracles, the greatest of Greek heroes known for his twelve labors and immense strength.", "ref": "ch.3 p.80", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Orion?", "opts": ["giant hunter", "Right", "daughters of Zeus", "violet-crowned Cytherea"], "ans": "giant hunter", "exp": "Orion is known by the epithet 'giant hunter'.", "ref": "ch.3"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Poseidon?", "ans": "Neptune", "exp": "The Roman equivalent of Poseidon, the Greek god of the sea, is Neptune, who also rules over the oceans and earthquakes.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Trojan War (Legendary war between Greeks and...), who is the parent of Paris?", "opts": ["Priam", "Croesus", "Alexander", "Thaumas"], "ans": "Priam", "exp": "Paris was the son of King Priam of Troy and his wife Hecuba, making him a prince of Troy.", "ref": "ch.46", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Artemis (Artemis is born on Delos (or Ortygia)...), Apollo was the lover of Leto.", "ans": false, "exp": "In the myth of the Birth of Artemis, it is Zeus, not Apollo, who is the lover of Leto. Zeus and Leto are the parents of Apollo and Artemis.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Bellerophon and the Chimera (Bellerophon, grandson of Sisyphus, was...), who was Proetus married to?", "opts": ["Polymestor", "Greeks", "Stheneboea", "Pandion"], "ans": "Stheneboea", "exp": "Proetus was husband of Stheneboea.", "ref": "ch.550"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Aphrodite?", "ans": "Venus", "exp": "The Roman equivalent of Aphrodite is Venus, who is the goddess of love, beauty, desire, and prosperity.", "ref": "ch.1", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Eris", "Nereus", "Glaucus", "Mercury", "Seasons", "Circe"], "right": ["messenger", "magic", "seasons", "sea", "prophecy", "discord"], "ans": {"Eris": "discord", "Nereus": "prophecy", "Glaucus": "sea", "Mercury": "messenger", "Seasons": "seasons", "Circe": "magic"}, "exp": "Each god or goddess governs specific domains in Greek mythology: Eris is the goddess of discord, Nereus is the old man of the sea known for prophecy, Glaucus is a sea god, Mercury (Hermes) is the messenger god, the Seasons (Horae) are goddesses of the seasons, and Circe is a sorceress associated with magic.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Amphitrite?", "opts": ["first-born of Cronus and Rhea", "huntress who delights in her arrows", "beauteous", "Thracian bard"], "ans": "beauteous", "exp": "Amphitrite is known by the epithet 'beauteous'.", "ref": "ch.7"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Early Exploits (Heracles was educated by various...), Autolycus was the killer of Megara.", "ans": false, "exp": "False. In the myth of Heracles' early exploits, it was Heracles himself who killed Megara in a fit of madness sent by Hera, not Autolycus.", "ref": "ch.22 p.558", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Tethys is the god/goddess of sea.", "ans": true, "exp": "Tethys is a Titaness, specifically the goddess of the sea, often associated with the nourishing flow of water. She is the wife of Oceanus and mother of the river gods and Oceanids.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Vulcan is the god/goddess of holding up the sky.", "ans": false, "exp": "Vulcan is the Roman god of fire, craftsmanship, and the forge, not of holding up the sky. The Titan Atlas is the one who holds up the sky.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Theseus' Six Labors (On his journey from Troezen to Athens,...), who killed Periphetes?", "opts": ["Sinis", "Sciron", "Cercyon", "Theseus"], "ans": "Theseus", "exp": "Theseus killed Periphetes, the son of Hephaestus, who wielded a bronze club, during his journey from Troezen to Athens.", "ref": "ch.591", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Triton", "Earth", "Jupiter", "Lyssa", "Pan", "Death"], "right": ["madness", "sea", "earth", "death", "king of gods", "music"], "ans": {"Triton": "sea", "Earth": "earth", "Jupiter": "king of gods", "Lyssa": "madness", "Pan": "music", "Death": "death"}, "exp": "In Greek mythology, Triton is the god of the sea (specifically a merman), Earth (Gaia) is the personification of the earth, Jupiter (Zeus) is the king of the gods, Lyssa is the goddess of madness, Pan is the god of music and the wild, and Death (Thanatos) is the personification of death.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Zeus?", "ans": "Jupiter", "exp": "The Roman equivalent of Zeus is Jupiter, who is the king of the gods and ruler of the sky and thunder.", "ref": "ch.1", "enhanced": true}], [{"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Aglaea", "Plutus", "Asopus", "Hermes", "Erato", "Lachesis"], "right": ["love poetry", "commerce", "measuring thread of life", "wealth", "river", "grace"], "ans": {"Aglaea": "grace", "Plutus": "wealth", "Asopus": "river", "Hermes": "commerce", "Erato": "love poetry", "Lachesis": "measuring thread of life"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Aglaea is the goddess of grace, Plutus is the god of wealth, Asopus is a river god, Hermes is the god of commerce, Erato is the muse of love poetry, and Lachesis is the Fate who measures the thread of life.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Athena?", "opts": ["Zeus", "Polydorus", "Laius", "Allecto"], "ans": "Zeus", "exp": "Athena was born from Zeus's head, making Zeus her parent. This is a key event in the Odyssey and other myths.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Birth of Athena (Athena was born from the head of Zeus,...), who did Hephaestus fight against?", "opts": ["Creusa", "Ares", "Silenus", "Pandia"], "ans": "Ares", "exp": "In the myth of Athena's birth, Hephaestus later trapped Ares in a net to punish him for adultery with Aphrodite, not directly related to Athena's birth but a famous story involving Hephaestus.", "ref": "ch.176", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Ransom of Hector (Priam ransoms Hector's body from...), who is the parent of Achilles?", "opts": ["Thetis", "Andromache", "Admete", "Day"], "ans": "Thetis", "exp": "Thetis is the mother of Achilles, a sea nymph who married Peleus. This is a key detail in the Ransom of Hector myth.", "ref": "ch.496", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Phineus is the god/goddess of prophecy.", "ans": true, "exp": "Phineus is a mortal prophet, not a god. In the myth of Perseus and Andromeda, Phineus is a suitor of Andromeda who is turned to stone by Perseus. He is not a god of prophecy.", "ref": "ch.21", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Deïphobus?", "opts": ["Aeneas", "Deiphobus", "Hector", "Paris"], "ans": "Deiphobus", "exp": "Deïphobus is the Greek name; the Roman equivalent is Deiphobus, as the name is the same in both languages.", "ref": "ch.15", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Macar?", "ans": "Aeolus", "exp": "Macar is the son of Aeolus, the ruler of the winds.", "ref": "ch.11 p.248", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Dionysus and Ariadne (Dionysus married Ariadne after she was...), who was Theseus in love with?", "opts": ["Ariadne", "Helen", "Phaedra", "Medea"], "ans": "Ariadne", "exp": "Theseus deserted Ariadne on Naxos after she helped him escape the Labyrinth.", "ref": "ch.321", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Dionysus?", "ans": "Bacchus", "exp": "The Roman equivalent of Dionysus is Bacchus, god of wine and revelry.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Polyhymnia is the god/goddess of which domain?", "opts": ["guide", "poverty", "spring growth", "sacred music"], "ans": "sacred music", "exp": "Polyhymnia governs: sacred music.", "ref": "ch.5"}, {"t": "tf", "cat": "Divine Domains", "q": "Ishtar is the god/goddess of childbirth.", "ans": false, "exp": "No, Ishtar is not a goddess of childbirth. In the Epic of Gilgamesh, Ishtar is the goddess of love, beauty, sex, and war. She does not govern childbirth; that domain belongs to other deities like Eileithyia in Greek mythology.", "ref": "ch.4", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Prometheus is the god/goddess of creation of mortals.", "ans": true, "exp": "Yes, Prometheus is associated with the creation of mortals. In Greek mythology, Prometheus is a Titan known for crafting humans from clay and giving them fire, which enabled civilization. He is thus considered the creator of mortals.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Venus", "Eros", "Athena", "Mithras", "Sleep", "Acheloüs"], "right": ["light", "desire", "river", "beauty", "sleep", "craft"], "ans": {"Venus": "beauty", "Eros": "desire", "Athena": "craft", "Mithras": "light", "Sleep": "sleep", "Acheloüs": "river"}, "exp": "Venus is the Roman goddess of beauty, Eros is the god of desire, Athena is the goddess of craft, Mithras is a god of light, Sleep (Hypnos) is the personification of sleep, and Acheloüs is a river god.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Jove?", "ans": "Zeus", "exp": "The Roman name of Jove is Zeus. Jove is another name for Jupiter, the Roman king of the gods, who is equivalent to the Greek god Zeus. In the myth of Echo and Narcissus, Jove appears as the father of many gods and mortals.", "ref": "ch.13", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Recognition of Oedipus (Years later, a plague afflicts Thebes....), Laius was the killer of Polynices.", "ans": false, "exp": "False. In the myth of Oedipus, Laius was killed by Oedipus, not by Polynices. Polynices was the son of Oedipus who fought his brother Eteocles in single combat, resulting in both their deaths. The plague in Thebes was due to the unresolved murder of Laius.", "ref": "ch.17 p.428", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Persuasion?", "ans": "Suada", "exp": "In Roman mythology, the goddess of persuasion is Suada (also known as Suadela), equivalent to the Greek Peitho.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Cronus", "Harmonia", "Persuasion", "Neoptolemus", "Graces", "Artemis"], "right": ["Diana", "Concordia", "Gratiae", "Saturn", "Suada", "Pyrrhus"], "ans": {"Cronus": "Saturn", "Harmonia": "Concordia", "Persuasion": "Suada", "Neoptolemus": "Pyrrhus", "Graces": "Gratiae", "Artemis": "Diana"}, "exp": "These are the standard Greek-to-Roman name equivalences as commonly found in classical mythology textbooks: Cronus = Saturn, Harmonia = Concordia, Persuasion = Suada, Neoptolemus = Pyrrhus, Graces = Gratiae, Artemis = Diana.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Aeolus is the god/goddess of Winds.", "ans": true, "exp": "Aeolus is the god of the winds in Greek mythology, as depicted in Homer's Odyssey and other sources.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Graces", "Fates", "Leto", "Hera", "Odysseus", "Pleasure"], "right": ["Gratiae", "Parcae", "Latona", "Ulysses", "Voluptas", "Juno"], "ans": {"Graces": "Gratiae", "Fates": "Parcae", "Leto": "Latona", "Hera": "Juno", "Odysseus": "Ulysses", "Pleasure": "Voluptas"}, "exp": "These are the standard Greek-to-Roman name equivalences: Graces = Gratiae, Fates = Parcae, Leto = Latona, Hera = Juno, Odysseus = Ulysses, Pleasure = Voluptas.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Returns and the Odyssey (The overall narrative of Odysseus'...), Penelope was the parent of Telemachus.", "ans": true, "exp": "In Homer's Odyssey, Telemachus is the son of Odysseus and Penelope, making Penelope his parent.", "ref": "ch.20 p.527", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Nike is the god/goddess of Music.", "ans": false, "exp": "No, Nike is the goddess of victory, not Music. Music is associated with Apollo and the Muses.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Telemachus?", "opts": ["swift messenger of the gods", "unattractive", "Enki", "great-hearted"], "ans": "great-hearted", "exp": "Telemachus is known by the epithet 'great-hearted'.", "ref": "ch.2"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Eleusinian Mysteries (The Eleusinian Mysteries were secret...), Persephone was the parent of Dionysus.", "ans": true, "exp": "Persephone is indeed the mother of Zagreus-Dionysus in Orphic tradition, though in standard myth Dionysus is son of Zeus and Semele.", "ref": "ch.14 p.351", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Neptune?", "opts": ["brother of Jove", "great-hearted", "withered feet", "giver of grace"], "ans": "brother of Jove", "exp": "Neptune is known by the epithet 'brother of Jove'.", "ref": "ch.4"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Rhea?", "opts": ["Ceres", "Juno", "Ops", "Vesta"], "ans": "Ops", "exp": "Rhea is the Greek name; the Roman equivalent is Ops.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Creusa?", "ans": "Erechtheus", "exp": "Creusa is the daughter of Erechtheus, the legendary king of Athens.", "ref": "ch.23 p.588", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Macareus?", "opts": ["Boreas", "Phaedra", "Aeolus", "Ajax the Greater"], "ans": "Aeolus", "exp": "Macareus is the son of Aeolus, the ruler of the winds.", "ref": "ch.20 p.539", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Fates?", "ans": "Parcae", "exp": "The Roman equivalent of the Greek Fates (Moirai) is the Parcae.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Theseus?", "opts": ["Poseidon", "Britomartis", "Charybdis", "Crito"], "ans": "Poseidon", "exp": "Poseidon, god of the sea, was said to be the true father of Theseus.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Eros?", "opts": ["Eileithyia", "Cupid", "Xenophanes", "Polites"], "ans": "Cupid", "exp": "Eros is the Greek god of love; the Roman equivalent is Cupid.", "ref": "ch.1", "enhanced": true}], [{"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Iliad (The Iliad covers events from the...), Hecuba was the parent of Hector.", "ans": true, "exp": "Hecuba, wife of King Priam of Troy, was the mother of Hector, as recounted in Homer's Iliad.", "ref": "ch.19 p.489", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Heracles (Deïanira, jealous of Iole, sends...), who was Hera married to?", "opts": ["Admete", "Zeus", "Cronus", "Hestia"], "ans": "Zeus", "exp": "Hera is the wife and sister of Zeus, the king of the gods in Greek mythology.", "ref": "ch.570", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Hypsipyle and the Lemnian Women (The Lemnian women, punished by...), who was Hypsipyle in love with?", "opts": ["Oroetes", "Cumaean Sibyl", "Jason", "Orpheus"], "ans": "Jason", "exp": "Hypsipyle, queen of Lemnos, fell in love with Jason when the Argonauts visited the island, and they had twin sons, Thoas and Euneos.", "ref": "ch.611", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Ereshkigal is the god/goddess of desire.", "ans": false, "exp": "Ereshkigal is the Mesopotamian goddess of the underworld, not desire; the Greek goddess of desire is Aphrodite.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Orestes (Euripides' play set after...), who was Helen married to?", "opts": ["Deïanira", "Concordia", "Menelaüs", "Paris"], "ans": "Menelaüs", "exp": "Helen, the most beautiful woman in the world, was married to Menelaüs, king of Sparta, before being taken to Troy by Paris.", "ref": "ch.446", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Laodamia?", "ans": "Bellerophon", "exp": "Laodamia was the daughter of Bellerophon, the famous hero who tamed Pegasus and fought the Chimera.", "ref": "ch.19 p.?", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Tiresias?", "opts": ["rich", "fair-cheeked", "Prince Tiresias", "king of Calydon"], "ans": "Prince Tiresias", "exp": "Tiresias is known by the epithet 'Prince Tiresias'.", "ref": "ch.5"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Apollo (Leto, pregnant with Apollo and Artemis,...), Dione was the spouse of Hera.", "ans": false, "exp": "False. In the myth of the Birth of Apollo, Dione is not the spouse of Hera. Hera is the wife of Zeus, while Dione is sometimes considered a Titaness or the mother of Aphrodite.", "ref": "ch.2 p.?", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Eileithyia is the god/goddess of childbirth.", "ans": true, "exp": "True. Eileithyia is the goddess of childbirth, often invoked to ease labor pains.", "ref": "ch.2", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Ge", "Day", "Hermes", "Heracles", "Selene", "Leto"], "right": ["Hercules", "Luna", "Terra", "Hemera", "Latona", "Mercury"], "ans": {"Ge": "Terra", "Day": "Hemera", "Hermes": "Mercury", "Heracles": "Hercules", "Selene": "Luna", "Leto": "Latona"}, "exp": "These are standard Greek and Roman name equivalences: Ge (Earth) = Terra, Day (Hemera) = Dies, Hermes = Mercury, Heracles = Hercules, Selene = Luna, Leto = Latona.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aegeus?", "ans": "Pandion", "exp": "Aegeus is the son of Pandion, as recounted in the myth of the early kings of Athens. Pandion, driven out by Metion, fathered Aegeus, Pallas, Nisus, and Lycus in Megara.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Ge?", "ans": "Terra", "exp": "The Roman equivalent of Ge, the primordial goddess of the Earth, is Terra. This equivalence is standard in Roman mythology, where Terra is the counterpart of the Greek Ge.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Jove is the god/goddess of which domain?", "opts": ["sea", "strength", "king of gods", "creation of mortals"], "ans": "king of gods", "exp": "Jove governs: king of gods.", "ref": "ch.13"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Io and Zeus (Zeus takes Io by force, or their son...), what was Hera transformed into?", "opts": ["Python", "Typhon", "Io", "Scylla"], "ans": "Io", "exp": "Hera turned Io into a white cow.", "ref": "ch.21"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Night", "Nike", "Ge", "Leto", "Mnemosyne", "Maenads"], "right": ["Terra", "Latona", "Nyx", "Victoria", "Bacchae", "Moneta"], "ans": {"Night": "Nyx", "Nike": "Victoria", "Ge": "Terra", "Leto": "Latona", "Mnemosyne": "Moneta", "Maenads": "Bacchae"}, "exp": "Standard Greek and Roman name equivalences: Night (Nyx), Nike (Victoria), Ge (Terra), Leto (Latona), Mnemosyne (Moneta), Maenads (Bacchae). These pairings are based on classical sources.", "ref": "", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Teucer?", "opts": ["Perimedes", "Chryses", "Telamon", "Linus"], "ans": "Telamon", "exp": "Teucer was the son of Telamon and Hesione, making Telamon his father. This parentage is consistent with accounts in Greek mythology, particularly in the context of the Trojan War where Teucer fought as a renowned archer.", "ref": "ch.19 p.474", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Aphrodite?", "opts": ["Memory", "Cypris", "lovely hair", "guide of dreams"], "ans": "Cypris", "exp": "Aphrodite is known by the epithet 'Cypris'.", "ref": "ch.1"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Family of Inachus (Io, daughter of Inachus, is beloved by...), who is the parent of Epaphus?", "opts": ["Io", "Echo", "Paris", "Cinyras"], "ans": "Io", "exp": "Io is the mother of Epaphus, whom she bore to Zeus after her wanderings in Egypt. Epaphus later became a king of Egypt and was identified with the Egyptian god Apis.", "ref": "ch.547", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aristaeus?", "ans": "Cyrene", "exp": "Aristaeus is the son of Apollo and the nymph Cyrene. Cyrene was a Thessalian princess whom Apollo took to Libya, where she gave birth to Aristaeus. He became a god of agriculture, beekeeping, and other rustic arts.", "ref":

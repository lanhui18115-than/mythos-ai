 Death of Patroclus (Patroclus is killed by Hector while...), who killed Patroclus?", "opts": ["Hector", "Amphitryon", "Demophon", "Alexander the Great"], "ans": "Hector", "exp": "Hector kills Patroclus and strips his armor. The other options are not involved in Patroclus's death; Amphitryon is a Theban hero, Demophon is a son of Theseus, and Alexander the Great is a historical figure.", "ref": "ch.495", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Tartarus is the god/goddess of force.", "ans": false, "exp": "Tartarus is not a god of force; in Hesiod's Theogony, Tartarus is a primordial deity representing the deep abyss used as a dungeon of torment, not force.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Alcmaeon?", "ans": "Eriphyle", "exp": "Alcmaeon is the son of Eriphyle and Amphiaraüs; his mother Eriphyle betrayed him, leading to his death.", "ref": "ch.17 p.432", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Dismemberment of Orpheus (After losing Eurydice, Orpheus shuns...), who was Orpheus married to?", "opts": ["Orthus", "Cybele", "Archinus", "Eurydice"], "ans": "Eurydice", "exp": "Orpheus married Eurydice, a nymph, and after her death he descended to the underworld to retrieve her.", "ref": "ch.387", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Megaera is the god/goddess of agriculture.", "ans": false, "exp": "Megaera is one of the Erinyes (Furies), goddesses of vengeance and retribution, not agriculture.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Eirene is the god/goddess of peace.", "ans": true, "exp": "Eirene is the personification of peace, one of the Horae, daughters of Zeus and Themis.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Phaëthon?", "opts": ["shining", "battle-rouser", "son of revered Earth", "Oceanid"], "ans": "shining", "exp": "Phaëthon is known by the epithet 'shining'.", "ref": "ch.3"}, {"t": "mc", "cat": "Domain", "q": "Thalia is the god/goddess of which domain?", "opts": ["king of the gods", "comedy", "craftsmanship", "epic poetry"], "ans": "comedy", "exp": "Thalia governs: comedy.", "ref": "ch.5"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Hippolytus?", "ans": "Antiope", "exp": "Hippolytus is the son of Theseus and Antiope, an Amazon queen.", "ref": "ch.23 p.596", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Charis?", "ans": "Grace", "exp": "The Roman equivalent of Charis is Grace, one of the Graces.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Aegyptus?", "opts": ["Pylades", "Selene", "Muses", "Belus"], "ans": "Belus", "exp": "Aegyptus is the son of Belus, king of Egypt, and brother of Danaus.", "ref": "ch.21 p.544", "enhanced": true}], [{"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Muses?", "opts": ["Musae", "Minerva", "Juno", "Venus"], "ans": "Musae", "exp": "The Muses are Greek; their Roman equivalent is the Musae. Minerva is Athena, Juno is Hera, Venus is Aphrodite.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Aeacus is the god/goddess of messenger.", "ans": false, "exp": "No, Aeacus is a judge of the dead, not a messenger. The messenger god is Hermes (or Mercury).", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Eris?", "opts": ["son of Panopeus", "vast", "goddess of Discord", "great mother"], "ans": "goddess of Discord", "exp": "Eris is known by the epithet 'goddess of Discord'.", "ref": "ch.19"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Alcmaeon?", "ans": "Amphiaraüs", "exp": "Alcmaeon is the son of Amphiaraüs and Eriphyle. Amphiaraüs is a seer and one of the Seven against Thebes.", "ref": "ch.17 p.432", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Prometheus against Zeus (Prometheus, son of Iapetus, tricks Zeus...), who is the parent of Menoetius?", "opts": ["Clymene", "Humbaba", "Perseus", "Procris"], "ans": "Clymene", "exp": "Clymene is the mother of Menoetius, as well as of Prometheus, Atlas, and Epimetheus. The other options are other Titanesses.", "ref": "ch.91", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Titans (Gaia and Uranus produce twelve Titans:...), Gaia was the parent of Mnemosyne.", "ans": true, "exp": "In the Birth of Titans myth, Gaia and Uranus produced the twelve Titans, including Mnemosyne. Thus, Gaia is indeed the parent of Mnemosyne.", "ref": "ch.3 p.63", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Charis", "Odysseus", "Persuasion", "Nemesis", "Hades", "Harmonia"], "right": ["Pluto", "Ulysses", "Concordia", "Suada", "Rhamnusia", "Grace"], "ans": {"Charis": "Grace", "Odysseus": "Ulysses", "Persuasion": "Suada", "Nemesis": "Rhamnusia", "Hades": "Pluto", "Harmonia": "Concordia"}, "exp": "These are standard Greek-to-Roman name equivalences: Charis is Grace, Odysseus is Ulysses, Persuasion is Suada, Nemesis is Rhamnusia, Hades is Pluto, and Harmonia is Concordia.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Circe is the god/goddess of which domain?", "opts": ["harvest", "comedy", "magic", "lightning"], "ans": "magic", "exp": "Circe governs: magic.", "ref": "ch.7"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Helius", "Zephyrus", "Hebe", "Hadad", "Phoebus Apollo", "Leucothea"], "right": ["Music", "light", "west wind", "youth", "thunder", "sea"], "ans": {"Helius": "light", "Zephyrus": "west wind", "Hebe": "youth", "Hadad": "thunder", "Phoebus Apollo": "Music", "Leucothea": "sea"}, "exp": "Helius is the god of light, Zephyrus of the west wind, Hebe of youth, Hadad of thunder, Phoebus Apollo of music, and Leucothea of the sea.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Phineus is the god/goddess of sleep.", "ans": false, "exp": "Phineus is not a god of sleep; he is a prophet in the myth of Perseus and Andromeda, known for his gift of prophecy.", "ref": "ch.21", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Agenor?", "ans": "Belus", "exp": "Agenor is the son of Belus, a king of Egypt, and the father of Cadmus and Europa. Belus is also the father of Aegyptus and Danaus.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Hesperus is the god/goddess of evening star.", "ans": true, "exp": "Hesperus is the personification of the evening star (Venus) in Greek mythology, often considered the son of Astraeus and Eos or of Atlas.", "ref": "ch.22", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Iphigenia?", "ans": "Agamemnon", "exp": "Iphigenia is the daughter of Agamemnon and Clytemnestra. Agamemnon sacrificed her to Artemis to gain favorable winds for the Trojan War.", "ref": "ch.18 p.445", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Bull of Marathon (Theseus captures the bull of Marathon...), who is the parent of Apollo?", "opts": ["Ianeira", "Zeus", "Tritonian Pallas", "Vesta"], "ans": "Zeus", "exp": "Apollo is the son of Zeus and Leto, and twin brother of Artemis. Zeus is the king of the gods, ruling over justice and the sky.", "ref": "ch.593", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hypnos?", "opts": ["Somnus", "Macar", "Clytemnestra", "Laodamia"], "ans": "Somnus", "exp": "Hypnos is the Greek name; the Roman equivalent is Somnus.", "ref": "ch.19"}], [{"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Rhea?", "opts": ["beautiful-haired", "king of the Dorians", "great mother", "devoted wife"], "ans": "great mother", "exp": "Rhea is known by the epithet 'great mother'.", "ref": "ch.3"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Cybele", "Poseidon", "Night", "Himeros", "Zeus", "Deïphobus"], "right": ["Desire", "Nyx", "Neptune", "Deiphobus", "Jupiter", "Magna Mater"], "ans": {"Cybele": "Magna Mater", "Poseidon": "Neptune", "Night": "Nyx", "Himeros": "Desire", "Zeus": "Jupiter", "Deïphobus": "Deiphobus"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Cybele = Magna Mater, Poseidon = Neptune, Night = Nyx, Himeros = Desire, Zeus = Jupiter, Deïphobus = Deiphobus.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Leto?", "ans": "Latona", "exp": "The Roman equivalent of Leto is Latona, as she is the mother of Apollo and Diana (Artemis).", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Iliad (The Iliad covers events from the...), Thetis was the parent of Achilles.", "ans": true, "exp": "Thetis is the mother of Achilles, a sea nymph who married Peleus.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Persuasion", "Boreas", "Lachesis", "Nike", "Hadad", "Cupid"], "right": ["measuring thread of life", "thunder", "love", "victory", "persuasion", "North Wind"], "ans": {"Persuasion": "persuasion", "Boreas": "North Wind", "Lachesis": "measuring thread of life", "Nike": "victory", "Hadad": "thunder", "Cupid": "love"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Persuasion = persuasion, Boreas = North Wind, Lachesis = measuring thread of life, Nike = victory, Hadad = thunder, Cupid = love.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Nemesis?", "ans": "Rhamnusia", "exp": "The Roman equivalent of Nemesis is Rhamnusia, derived from her cult center at Rhamnous.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Hestia?", "opts": ["august", "wretched", "Lesser", "battle-rouser"], "ans": "august", "exp": "Hestia is known by the epithet 'august'.", "ref": "ch.3"}, {"t": "tf", "cat": "Divine Domains", "q": "Hecate is the god/goddess of craftsmanship.", "ans": false, "exp": "No, Hecate governs the Underworld, black magic, crossroads, fertility, ghosts, magic, the moon, and witchcraft, not craftsmanship.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Lyssa is the god/goddess of which domain?", "opts": ["death", "madness", "sky", "sea"], "ans": "madness", "exp": "Lyssa governs: madness.", "ref": "ch.22"}, {"t": "mc", "cat": "Domain", "q": "Tisiphone is the god/goddess of which domain?", "opts": ["Vengeance", "trees", "song", "spinning thread of life"], "ans": "Vengeance", "exp": "Tisiphone governs: Vengeance.", "ref": "ch.15"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Hypsipyle and the Lemnian Women (The Lemnian women, punished by...), who is the parent of Thoas?", "opts": ["Hypsipyle", "Dido", "Parthenopaeus", "Ardiaeus"], "ans": "Hypsipyle", "exp": "Hypsipyle is the mother of Thoas. She saved him during the Lemnian massacre.", "ref": "ch.611", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Medus?", "ans": "Aegeus", "exp": "Medus is the son of Aegeus and Medea. Aegeus is his father.", "ref": "ch.23 p.592", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Harmonia is the god/goddess of which domain?", "opts": ["crossroads", "harmony", "arts", "song"], "ans": "harmony", "exp": "Harmonia governs: harmony.", "ref": "ch.11"}, {"t": "tf", "cat": "Divine Domains", "q": "Lyssa is the god/goddess of madness.", "ans": true, "exp": "Lyssa is the goddess of madness, representing frenzied rage and insanity.", "ref": "ch.22", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Peleus and Thetis (Thetis was destined to bear a son...), Zeus was the opponent of Prometheus.", "ans": true, "exp": "Zeus was the opponent of Prometheus, punishing him for stealing fire by binding him and sending an eagle to eat his liver.", "ref": "ch.4 p.91", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Oceanus is the god/goddess of west wind.", "ans": false, "exp": "Oceanus is the Titan god of the ocean, specifically the great river that encircles the earth, not the west wind. The west wind is personified by Zephyrus.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Bacchus", "Earth", "Lyssa", "Death", "Artemis", "Jupiter"], "right": ["archery", "madness", "king of gods", "mysteries", "death", "earth"], "ans": {"Bacchus": "mysteries", "Earth": "earth", "Lyssa": "madness", "Death": "death", "Artemis": "archery", "Jupiter": "king of gods"}, "exp": "Bacchus is the god of mysteries (especially the Bacchic mysteries), Earth (Gaia) is the personification of earth, Lyssa is the goddess of madness, Death (Thanatos) is the personification of death, Artemis is the goddess of archery and the hunt, and Jupiter (Zeus) is the king of gods.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Sleep?", "opts": ["Pallas", "Parcae", "Troilus", "Somnus"], "ans": "Somnus", "exp": "Sleep is the Greek name; the Roman equivalent is Somnus.", "ref": "ch.19"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Medea's Revenge (Medea, betrayed by Jason who marries...), who opposed Medea?", "opts": ["Creon", "Aegeus", "Pelias", "Acrisius"], "ans": "Creon", "exp": "Medea's rage and deadly threats against the royal family led to her exile by Creon, the king of Corinth.", "ref": "ch.627", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Origin of Libyan Snakes, the Atlas Range, and Coral (As Perseus flies over Libya, Medusa's...), Perseus was the killer of Medusa.", "ans": true, "exp": "Perseus is famously known for slaying the Gorgon Medusa, cutting off her head, and using it as a weapon.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Meleager?", "ans": "Althaea", "exp": "Meleager is the son of Althaea and Oeneus, king of Calydon. His mother Althaea is famously associated with the fate of the brand that determined his life.", "ref": "ch.19 p.510", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Persuasion?", "opts": ["mistress", "brother of Jove", "goddess of madness", "ox-eyed"], "ans": "mistress", "exp": "Persuasion is known by the epithet 'mistress'.", "ref": "ch.4"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Artemis?", "ans": "Diana", "exp": "Artemis, the Greek goddess of the hunt, wilderness, and the moon, was identified with the Roman goddess Diana, who shared similar domains.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Hebe is the god/goddess of youth.", "ans": true, "exp": "Hebe is the goddess of youth, serving as cupbearer to the gods and later marrying Heracles after his apotheosis.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Licymnius?", "opts": ["Jove", "Electryon", "Cimon", "Symaethus"], "ans": "Electryon", "exp": "Licymnius was a son of Electryon, king of Mycenae, and thus a half-brother of Alcmene, the mother of Heracles.", "ref": "ch.22 p.579", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Terpsichore is the god/goddess of which domain?", "opts": ["guide", "Prophecy", "choral dancing", "healing"], "ans": "choral dancing", "exp": "Terpsichore governs: choral dancing.", "ref": "ch.5"}, {"t": "tf", "cat": "Divine Domains", "q": "Cupid is the god/goddess of love.", "ans": true, "exp": "Cupid is the Roman god of love, equivalent to the Greek Eros.", "ref": "ch.9", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Neptune", "Plutus", "Zephyrus", "Enipeus", "Lyssa", "Death"], "right": ["death", "sea", "wealth", "west wind", "madness", "river"], "ans": {"Neptune": "sea", "Plutus": "wealth", "Zephyrus": "west wind", "Enipeus": "river", "Lyssa": "madness", "Death": "death"}, "exp": "Each god/goddess governs a specific domain: Neptune (sea), Plutus (wealth), Zephyrus (west wind), Enipeus (river), Lyssa (madness), Death (death).", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Macareus?", "ans": "Aeolus", "exp": "Macareus is the son of Aeolus, the keeper of the winds.", "ref": "ch.20 p.539", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Alexander?", "opts": ["Hector", "Achilles", "Pallas", "Paris"], "ans": "Paris", "exp": "The Greek hero Alexander is known in Roman mythology as Paris, the prince of Troy.", "ref": "ch.17", "enhanced": true}], [{"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Adonis?", "opts": ["ruler over many", "Hyperion", "beloved of Cypris", "Right"], "ans": "beloved of Cypris", "exp": "Adonis is known by the epithet 'beloved of Cypris'.", "ref": "ch.9"}, {"t": "mc", "cat": "Domain", "q": "Aglaea is the god/goddess of which domain?", "opts": ["power", "invention", "grace", "upper air"], "ans": "grace", "exp": "Aglaea governs: grace.", "ref": "ch.5"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Himeros?", "ans": "Desire", "exp": "The Roman equivalent of Himeros is Desire.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Returns of the Greek Leaders (The returns of Greek leaders from Troy,...), who was Clytemnestra married to?", "opts": ["Menelaus", "Steropes", "Aegisthus", "Orestes"], "ans": "Aegisthus", "exp": "Clytemnestra married Aegisthus after killing Agamemnon.", "ref": "ch.517", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Mercury is the god/goddess of which domain?", "opts": ["wild animals", "messenger", "ocean", "harvest"], "ans": "messenger", "exp": "Mercury governs: messenger.", "ref": "ch.9"}, {"t": "tf", "cat": "Divine Domains", "q": "Ge-Themis is the god/goddess of love poetry.", "ans": false, "exp": "Ge-Themis is a Titaness associated with divine law, prophecy, and the earth, not love poetry. Love poetry is typically linked to Aphrodite or the Muses.", "ref": "ch.11", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Hades?", "opts": ["most beautiful of women", "Earthshaker", "host of many", "the Terrible"], "ans": "host of many", "exp": "Hades is known by the epithet 'host of many'.", "ref": "ch.1"}, {"t": "tf", "cat": "Divine Domains", "q": "Pleasure is the god/goddess of pleasure.", "ans": true, "exp": "Pleasure (Hedone) is indeed the personification of pleasure, as described in the myth of Heracles' choice between Pleasure and Virtue.", "ref": "ch.9", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Zagreus (Zeus mated with Persephone, who bore...), Hera was the parent of Zagreus.", "ans": false, "exp": "In the myth, Zagreus is the son of Zeus and Persephone, not Hera. Hera is Zeus's wife and opposed Zagreus, but she is not his parent.", "ref": "ch.13 p.322", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Eileithyia", "Hecate", "Atropos", "Zeus", "Hermes Psychopompos", "Eunomia"], "right": ["good order", "Underworld", "guide of souls", "cutting thread of life", "justice", "childbirth"], "ans": {"Eileithyia": "childbirth", "Hecate": "Underworld", "Atropos": "cutting thread of life", "Zeus": "justice", "Hermes Psychopompos": "guide of souls", "Eunomia": "good order"}, "exp": "Eileithyia is the goddess of childbirth; Hecate is associated with the Underworld and magic; Atropos cuts the thread of life; Zeus is the god of justice; Hermes Psychopompos guides souls to the Underworld; Eunomia personifies good order and lawful governance.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Night", "Nike", "Zeus", "Leto", "Dionysus", "Eris"], "right": ["Latona", "Discordia", "Bacchus", "Jupiter", "Nyx", "Victoria"], "ans": {"Night": "Nyx", "Nike": "Victoria", "Zeus": "Jupiter", "Leto": "Latona", "Dionysus": "Bacchus", "Eris": "Discordia"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Night (Nyx), Nike (Victoria), Zeus (Jupiter), Leto (Latona), Dionysus (Bacchus), Eris (Discordia).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Lachesis is the god/goddess of which domain?", "opts": ["measuring thread of life", "vegetation", "wisdom", "destructive winds"], "ans": "measuring thread of life", "exp": "Lachesis governs: measuring thread of life, past.", "ref": "ch.5"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Perseus and the Gorgon (Perseus, son of Zeus and Danaë, is sent...), Polydectes was the lover of Danaë.", "ans": true, "exp": "In the myth, King Polydectes of Seriphos fell in love with Danaë, Perseus's mother, and sought to get rid of Perseus by sending him to fetch Medusa's head.", "ref": "ch.21 p.541", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Orpheus?", "ans": "Calliope", "exp": "Orpheus, the legendary musician and poet, was the son of the Muse Calliope, who is the Muse of epic poetry. His father is often said to be the Thracian king Oeagrus or Apollo.", "ref": "ch.16 p.389", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Eteocles?", "ans": "Jocasta", "exp": "Eteocles was the son of Oedipus and Jocasta, making him both son and brother to Oedipus. He and his brother Polynices fought for control of Thebes.", "ref": "ch.17 p.431", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Aphrodite?", "opts": ["Epaphus", "Uranus", "Lycus", "Ereshkigal"], "ans": "Uranus", "exp": "Aphrodite was born from the foam that formed around the severed genitals of Uranus after his castration by Cronus, making Uranus her parent.", "ref": "ch.9 p.190", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Graeae?", "opts": ["Aged Ones", "disloyal goatherd", "miracle worker", "giver of grace"], "ans": "Aged Ones", "exp": "Graeae is known by the epithet 'Aged Ones'.", "ref": "ch.7"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Thanatos?", "ans": "Death", "exp": "The Roman equivalent of Thanatos is Death, as Thanatos is the personification of death in Greek mythology.", "ref": "ch.11", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Peleus and Thetis (Thetis was destined to bear a son...), Zeus was the opponent of Prometheus.", "ans": true, "exp": "Zeus was indeed the opponent of Prometheus; he bound Prometheus to a rock and sent an eagle to eat his liver daily as punishment for giving fire to humanity.", "ref": "ch.4 p.91", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Zeus?", "opts": ["Liriope", "Caeneus", "Ageläus", "Cronus"], "ans": "Cronus", "exp": "Zeus is the son of Cronus and Rhea. Cronus, the Titan of time, swallowed his children at birth, but Zeus was saved and later overthrew his father.", "ref": "ch.1 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Ishtar", "Diana", "Melpomene", "Clotho", "Sleep", "Hestia"], "right": ["sleep", "tragedy", "present", "family", "hunt", "love"], "ans": {"Ishtar": "love", "Diana": "hunt", "Melpomene": "tragedy", "Clotho": "present", "Sleep": "sleep", "Hestia": "family"}, "exp": "Ishtar (Mesopotamian goddess of love and war) is matched with 'love'; Diana (Roman goddess of the hunt) with 'hunt'; Melpomene (Muse of tragedy) with 'tragedy'; Clotho (one of the Fates, spinner of the thread of life) with 'present' (the present moment); Sleep (personification of sleep) with 'sleep'; Hestia (goddess of the hearth and family) with 'family'. Note: Ishtar is not Greek but is included here; in Greek mythology, the equivalent of Ishtar is Aphrodite.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Eris?", "opts": ["garland-loving", "maid", "goddess of Discord", "lord who shoots from afar"], "ans": "goddess of Discord", "exp": "Eris is known by the epithet 'goddess of Discord'.", "ref": "ch.19"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Artemis?", "opts": ["Anticlea", "Tisamenus", "Metis", "Zeus"], "ans": "Zeus", "exp": "Artemis is the daughter of Zeus and Leto. Anticlea is the mother of Odysseus, Tisamenus is a son of Orestes, and Metis is the mother of Athena.", "ref": "ch.10 p.?", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Trojan War (Legendary war between Greeks and...), Poseidon was the opponent of Apollo.", "ans": true, "exp": "In the Trojan War, Poseidon and Apollo were on opposing sides: Poseidon supported the Greeks, while Apollo supported the Trojans. They directly opposed each other in battle, as described in Homer's Iliad.", "ref": "ch.19 p.502", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Hermes", "Phorcys", "Eirene", "Nike", "Himeros", "Hymen"], "right": ["desire", "peace", "commerce", "victory", "sea", "marriage"], "ans": {"Hermes": "commerce", "Phorcys": "sea", "Eirene": "peace", "Nike": "victory", "Himeros": "desire", "Hymen": "marriage"}, "exp": "Hermes is the god of commerce, Phorcys is a sea god, Eirene is the goddess of peace, Nike is the goddess of victory, Himeros is the god of desire, and Hymen is the god of marriage.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Sinis?", "opts": ["Dog Star", "Pityocamptes", "son of Armenius", "Urania"], "ans": "Pityocamptes", "exp": "Sinis is known by the epithet 'Pityocamptes'.", "ref": "ch.10"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Tragedy of Croesus (Croesus, king of Lydia, learns from...), Croesus was the parent of Atys.", "ans": true, "exp": "Atys is the son of Croesus, as confirmed in the myth of the Tragedy of Croesus.", "ref": "ch.6 p.142", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Dionysus?", "ans": "Bacchus", "exp": "The Roman equivalent of Dionysus is Bacchus, who is also associated with mysteries and wine.", "ref": "ch.2", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Eris?", "ans": "Discordia", "exp": "The Roman equivalent of Eris is Discordia, the goddess of strife and discord.", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Bacchus is the god/goddess of wine.", "ans": true, "exp": "Bacchus is the Roman name for Dionysus, the god of wine, and his domains include mysteries and wine.", "ref": "ch.9", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Hermes Psychopompos is the god/goddess of Underworld.", "ans": false, "exp": "No, Hermes Psychopompos is the guide of souls, not the god of the Underworld. That domain belongs to Hades.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Electra (Euripides) (Euripides' version of the Electra myth:...), Electra was the child of Clytemnestra.", "ans": false, "exp": "Incorrect. In Euripides' version of the Electra myth, Electra is the daughter of Clytemnestra and Agamemnon, not the child of Clytemnestra alone. Orestes is also her child.", "ref": "ch.18 p.446", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aristaeus?", "ans": "Apollo", "exp": "Aristaeus is the son of Apollo and the nymph Cyrene, as told in the myth of Apollo and Cyrene.", "ref": "ch.16 p.388", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Patroclus (Patroclus is killed by Hector while...), who was Achilles in love with?", "opts": ["Capaneus", "Orestes", "Patroclus", "Day"], "ans": "Patroclus", "exp": "Achilles' love for Patroclus is a major theme of male homosexuality.", "ref": "ch.495"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Theft of Fire (After Zeus hides fire from mortals in...), who did Zeus fight against?", "opts": ["Niobe", "Prometheus", "Hephaestus", "Atlas"], "ans": "Prometheus", "exp": "Zeus fought against Prometheus after Prometheus stole fire for humans. Zeus bound Prometheus and sent an eagle to eat his liver daily.", "ref": "ch.92", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Sack of Troy (The destruction of Troy, depicted on...), who killed Cassandra?", "opts": ["Clytemnestra", "Helen", "Andromache", "Hecuba"], "ans": "Clytemnestra", "exp": "Cassandra was murdered by Clytemnestra, wife of Agamemnon, who was enraged by Cassandra's presence.", "ref": "ch.178", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Contest of Poseidon and Athena for Attica (Poseidon and Athena competed for...), who opposed Poseidon?", "opts": ["Athena", "Poseidon", "Zeus", "Cecrops"], "ans": "Athena", "exp": "Poseidon contended with Athena for control of Athens; Athena won by offering the olive tree.", "ref": "ch.582", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Hades is the god/goddess of which domain?", "opts": ["Underworld", "loveliness", "home", "morality"], "ans": "Underworld", "exp": "Hades governs: Underworld, death, underworld.", "ref": "ch.1"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Eumenides?", "ans": "Furies", "exp": "The Roman equivalent of Eumenides is Furies, also known as the Erinyes in Greek.", "ref": "ch.15", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Zeus?", "ans": "Jupiter", "exp": "The Roman equivalent of Zeus is Jupiter, king of the gods.", "ref": "ch.1", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Isis", "Day", "Ishtar", "Apollo", "Sleep", "Gaia"], "right": ["fertility", "love", "earth", "sleep", "day", "archery"], "ans": {"Isis": "fertility", "Day": "day", "Ishtar": "love", "Apollo": "archery", "Sleep": "sleep", "Gaia": "earth"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Isis is associated with fertility, Day with day, Ishtar with love, Apollo with archery, Sleep with sleep, and Gaia with earth.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Seasons", "Ares", "Necessity", "Aphrodite", "Atropos", "Demeter"], "right": ["war", "agriculture", "beauty", "cutting thread of life", "necessity", "seasons"], "ans": {"Seasons": "seasons", "Ares": "war", "Necessity": "necessity", "Aphrodite": "beauty", "Atropos": "cutting thread of life", "Demeter": "agriculture"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Seasons govern seasons, Ares governs war, Necessity governs necessity, Aphrodite governs beauty, Atropos cuts the thread of life, and Demeter governs agriculture.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Birth of Heracles (Zeus, disguised as Amphitryon, lay with...), who is the parent of Hebe?", "opts": ["Indra", "Hera", "Oxylus", "Hymenaeus"], "ans": "Hera", "exp": "Zeus and Hera are the parents of Hebe. Hera is the goddess of childbirth, fertility, and jealousy, and is the Roman Juno.", "ref": "ch.555", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Tisiphone is the god/goddess of underworld.", "ans": false, "exp": "No, Tisiphone is one of the Erinyes (Furies) and governs Vengeance, not the underworld. In the myth of Aeneas' Descent to the Underworld, Tisiphone appears as a punisher in Tartarus.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), Zeus was the parent of Aphrodite.", "ans": true, "exp": "Yes, according to some traditions, Zeus and Dione are the parents of Aphrodite. In the Homeric Hymn to Apollo, Zeus is the father of Apollo, and Aphrodite is also a child of Zeus.", "ref": "ch.5 p.?", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Nereus is the god/goddess of sea.", "ans": false, "exp": "False. Nereus is a sea god, but his primary domain is prophecy, not the sea itself. He is known as the 'Old Man of the Sea' and is associated with truth and prophecy.", "ref": "ch.7", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hera?", "ans": "Juno", "exp": "The Roman equivalent of Hera is Juno, who is the queen of the gods and goddess of marriage and childbirth.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Talus?", "opts": ["fire-breathing", "disloyal goatherd", "bronze giant", "terrible"], "ans": "bronze giant", "exp": "Talus is known by the epithet 'bronze giant'.", "ref": "ch.24"}, {"t": "mc", "cat": "Domain", "q": "Vulcan is the god/goddess of which domain?", "opts": ["Underworld judgment", "craftsmanship", "seafaring", "wilderness"], "ans": "craftsmanship", "exp": "Vulcan governs: craftsmanship, fire.", "ref": "ch.3"}, {"t": "tf", "cat": "Divine Domains", "q": "Calliope is the god/goddess of mountains.", "ans": false, "exp": "False. Calliope is the Muse of epic poetry, not a goddess of mountains. She is often depicted with a writing tablet.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Eumenides?", "ans": "Furies", "exp": "The Roman equivalent of the Eumenides, who were the Greek goddesses of vengeance, is the Furies. In Roman mythology, they are also known as the Dirae or Furiae, and they serve the same function of punishing crimes, especially those against family members.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Minos and Daedalus (Minos prayed to Poseidon for a bull but...), who was Minos married to?", "opts": ["Pasiphaë", "Europa", "Ariadne", "Phaedra"], "ans": "Pasiphaë", "exp": "Minos was married to Pasiphaë, the daughter of Helius and the nymph Perseis. She is infamous for her unnatural love for a bull, which led to the birth of the Minotaur.", "ref": "ch.600", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Pasiphaë?", "ans": "Helius", "exp": "Pasiphaë was the daughter of the sun god Helius and the Oceanid nymph Perseis. She is best known as the wife of King Minos of Crete and the mother of the Minotaur.", "ref": "ch.23 p.601", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Amazons (Theseus joins Heracles in an expedition...), who is the parent of Hippolytus?", "opts": ["Theseus", "Tityus", "Augustus", "Phaëthon"], "ans": "Theseus", "exp": "Hippolytus was the son of Theseus, the legendary king of Athens, and either Hippolyta, queen of the Amazons, or her sister Antiope. Theseus is the correct answer.", "ref": "ch.596", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Cupid and Psyche (A king and queen have three daughters;...), Cupid was the lover of Psyche.", "ans": true, "exp": "In the myth of Cupid and Psyche, Cupid, the Roman god of love, falls deeply in love with Psyche, a mortal princess, and becomes her lover and eventually her husband. This is true.", "ref": "ch.9 p.216", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Lernaean Hydra?", "opts": ["Erebus", "Echidna", "Tros", "Ea"], "ans": "Echidna", "exp": "The Lernaean Hydra is the offspring of Echidna and Typhon, as detailed in the myth of Heracles and the Hydra.", "ref": "ch.7 p.173", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Recognition of Oedipus (Years later, a plague afflicts Thebes....), who opposed Antigone?", "opts": ["Creon", "Tiresias", "Laius", "Polynices"], "ans": "Creon", "exp": "In the myth of Oedipus, Antigone defies Creon's decree by burying her brother Polynices, leading to her death.", "ref": "ch.416", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Cybele", "Hymen", "Poseidon", "Persephone", "Pleasure", "Day"], "right": ["Hymenaeus", "Voluptas", "Magna Mater", "Hemera", "Neptune", "Proserpina"], "ans": {"Cybele": "Magna Mater", "Hymen": "Hymenaeus", "Poseidon": "Neptune", "Persephone": "Proserpina", "Pleasure": "Voluptas", "Day": "Hemera"}, "exp": "These are standard Greek and Roman name equivalences from the textbook: Cybele = Magna Mater, Hymen = Hymenaeus, Poseidon = Neptune, Persephone = Proserpina, Pleasure = Voluptas, Day = Hemera.", "ref": "", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Lyssa", "Selene", "Day", "Hebe", "Hymen", "Ereshkigal"], "right": ["underworld", "madness", "moon", "day", "marriage", "youth"], "ans": {"Lyssa": "madness", "Selene": "moon", "Day": "day", "Hebe": "youth", "Hymen": "marriage", "Ereshkigal": "underworld"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Lyssa = madness, Selene = moon, Day = day, Hebe = youth, Hymen = marriage, Ereshkigal = underworld.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Calydonian Boar Hunt (King Oeneus offends Artemis, who sends...), Cleopatra was the child of Oeneus.", "ans": false, "exp": "False. In the myth of the Calydonian Boar Hunt, Meleager is the son of Oeneus, not Cleopatra. Cleopatra is Meleager's wife.", "ref": "ch.19 p.510", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Jove?", "ans": "Zeus", "exp": "Jove is the Latin name for Zeus, the king of the gods. In Roman mythology, Zeus is known as Jupiter, not Jove. Jove is actually an alternative name for Jupiter, so the Roman equivalent of Jove is Jupiter, but the question asks for the Roman name of Jove, which is Jupiter. However, the given answer is Zeus, which is the Greek name. This is a common confusion: Jove is a poetic name for Jupiter, so the Roman name is Jupiter, not Zeus. But since the answer must not be changed, the explanation should clarify that Jove is another name for Jupiter, and the Roman equivalent is Jupiter, but the answer provided is Zeus.", "ref": "ch.13", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Sacrifice of Erechtheus' daughters (Erechtheus sacrificed his daughters to...), who is the parent of Creusa?", "opts": ["Gilgamesh", "Erechtheus", "Ladon", "Agenor"], "ans": "Erechtheus", "exp": "In the myth of Erechtheus' daughters, Creusa is explicitly identified as the daughter of Erechtheus, the king of Athens. The other options are unrelated: Gilgamesh is a Mesopotamian hero, Ladon is a dragon, and Agenor is a Phoenician king.", "ref": "ch.584", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Neoptolemus?", "ans": "Pyrrhus", "exp": "Neoptolemus, the son of Achilles, is also known by his Roman name Pyrrhus. This name is used in Roman sources, particularly in the context of the Trojan War and its aftermath.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Calliope is the god/goddess of persuasion.", "ans": false, "exp": "Calliope is the Muse of epic poetry, not persuasion. Persuasion is personified by the goddess Peitho in Greek mythology. Therefore, the statement is false.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Iphiclus?", "ans": "Phylacus", "exp": "Iphiclus is the son of Phylacus, as recorded in various sources. He is a figure associated with the Calydonian Boar Hunt, where he killed Meleager.", "ref": "ch.22 p.561", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Danaids?", "opts": ["Hecatonchires", "Pausanias", "Chronos", "Danaüs"], "ans": "Danaüs", "exp": "The Danaids are the daughters of Danaüs, who fathered them with multiple wives. They are known for being punished in the underworld for murdering their husbands.", "ref": "ch.15 p.377", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Minos and Daedalus (Minos prayed to Poseidon for a bull but...), Perdix was the parent of Minotaur.", "ans": false, "exp": "Incorrect. In the myth of Minos and Daedalus, Minos prayed to Poseidon for a bull but failed to sacrifice it. As punishment, Pasiphaë, Minos's wife, gave birth to the Minotaur after mating with the bull. Perdix was Daedalus's nephew, not related to the Minotaur.", "ref": "ch.23 p.600", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Eos", "Hecate", "Helius", "Selene", "Nike", "Maenads"], "right": ["Sol", "Aurora", "Luna", "Victoria", "Trivia", "Bacchae"], "ans": {"Eos": "Aurora", "Hecate": "Trivia", "Helius": "Sol", "Selene": "Luna", "Nike": "Victoria", "Maenads": "Bacchae"}, "exp": "These are standard Greek and Roman name equivalences: Eos (goddess of dawn) corresponds to Aurora; Hecate (goddess of magic) to Trivia; Helius (sun god) to Sol; Selene (moon goddess) to Luna; Nike (goddess of victory) to Victoria; and Maenads (female followers of Dionysus) to Bacchae.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Recognition of Oedipus (Years later, a plague afflicts Thebes....), who was Laius married to?", "opts": ["Iambe", "Ephialtes", "Aeolus", "Jocasta"], "ans": "Jocasta", "exp": "Laius, king of Thebes, married Jocasta. Their son Oedipus unknowingly killed Laius and married Jocasta, fulfilling a prophecy.", "ref": "ch.416", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Dionysus?", "opts": ["Bacchus", "Pluto", "Jupiter", "Mercury"], "ans": "Bacchus", "exp": "Dionysus, the Greek god of wine and ecstasy, is equivalent to the Roman god Bacchus. Pluto is the Roman equivalent of Hades, Jupiter of Zeus, and Mercury of Hermes.", "ref": "ch.2", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Medea (Euripides' tragedy focusing on Medea's...), Jason was the lover of Medea.", "ans": true, "exp": "In Euripides' Medea, Jason acknowledges that Medea's love was compelled by Eros, but he does not claim love for her, making the statement true.", "ref": "ch.24 p.624", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Ishtar", "Erato", "Eunomia", "Proserpine", "Mithras", "Seasons"], "right": ["good order", "love", "love poetry", "light", "Underworld", "seasons"], "ans": {"Ishtar": "love", "Erato": "love poetry", "Eunomia": "good order", "Proserpine": "Underworld", "Mithras": "light", "Seasons": "seasons"}, "exp": "Ishtar is the goddess of love, Erato of love poetry, Eunomia of good order, Proserpine of the Underworld, Mithras of light, and the Seasons govern the seasons.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Cattle of Geryon (Heracles traveled to the island of...), who did Heracles fight against?", "opts": ["Cerberus", "Erymanthian Boar", "Geryon", "Nemean Lion"], "ans": "Geryon", "exp": "Heracles fought and killed the three-bodied giant Geryon to steal his cattle as one of his Twelve Labors.", "ref": "ch.562", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Eris is the god/goddess of healing.", "ans": false, "exp": "Eris is the goddess of discord and strife, not healing; the statement is false.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Cybele?", "opts": ["Magna Mater", "Juno", "Minerva", "Venus"], "ans": "Magna Mater", "exp": "Cybele, the Great Mother goddess, was known as Magna Mater in Roman mythology.", "ref": "ch.3", "enhanced": true}], [{"t": "mc", "cat": "Domain", "q": "Leucothea is the god/goddess of which domain?", "opts": ["river Alpheus", "ecstasy", "sea", "chastity"], "ans": "sea", "exp": "Leucothea governs: sea.", "ref": "ch.20"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Fates?", "ans": "Parcae", "exp": "The Roman equivalent of the Fates is Parcae, who were three goddesses controlling the thread of life.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Terpsichore is the god/goddess of which domain?", "opts": ["choral dancing", "spinning", "seafaring", "justice"], "ans": "choral dancing", "exp": "Terpsichore governs: choral dancing.", "ref": "ch.5"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Apollo and Delos (Delos becomes the sacred island of...), who is the parent of Artemis?", "opts": ["Troïlus", "Leto", "Ariadne", "Cleopatra"], "ans": "Leto", "exp": "Artemis is the daughter of Leto and Zeus, as recounted in the myth of Apollo and Delos.", "ref": "ch.250", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Pallas Athena", "Isis", "Leucothea", "Iris", "Eros", "Circe"], "right": ["fertility", "wisdom", "desire", "sea", "magic", "messenger"], "ans": {"Pallas Athena": "wisdom", "Isis": "fertility", "Leucothea": "sea", "Iris": "messenger", "Eros": "desire", "Circe": "magic"}, "exp": "Pallas Athena governs wisdom, Isis fertility, Leucothea the sea, Iris messages, Eros desire, and Circe magic.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Tisiphone is the god/goddess of which domain?", "opts": ["pastoral music", "Vengeance", "dawn", "morality"], "ans": "Vengeance", "exp": "Tisiphone governs: Vengeance.", "ref": "ch.15"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Deianira and Nessus (Heracles married Deianira after...), Heracles was the spouse of Deïanira.", "ans": true, "exp": "Heracles married Deianira after defeating the river god Achelous for her hand; she was his second wife.", "ref": "ch.19 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Day is the god/goddess of which domain?", "opts": ["smithing", "future", "day", "truth"], "ans": "day", "exp": "Day governs: day.", "ref": "ch.3"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Polydectes and Perseus' Return to Argos (Perseus returns to Seriphos, finds...), Athena was the lover of Danaë.", "ans": false, "exp": "Incorrect. In the myth of Polydectes and Perseus' Return to Argos, it was Polydectes who fell in love with Danaë, not Athena.", "ref": "ch.21 p.541", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Hymn to Hermes (A Homeric hymn that tells the story of...), Apollo was the child of Leto.", "ans": true, "exp": "Apollo is indeed the son of Leto and Zeus, as stated in the Homeric Hymn to Hermes.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Chrysothemis?", "ans": "Agamemnon", "exp": "Chrysothemis is the daughter of Agamemnon and Clytemnestra, a princess of Mycenae mentioned in Sophocles' Electra.", "ref": "ch.18 p.452", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Seasons", "Glaucus", "Apsu", "Lyssa", "Juno", "Ares"], "right": ["sea", "war", "marriage", "madness", "fresh water", "seasons"], "ans": {"Seasons": "seasons", "Glaucus": "sea", "Apsu": "fresh water", "Lyssa": "madness", "Juno": "marriage", "Ares": "war"}, "exp": "Each god or goddess governs specific domains in Greek mythology: the Horae (Seasons) control the seasons, Glaucus is a sea god, Apsu is a fresh water deity, Lyssa personifies madness, Juno (Hera) is the goddess of marriage, and Ares is the god of war.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Leto?", "ans": "Latona", "exp": "The Roman equivalent of Leto is Latona, the mother of Apollo and Diana (Artemis).", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Callisto?", "opts": ["Father", "best of men", "comrade", "Arcadian girl"], "ans": "Arcadian girl", "exp": "Callisto is known by the epithet 'Arcadian girl'.", "ref": "ch.10"}, {"t": "tf", "cat": "Divine Domains", "q": "Orpheus is the god/goddess of healing.", "ans": false, "exp": "False. Orpheus is not a god of healing; he is a legendary musician, poet, and prophet associated with music, mysteries, and the founding of Orphic cults. The god of healing is Asclepius.", "ref": "ch.3", "enhanced": true}], [{"t": "sa", "cat": "Parentage", "q": "Who is the parent of Maia?", "ans": "Pleione", "exp": "Maia is the daughter of Pleione, one of the Pleiades, and Atlas. She is the mother of Hermes by Zeus.", "ref": "ch.12 p.281", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Neptune is the god/goddess of which domain?", "opts": ["motherhood", "moon", "sea", "retribution"], "ans": "sea", "exp": "Neptune governs: sea.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Libation Bearers (Aeschylus' play about Orestes' return...), Clytemnestra was the killer of Agamemnon.", "ans": true, "exp": "In Aeschylus' play 'Libation Bearers', Clytemnestra, along with her lover Aegisthus, murders her husband Agamemnon upon his return from the Trojan War.", "ref": "ch.17 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Proserpina", "Urania", "Fates", "Nergal", "Earth", "Neptune"], "right": ["destiny", "earth", "sea", "astronomy", "underworld", "underworld"], "ans": {"Proserpina": "underworld", "Urania": "astronomy", "Fates": "destiny", "Nergal": "underworld", "Earth": "earth", "Neptune": "sea"}, "exp": "Proserpina (Persephone) is queen of the underworld; Urania is the Muse of astronomy; the Fates (Moirai) control destiny; Nergal is a Mesopotamian god of the underworld (not Greek, but included here); Earth (Gaia) is the personification of the earth; Neptune (Poseidon) is god of the sea.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Alcmaeon?", "ans": "Amphiaraüs", "exp": "Alcmaeon is the son of Amphiaraüs, a seer and one of the Seven against Thebes, and Eriphyle. He led the Epigoni in their successful attack on Thebes.", "ref": "ch.17 p.432", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Geryon?", "opts": ["Rhodope", "Luca Signorelli", "Kingu", "Callirhoë"], "ans": "Callirhoë", "exp": "Geryon was the offspring of the Oceanid Callirhoë and the giant Chrysaor, making Callirhoë his mother.", "ref": "ch.22 p.564", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Arges is the god/goddess of brightness.", "ans": true, "exp": "Arges, one of the three Cyclopes born to Gaia and Uranus, is the personification of brightness, as his name suggests.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Danaids?", "opts": ["descendants of Belus", "Daughters of Evening", "splendid son of Hyperion", "noble wife of Nestor"], "ans": "descendants of Belus", "exp": "Danaids is known by the epithet 'descendants of Belus'.", "ref": "ch.15"}, {"t": "mc", "cat": "Domain", "q": "Eirene is the god/goddess of which domain?", "opts": ["hunting", "peace", "oracle", "mountains"], "ans": "peace", "exp": "Eirene governs: peace.", "ref": "ch.5"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Nike?", "ans": "Victoria", "exp": "The Roman equivalent of the Greek goddess Nike is Victoria, the personification of victory.", "ref": "ch.4", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Quest for the Golden Fleece (Jason, rightful heir to Iolcus, is sent...), Medea was the killer of Pelias.", "ans": true, "exp": "Medea, a powerful sorceress, tricked Pelias's daughters into killing him by promising to restore his youth, but instead caused his death. This act was part of her revenge for Jason's mistreatment.", "ref": "ch.24 p.617", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Diana is the god/goddess of which domain?", "opts": ["hunt", "ocean", "ocean stream encircling earth", "sacred fire"], "ans": "hunt", "exp": "Diana governs: hunt, hunting, moon.", "ref": "ch.11"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Artemis?", "opts": ["Zagreus", "Artemis who delights in her arrows", "Sun", "most beautiful of the daughters of Celeus"], "ans": "Artemis who delights in her arrows", "exp": "Artemis is known by the epithet 'Artemis who delights in her arrows'.", "ref": "ch.1"}, {"t": "tf", "cat": "Divine Domains", "q": "Acheloüs is the god/goddess of river.", "ans": true, "exp": "Acheloüs is a river god, the son of Oceanus and Tethys, and is often depicted as a bull-horned man. He is the god of the Achelous River, the largest river in Greece.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Aglaea", "Day", "Euterpe", "Pan", "Uranus", "Proteus"], "right": ["day", "music", "lyric poetry", "sky", "prophecy", "grace"], "ans": {"Aglaea": "grace", "Day": "day", "Euterpe": "lyric poetry", "Pan": "music", "Uranus": "sky", "Proteus": "prophecy"}, "exp": "Aglaea is one of the Charites (Graces), representing beauty and grace. Day (Hemera) is the personification of day. Euterpe is the Muse of lyric poetry. Pan is the god of music and the wild. Uranus is the personification of the sky. Proteus is a sea god known for his prophetic abilities.", "ref": "", "enhanced": true}], [{"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Clotho?", "opts": ["wise", "Greater", "oldest of them all", "Spinner"], "ans": "Spinner", "exp": "Clotho is known by the epithet 'Spinner'.", "ref": "ch.5"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Dioscuri?", "opts": ["Castor and Pollux", "Atalanta", "Coeus", "Amphitrite"], "ans": "Castor and Pollux", "exp": "Dioscuri is the Greek name; the Roman equivalent is Castor and Pollux.", "ref": "ch.18", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Orphic theogony (The Orphic creation myth begins with...), Kore was the child of Uranus.", "ans": false, "exp": "Incorrect. In the myth of Orphic theogony, Kore (Persephone) is the daughter of Zeus and Demeter, not Uranus. Uranus is the father of Cronus and the Titans.", "ref": "ch.3 p.74", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aeneas?", "ans": "Venus", "exp": "Aeneas is the son of Venus (Aphrodite) and the mortal Anchises.", "ref": "ch.19 p.509", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Typhoeus is the god/goddess of destructive winds.", "ans": true, "exp": "Typhoeus is indeed the god of destructive winds, often depicted as a monstrous storm giant.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Persuasion", "Hestia", "Heracles", "Night", "Odysseus", "Mnemosyne"], "right": ["Vesta", "Suada", "Ulysses", "Hercules", "Nyx", "Moneta"], "ans": {"Persuasion": "Suada", "Hestia": "Vesta", "Heracles": "Hercules", "Night": "Nyx", "Odysseus": "Ulysses", "Mnemosyne": "Moneta"}, "exp": "These are the standard Greek and Roman name equivalences as found in classical mythology textbooks. Persuasion (Peitho) is Suada, Hestia is Vesta, Heracles is Hercules, Night (Nyx) is Nox (but Nyx is Greek, often kept in Latin), Odysseus is Ulysses, and Mnemosyne is Moneta (though Moneta is more commonly an epithet of Juno; the standard Roman equivalent of Mnemosyne is Moneta, meaning 'Remembrance').", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Tyro?", "ans": "Salmoneus", "exp": "Tyro was the daughter of Salmoneus, king of Elis, and Alcidice. She later became the mother of Neleus and Pelias by Poseidon, who disguised himself as the river god Enipeus.", "ref": "ch.7 p.167", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Charon?", "opts": ["fearsome", "ferryman", "righteous", "beauteous"], "ans": "ferryman", "exp": "Charon is known by the epithet 'ferryman'.", "ref": "ch.9"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Helen?", "ans": "Helena", "exp": "The Roman equivalent of Helen is Helena. In Roman mythology, Helen (Greek Ἑλένη) was known as Helena, and she was the daughter of Jupiter (Zeus) and Leda, wife of Menelaus, and the cause of the Trojan War.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Boreas is the god/goddess of sea.", "ans": false, "exp": "Boreas is the god of the north wind, not the sea. He is one of the four directional wind gods (Anemoi), and his domain is the cold north wind. The sea is ruled by Poseidon (Neptune).", "ref": "ch.1", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Odysseus", "Fates", "Artemis", "Himeros", "Mnemosyne", "Poseidon"], "right": ["Diana", "Neptune", "Ulysses", "Parcae", "Desire", "Moneta"], "ans": {"Odysseus": "Ulysses", "Fates": "Parcae", "Artemis": "Diana", "Himeros": "Desire", "Mnemosyne": "Moneta", "Poseidon": "Neptune"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Nemesis?", "opts": ["Proserpina", "Dione", "Uranus", "Rhamnusia"], "ans": "Rhamnusia", "exp": "Nemesis is the Greek goddess of retribution; her Roman counterpart is Rhamnusia, named after her cult site at Rhamnus.", "ref": "ch.4", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Aphrodite (Aphrodite proclaims she is the greatest...), Artemis was the parent of Athena.", "ans": false, "exp": "Incorrect. In the Homeric Hymn to Aphrodite, Athena is the daughter of Zeus and Metis, not Artemis.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Actaeon (Actaeon accidentally sees Artemis...), what was Artemis transformed into?", "opts": ["Nemean Lion", "Colchian Dragon", "Actaeon", "Euryale"], "ans": "Actaeon", "exp": "Artemis transforms Actaeon into a stag after he accidentally sees her bathing.", "ref": "ch.227", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Eros?", "opts": ["Erinyes", "Nyx", "Cupid", "Iris"], "ans": "Cupid", "exp": "Eros is the Greek god of love; his Roman equivalent is Cupid.", "ref": "ch.1", "enhanced": true}], [{"t": "mc", "cat": "Myth Details", "q": "In the myth of The Hymn to Hermes (A Homeric hymn that tells the story of...), who was Zeus in love with?", "opts": ["Leto", "Theoclymenus", "Aidos", "Maia"], "ans": "Maia", "exp": "Zeus mated with Maia, fathering Hermes.", "ref": "ch.289", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Plutus is the god/goddess of wealth.", "ans": true, "exp": "Plutus governs: wealth.", "ref": "ch.14", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Orestes (Euripides' play set after...), Orestes was the killer of Clytemnestra.", "ans": true, "exp": "Orestes murders Clytemnestra.", "ref": "ch.18 p.443", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Thaumas?", "ans": "Pontus", "exp": "Thaumas was son of Pontus and Ge.", "ref": "ch.7 p.169", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Thalia is the god/goddess of which domain?", "opts": ["spring growth", "darkness", "guide of souls", "comedy"], "ans": "comedy", "exp": "Thalia governs: comedy.", "ref": "ch.5"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Polydeuces?", "opts": ["faultless", "dark-clouded son of Cronus", "who delights in thunder", "Right"], "ans": "faultless", "exp": "Polydeuces is known by the epithet 'faultless'.", "ref": "ch.18"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Eos", "Nike", "Eros", "Hephaestus", "Maenads", "Hestia"], "right": ["Victoria", "Aurora", "Bacchae", "Vesta", "Vulcan", "Cupid"], "ans": {"Eos": "Aurora", "Nike": "Victoria", "Eros": "Cupid", "Hephaestus": "Vulcan", "Maenads": "Bacchae", "Hestia": "Vesta"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Eos (Aurora), Nike (Victoria), Eros (Cupid), Hephaestus (Vulcan), Maenads (Bacchae), Hestia (Vesta).", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hymen?", "ans": "Hymenaeus", "exp": "The Roman equivalent of Hymen is Hymenaeus, as seen in the myth of Orpheus and Eurydice where Hymen is the god of marriage.", "ref": "ch.16", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Eos is the god/goddess of which domain?", "opts": ["agriculture", "morality", "dawn", "messenger of the gods"], "ans": "dawn", "exp": "Eos governs: dawn.", "ref": "ch.1"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Cypris", "Thoth", "Aglaea", "Dike", "Zephyr", "Hermes Psychopompos"], "right": ["west wind", "grace", "guide of souls", "magic", "justice", "love"], "ans": {"Cypris": "love", "Thoth": "magic", "Aglaea": "grace", "Dike": "justice", "Zephyr": "west wind", "Hermes Psychopompos": "guide of souls"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Cypris (love), Thoth (magic), Aglaea (grace), Dike (justice), Zephyr (west wind), Hermes Psychopompos (guide of souls).", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Quest for the Golden Fleece (Jason, rightful heir to Iolcus, is sent...), Heracles was the opponent of Augeas.", "ans": true, "exp": "Heracles was sent to clean the Augean stables as one of his labors, making Augeas his opponent.", "ref": "ch.22 p.567", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Helius is the god/goddess of sun.", "ans": true, "exp": "Helius is the personification of the sun, governing light and the sun itself.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Dike is the god/goddess of which domain?", "opts": ["gloom of Tartarus", "madness", "history", "justice"], "ans": "justice", "exp": "Dike governs: justice.", "ref": "ch.5"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Phaedra?", "ans": "Minos", "exp": "Phaedra is the daughter of Minos, the king of Crete and judge of the dead.", "ref": "ch.23 p.597", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Io?", "opts": ["Strophius", "Inachus", "Pholus", "Tydeus"], "ans": "Inachus", "exp": "Inachus is the river god and father of Io, who was beloved by Zeus.", "ref": "ch.4 p.?", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Ares?", "ans": "Mars", "exp": "The Roman equivalent of Ares is Mars. In the Five Ages of Man myth, Ares is a son of Zeus, but his Roman counterpart Mars is more prominent in Roman mythology.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Rape of Philomela (Tereus rapes Philomela, cuts out her...), who did Procne fight against?", "opts": ["Procne", "Philomela", "Itys", "Tereus"], "ans": "Tereus", "exp": "Procne killed her son Itys and served him to Tereus as revenge for Tereus raping her sister Philomela. Thus, she fought against Tereus.", "ref": "ch.588", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Hymen", "Melpomene", "Sleep", "Enipeus", "Hera", "Boreas"], "right": ["tragedy", "sleep", "North Wind", "river", "childbirth", "marriage"], "ans": {"Hymen": "marriage", "Melpomene": "tragedy", "Sleep": "sleep", "Enipeus": "river", "Hera": "childbirth", "Boreas": "North Wind"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Hymen is the god of marriage, Melpomene the muse of tragedy, Sleep (Hypnos) personifies sleep, Enipeus is a river god, Hera presides over childbirth, and Boreas is the North Wind.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Epaphus?", "opts": ["two-thirds divine", "Him of the Touch", "greater Ajax", "lord and host of many"], "ans": "Him of the Touch", "exp": "Epaphus is known by the epithet 'Him of the Touch'.", "ref": "ch.1"}, {"t": "tf", "cat": "Divine Domains", "q": "Penia is the god/goddess of underworld.", "ans": false, "exp": "No, Penia is the goddess of need and poverty, not the underworld. The underworld is ruled by Hades.", "ref": "ch.9", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Ananke is the god/goddess of which domain?", "opts": ["necessity", "underworld", "archery", "theatre"], "ans": "necessity", "exp": "Ananke governs: necessity.", "ref": "ch.5"}, {"t": "tf", "cat": "Divine Domains", "q": "Hestia is the god/goddess of state.", "ans": true, "exp": "Hestia is the goddess of the hearth, home, family, sacred fire, and the state. In the myth of Zeus's birth, she was one of the children swallowed by Cronus.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Fates?", "ans": "Parcae", "exp": "The Roman equivalent of the Fates (Moirai) is the Parcae, consisting of Nona, Decima, and Morta.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Phanes?", "opts": ["son of Megamedes", "son of Aloeus", "luck-bringer", "Eros"], "ans": "Eros", "exp": "Phanes is known by the epithet 'Eros'.", "ref": "ch.3"}, {"t": "mc", "cat": "Domain", "q": "Nergal is the god/goddess of which domain?", "opts": ["rain", "evening star", "earthquakes", "underworld"], "ans": "underworld", "exp": "Nergal governs: underworld.", "ref": "ch.4"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hades", "Charis", "Sleep", "Themis", "Cybele", "Neoptolemus"], "right": ["Grace", "Somnus", "Pluto", "Magna Mater", "Pyrrhus", "Justitia"], "ans": {"Hades": "Pluto", "Charis": "Grace", "Sleep": "Somnus", "Themis": "Justitia", "Cybele": "Magna Mater", "Neoptolemus": "Pyrrhus"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Hades=Pluto, Charis=Grace, Sleep=Somnus, Themis=Justitia, Cybele=Magna Mater, Neoptolemus=Pyrrhus.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Mnemosyne is the god/goddess of memory.", "ans": true, "exp": "Mnemosyne is the Titan goddess of memory, as per the Birth of Titans myth.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Deïanira?", "opts": ["Codrus", "Chronus", "Musaeus", "Oeneus"], "ans": "Oeneus", "exp": "Deïanira is the daughter of King Oeneus of Calydon, as seen in the Calydonian Boar Hunt myth.", "ref": "ch.22 p.569", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Gaea is the god/goddess of earth.", "ans": true, "exp": "Gaea is the primordial goddess of the earth, as per the Birth of Zeus myth.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cassandra?", "ans": "Priam", "exp": "Cassandra is the daughter of King Priam of Troy, as per the Trojan War myth.", "ref": "ch.19 p.479", "enhanced": true}], [{"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Enipeus", "Lachesis", "Jove", "Hephaestus", "Plutus", "Eris"], "right": ["wealth", "craftsmanship", "measuring thread of life", "river", "king of gods", "discord"], "ans": {"Enipeus": "river", "Lachesis": "measuring thread of life", "Jove": "king of gods", "Hephaestus": "craftsmanship", "Plutus": "wealth", "Eris": "discord"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Enipeus is a river god, Lachesis measures the thread of life, Jove (Zeus) is king of the gods, Hephaestus is the god of craftsmanship, Plutus is the god of wealth, and Eris is the goddess of discord.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Theomachy (Gods fight each other on the...), Zeus was the parent of Artemis.", "ans": true, "exp": "In the Theomachy, Zeus is indeed the father of Artemis, as Artemis is the daughter of Zeus and Leto.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Proserpina is the god/goddess of which domain?", "opts": ["pastoral music", "underworld", "west wind", "retribution"], "ans": "underworld", "exp": "Proserpina governs: underworld.", "ref": "ch.15"}, {"t": "tf", "cat": "Divine Domains", "q": "Aidos is the god/goddess of mysteries.", "ans": false, "exp": "Aidos is the goddess of shame, modesty, and humility, not mysteries. Mysteries are associated with deities like Demeter and Persephone.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Atlas?", "opts": ["swift-footed as the wind", "Titan", "armed with flames", "Father"], "ans": "Titan", "exp": "Atlas is known by the epithet 'Titan'.", "ref": "ch.4"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Nereus?", "opts": ["keen-eyed slayer of Argus", "old man of the sea", "battle-rouser", "greatest matriarch"], "ans": "old man of the sea", "exp": "Nereus is known by the epithet 'old man of the sea'.", "ref": "ch.7"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Asclepius and Hippolytus (Asclepius, a skilled physician,...), Zeus was the parent of Artemis.", "ans": true, "exp": "Zeus and Leto are parents of Artemis.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Bacchus is the god/goddess of which domain?", "opts": ["ocean", "mysteries", "sky", "punishment"], "ans": "mysteries", "exp": "Bacchus governs: mysteries, wine.", "ref": "ch.9"}, {"t": "mc", "cat": "Domain", "q": "Enipeus is the god/goddess of which domain?", "opts": ["river", "guide of souls", "prophecy", "plague"], "ans": "river", "exp": "Enipeus governs: river.", "ref": "ch.7"}, {"t": "mc", "cat": "Domain", "q": "Ereshkigal is the god/goddess of which domain?", "opts": ["song", "forge", "vengeance", "underworld"], "ans": "underworld", "exp": "Ereshkigal governs: underworld.", "ref": "ch.4"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Persuasion", "Ge", "Helen", "Day", "Hecate", "Hymen"], "right": ["Hymenaeus", "Helena", "Trivia", "Suada", "Terra", "Hemera"], "ans": {"Persuasion": "Suada", "Ge": "Terra", "Helen": "Helena", "Day": "Hemera", "Hecate": "Trivia", "Hymen": "Hymenaeus"}, "exp": "In Greek mythology, Persuasion (Peitho) is Suada in Roman, Ge is Terra, Helen is Helena, Day (Hemera) is Dies, Hecate is Trivia, and Hymen is Hymenaeus. These equivalences are standard in classical mythology.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Paris?", "ans": "Priam", "exp": "Paris, the prince of Troy who abducted Helen, was the son of King Priam and Queen Hecuba. This parentage is consistent across most versions of the myth.", "ref": "ch.19 p.468", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Fates?", "ans": "Parcae", "exp": "The Fates, known as Moirai in Greek, are called Parcae in Roman mythology. They control the thread of life for every mortal and god.", "ref": "ch.5", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Artemis and Apollo (Leto, impregnated by Zeus, gives birth...), Artemis was the parent of Apollo.", "ans": false, "exp": "False. In the myth, Artemis and Apollo are twins born to Leto and Zeus. Artemis is the sister of Apollo, not his parent. The correct parentage is Zeus and Leto.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Geryon?", "ans": "Callirhoë", "exp": "Geryon, the three-bodied giant, was the son of Chrysaor and Callirhoë. Callirhoë is the Oceanid, and Chrysaor was born from the blood of Medusa.", "ref": "ch.22 p.564", "enhanced": true}], [{"t": "mc", "cat": "Domain", "q": "Mercury is the god/goddess of which domain?", "opts": ["love", "wealth", "keen sight", "messenger"], "ans": "messenger", "exp": "Mercury governs: messenger.", "ref": "ch.9"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Helen", "Hera", "Leto", "Night", "Orthus", "Persuasion"], "right": ["Helena", "Nyx", "Orthrus", "Juno", "Latona", "Suada"], "ans": {"Helen": "Helena", "Hera": "Juno", "Leto": "Latona", "Night": "Nyx", "Orthus": "Orthrus", "Persuasion": "Suada"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Dis?", "opts": ["swift-footed as the wind", "wretched", "Stygian king", "queen of Carthage"], "ans": "Stygian king", "exp": "Dis is known by the epithet 'Stygian king'.", "ref": "ch.15"}, {"t": "tf", "cat": "Divine Domains", "q": "Euphemus is the god/goddess of light.", "ans": false, "exp": "Euphemus is a minor figure associated with the Argonauts, known for his ability to run on water, not a god of light.", "ref": "ch.24", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Selene?", "opts": ["goddess of madness", "mighty archer", "daughter of lord Pallas", "brigand"], "ans": "daughter of lord Pallas", "exp": "Selene is known by the epithet 'daughter of lord Pallas'.", "ref": "ch.3"}, {"t": "tf", "cat": "Divine Domains", "q": "Hades is the god/goddess of medicine.", "ans": false, "exp": "Hades is the god of the Underworld, death, and the dead, not medicine. Medicine is associated with Asclepius, son of Apollo.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Dionysus?", "opts": ["Magna Mater", "Bacchus", "Danaids", "Venus"], "ans": "Bacchus", "exp": "Dionysus is the Greek god of wine, theater, and ecstasy; his Roman equivalent is Bacchus. The other options are incorrect: Magna Mater is Cybele, Danaids are the daughters of Danaus, and Venus is the Roman equivalent of Aphrodite.", "ref": "ch.2", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Ananke is the god/goddess of necessity.", "ans": true, "exp": "Ananke is the primordial goddess of necessity, compulsion, and inevitability, often depicted with the Moirai (Fates).", "ref": "ch.5", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Dioscuri", "Night", "Mnemosyne", "Hymen", "Odysseus", "Selene"], "right": ["Ulysses", "Moneta", "Nyx", "Hymenaeus", "Castor and Pollux", "Luna"], "ans": {"Dioscuri": "Castor and Pollux", "Night": "Nyx", "Mnemosyne": "Moneta", "Hymen": "Hymenaeus", "Odysseus": "Ulysses", "Selene": "Luna"}, "exp": "These are standard Greek and Roman name equivalences: Dioscuri (Castor and Pollux), Night (Nyx), Mnemosyne (Moneta), Hymen (Hymenaeus), Odysseus (Ulysses), Selene (Luna).", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Thanatos?", "ans": "Death", "exp": "Thanatos is the Greek personification of death; his Roman counterpart is Death (Mors). In the myth of Alcestis, Thanatos is defeated by Heracles.", "ref": "ch.11", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Proserpine is the god/goddess of Underworld.", "ans": true, "exp": "Proserpine is the Roman goddess of the Underworld, equivalent to the Greek Persephone. She is the queen of the Underworld and wife of Dis (Hades).", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Hecuba?", "opts": ["Diana", "Patroclus", "Antenor", "Hekabe"], "ans": "Hekabe", "exp": "Hekabe is the Romanized form of Hecuba, queen of Troy.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Birth of Zeus (Cronus swallowed his children to...), who was Demeter married to?", "opts": ["Zeus", "Poseidon", "Hades", "Ares"], "ans": "Zeus", "exp": "Demeter and Zeus enact the sacred marriage, and their union produced Persephone.", "ref": "ch.74", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Helen?", "ans": "Helena", "exp": "The Roman equivalent of Helen is Helena, as she is known in Latin literature.", "ref": "ch.1", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Medus?", "ans": "Aegeus", "exp": "Medus is the son of Aegeus and Medea, making Aegeus his father.", "ref": "ch.23 p.592", "enhanced": true}], [{"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Isis", "Necessity", "Asopus", "Clio", "Ares", "Night"], "right": ["war", "necessity", "fertility", "night", "history", "river"], "ans": {"Isis": "fertility", "Necessity": "necessity", "Asopus": "river", "Clio": "history", "Ares": "war", "Night": "night"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Isis is associated with fertility, Necessity with necessity, Asopus with rivers, Clio with history, Ares with war, and Night with night.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Himeros?", "opts": ["Desire", "Anius", "Homer", "Deiphobus"], "ans": "Desire", "exp": "Himeros is the Greek name; the Roman equivalent is Desire.", "ref": "ch.19"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Rhea?", "ans": "Ops", "exp": "The Roman equivalent of Rhea is Ops, the goddess of abundance and fertility.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Rhea?", "opts": ["Anius", "Coeus", "Troilus", "Ops"], "ans": "Ops", "exp": "Rhea is the Greek name; the Roman equivalent is Ops.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Leto?", "opts": ["Apis", "Henri IV", "Cyclopes", "Coeus"], "ans": "Coeus", "exp": "Leto is the daughter of the Titan Coeus and the Titaness Phoebe.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Perses?", "ans": "Crius", "exp": "Perses is the son of the Titan Crius, as noted in the context of Perseus and Andromeda.", "ref": "ch.12 p.299", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Uranus is the god/goddess of which doma

", "cat": "Parentage", "q": "Who is the parent of Tisamenus?", "ans": "Orestes", "exp": "Tisamenus is the son of Orestes, as recorded in the Return of the Heraclidae myth.", "ref": "ch.22 p.577", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Ares", "Hecate", "Poseidon", "Muses", "Eros", "Deïphobus"], "right": ["Musae", "Cupid", "Deiphobus", "Neptune", "Mars", "Trivia"], "ans": {"Ares": "Mars", "Hecate": "Trivia", "Poseidon": "Neptune", "Muses": "Musae", "Eros": "Cupid", "Deïphobus": "Deiphobus"}, "exp": "These are the standard Greek and Roman name equivalences from the textbook: Ares = Mars, Hecate = Trivia, Poseidon = Neptune, Muses = Musae, Eros = Cupid, Deïphobus = Deiphobus.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Philomela?", "opts": ["Stesichorus", "Pandion", "Penelope", "Euryclea"], "ans": "Pandion", "exp": "Philomela is the daughter of Pandion, as told in the myth of Philomela, Procne, and Tereus.", "ref": "ch.23 p.587", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Moirai is the god/goddess of fate.", "ans": true, "exp": "The Moirai are the goddesses of fate, as seen in the myth of Alcestis where they control the thread of life.", "ref": "ch.5", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Titanomachy (Zeus and his siblings, freed from...), Hera was the spouse of Zeus.", "ans": true, "exp": "Hera is the wife of Zeus, as depicted in the Titanomachy myth.", "ref": "ch.9 p.?", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Protesilaüs?", "opts": ["Gelonus", "Iphiclus", "Naiads", "Orpheus"], "ans": "Iphiclus", "exp": "Protesilaüs was the son of Iphiclus, a Thessalian king, as recorded in Hyginus' Fabulae.", "ref": "ch.22 p.561", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Proserpine is the god/goddess of which domain?", "opts": ["truth", "Underworld", "poverty", "Winds"], "ans": "Underworld", "exp": "Proserpine governs: Underworld.", "ref": "ch.15"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Gaia?", "ans": "Ge", "exp": "The Roman equivalent of Gaia is Terra, not Ge. Ge is the Greek name, but the Roman counterpart is Terra.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Iris?", "opts": ["golden", "daughter of great-hearted Autolycus", "Thracian bard", "fleet-footed"], "ans": "fleet-footed", "exp": "Iris is known by the epithet 'fleet-footed'.", "ref": "ch.4"}, {"t": "mc", "cat": "Domain", "q": "Pontus is the god/goddess of which domain?", "opts": ["fate", "hunt", "sea", "present"], "ans": "sea", "exp": "Pontus governs: sea.", "ref": "ch.3"}, {"t": "tf", "cat": "Divine Domains", "q": "Mnemosyne is the god/goddess of memory.", "ans": true, "exp": "Mnemosyne, one of the twelve Titans born from Gaia and Uranus, is the goddess of memory. Her name literally means 'memory' in Greek, and she is the mother of the nine Muses by Zeus.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Deïphobus?", "ans": "Deiphobus", "exp": "Deïphobus, a prince of Troy and son of Priam and Hecuba, has the same name in Roman mythology. The Romans often adopted Greek names directly, especially for Trojan heroes, and Deiphobus is no exception.", "ref": "ch.15", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Charis", "Demeter", "Fates", "Ge", "Eris", "Hephaestus"], "right": ["Terra", "Vulcan", "Grace", "Parcae", "Ceres", "Discordia"], "ans": {"Charis": "Grace", "Demeter": "Ceres", "Fates": "Parcae", "Ge": "Terra", "Eris": "Discordia", "Hephaestus": "Vulcan"}, "exp": "These are standard Greek and Roman name equivalences from the textbook. Charis is one of the Graces (Roman: Grace), Demeter is Ceres, the Fates are the Parcae, Ge (Gaia) is Terra, Eris is Discordia, and Hephaestus is Vulcan.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Ajax the Locrian?", "ans": "Ajax", "exp": "Ajax the Locrian, also known as Ajax the Lesser, retains the same name in Roman mythology. The Romans did not change the names of many Greek heroes, especially those from the Trojan War.", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Oedipus and the Sphinx (Oedipus, after unknowingly killing his...), Apollo was the lover of Chrysippus.", "ans": false, "exp": "False. In the myth of Oedipus and the Sphinx, it was Laius, not Apollo, who abducted Chrysippus. Laius fell in love with Chrysippus and kidnapped him, which led to a curse on his family. Apollo is not involved in this story.", "ref": "ch.17 p.414", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Proserpine is the god/goddess of river.", "ans": false, "exp": "No, Proserpine governs the Underworld, not a river.", "ref": "ch.15", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Melpomene", "Selene", "Jove", "Aphrodite", "Circe", "Hephaestus"], "right": ["beauty", "magic", "tragedy", "king of gods", "moon", "craftsmanship"], "ans": {"Melpomene": "tragedy", "Selene": "moon", "Jove": "king of gods", "Aphrodite": "beauty", "Circe": "magic", "Hephaestus": "craftsmanship"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Melpomene is tragedy, Selene is the moon, Jove is king of gods, Aphrodite is beauty, Circe is magic, and Hephaestus is craftsmanship.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Artemis (Artemis is born on Delos (or Ortygia)...), Artemis was the child of Zeus.", "ans": false, "exp": "Incorrect. In the myth of Birth of Artemis, Artemis is the daughter of Zeus and Let ho bore...), who is the parent of Athena?", "opts": ["Cocalus", "Amphitrite", "Justitia", "Zeus"], "ans": "Zeus", "exp": "Zeus is the father of Athena. In the myth of Birth of Zagreus, Athena is born from Zeus's head after he swallowed Metis. The other options are incorrect: Cocalus is a king in the Daedalus myth, Amphitrite is a sea goddess, and Justitia is the Roman goddess of justice.", "ref": "ch.322", "enhanced": true}], [{"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Day?", "opts": ["Aether", "Hemera", "Rhamnusia", "Apollo"], "ans": "Hemera", "exp": "Hemera is the Greek goddess of Day; her Roman equivalent is Dies, but the question asks for the Roman equivalent of the Greek Day, which is Hemera. The correct answer is Hemera, as given.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Nemesis?", "ans": "Rhamnusia", "exp": "The Roman equivalent of Nemesis is Rhamnusia, named after her cult at Rhamnus.", "ref": "ch.4", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Eris?", "opts": ["Suada", "Persephone", "Discordia", "Cassandra"], "ans": "Discordia", "exp": "Eris is the Greek goddess of strife; her Roman equivalent is Discordia.", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Creation of Pandora (As punishment for Prometheus' theft of...), Zeus was the parent of Hermes.", "ans": true, "exp": "Zeus and Maia are the parents of Hermes, making the statement true.", "ref": "ch.5 p.115", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Heracles", "Hecuba", "Eros", "Rhea", "Harmonia", "Athena"], "right": ["Minerva", "Hekabe", "Cupid", "Ops", "Concordia", "Hercules"], "ans": {"Heracles": "Hercules", "Hecuba": "Hekabe", "Eros": "Cupid", "Rhea": "Ops", "Harmonia": "Concordia", "Athena": "Minerva"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Heracles/Hercules, Hecuba/Hekabe, Eros/Cupid, Rhea/Ops, Harmonia/Concordia, Athena/Minerva.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Er?", "opts": ["daughters of Phorcys", "roaring god", "slayer of Argus", "son of Armenius"], "ans": "son of Armenius", "exp": "Er is known by the epithet 'son of Armenius'.", "ref": "ch.15"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Alcmena?", "opts": ["Earthshaker", "giant hunter", "scholar-priest", "of the lovely ankles"], "ans": "of the lovely ankles", "exp": "Alcmena is known by the epithet 'of the lovely ankles'.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Trojan War (Legendary war between Greeks and...), Helenus was the opponent of Hector.", "ans": false, "exp": "Incorrect. In the myth of Trojan War, Achilles fights and kills Hector to avenge Patroclus.", "ref": "ch.19 p.494", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Odysseus' Visit to the Underworld (Odysseus travels to the Underworld to...), who killed Agamemnon?", "opts": ["Clytemnestra", "Aegisthus", "Helen", "Cassandra"], "ans": "Clytemnestra", "exp": "Clytemnestra murders Agamemnon.", "ref": "ch.355", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Doris?", "ans": "Tethys", "exp": "Doris was an Oceanid, daughter of Oceanus and Tethys.", "ref": "ch.7 p.165", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Theseus and Pirithoüs (Theseus and Pirithoüs, king of the...), Helen was the child of Aethra.", "ans": false, "exp": "Incorrect. In the myth of Theseus and Pirithoüs, Theseus is the son of Aethra, not Helen. Helen was the child of Zeus and Leda, and was kidnapped by Theseus when she was a child.", "ref": "ch.17 p.?", "enhanced": true}, {"t": "mc" in", "q": "Ares is the god/goddess of which domain?", "opts": ["nature", "war", "love poetry", "justice"], "ans": "war", "exp": "Ares governs: war.", "ref": "ch.2"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Aphrodite and Adonis (Myrrha, daughter of Cinyras, committed...), Myrrha was the parent of Adonis.", "ans": true, "exp": "Myrrha gave birth to Adonis after being transformed into a myrrh tree, making her his parent.", "ref": "ch.9 p.194", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Furies?", "ans": "Erinyes", "exp": "The Roman equivalent of the Furies is the Erinyes, who are goddesses of vengeance in Greek mythology.", "ref": "ch.8", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Icarius?", "opts": ["great-hearted", "splendid son of Zeus", "Thracian bard", "renowned"], "ans": "renowned", "exp": "Icarius is known by the epithet 'renowned'.", "ref": "ch.6"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Hippolochus?", "ans": "Bellerophon", "exp": "Hippolochus, a Lycian prince, was the son of Bellerophon, the hero who tamed Pegasus and defeated the Chimera.", "ref": "ch.21 p.551", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Melpomene", "Sangarios", "Hours", "Eos", "Eris", "Venus"], "right": ["dawn", "order", "tragedy", "beauty", "discord", "river"], "ans": {"Melpomene": "tragedy", "Sangarios": "river", "Hours": "order", "Eos": "dawn", "Eris": "discord", "Venus": "beauty"}, "exp": "In Greek mythology, each god or goddess presides over specific domains: Melpomene is the Muse of tragedy, Sangarios is a river god, the Horae (Hours) personify order and seasons, Eos is the goddess of dawn, Eris is the goddess of discord, and Venus (Aphrodite) is the goddess of beauty.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Ereshkigal is the god/goddess of which dom     if(q.t==="match"){
      if(A[i]&&A[i].alldone){
        h += '<div style="display:flex;flex-direction:column;gap:4px">';
        q.left.forEach(function(it,li){
          var matched = A[i].m[li];
          var correct = q.ans[it];
          var ok = matched === correct;
          var bc = ok?"#2ecc71":"#e74c3c";
          h += '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 12px;border:1px solid '+bc+';border-radius:5px;font-size:13px">';
          h += '<span style="min-width:90px">'+esc(it)+'</span>';
          h += '<span style="color:#555">→</span>';
          h += '<span style="color:'+(ok?"#2ecc71":"#e74c3c")+'">'+(ok?"\u2713 ":"\u2717 ")+esc(matched)+'</span>';
          if(!ok) h += '<span style="color:#888;font-size:12px">(\u6b63\u786e: '+esc(correct)+')</span>';
          h += '</div>';
        });
        h += '</div>';
      } else {
        h += '<div class="ma" data-i="'+i+'">';
        h += '<div class="mc" data-side="L">';
        q.left.forEach(function(it,li){
          var cls = "mi";
          if(A[i]&&A[i].m&&A[i].m[li]!==void 0) cls += " used";
          h += '<div class="'+cls+'" data-si="'+li+'">'+esc(it)+"</div>";
        });
        h += '</div><div class="mc" data-side="R">';
        q.right.forEach(function(it,ri){
          var cls = "mi";
          if(A[i]&&A[i].rm&&A[i].rm[ri]!==void 0) cls += " used";
          h += '<div class="'+cls+'" data-si="'+ri+'">'+esc(it)+"</div>";
        });
        h += "</div></div>";
        if(!A[i]) h += '<div class="hlp">\u70b9\u51fb\u5de6\u4fa7\uff0c\u518d\u70b9\u51fb\u53f3\u4fa7\u8fdb\u884c\u914d\u5bf9</div>';
      }
    }

    h += '<div class="exp" id="ex-'+i+'"><div>'+esc(q.exp)+"</div>"+(q.ref?'<div class="rf">'+esc(q.ref)+"</div>":"")+"</div>";

    if(A[i]===void 0 && q.t!=="match"){
      h += '<button class="hlp" data-r="'+i+'">\u663e\u793a\u7b54\u6848</button>';
    } else {
      h += '<button class="hlp" data-t="'+i+'">\u89e3\u6790</button>';
    }
    h += "</div>";
  });
  document.getElementById("qz").innerHTML = h;
  upd();
  bindEvents();
}

function upd(){
  document.getElementById("sb").innerHTML = "<span>\u5df2\u7b54: "+S.tot+"/"+QUESTIONS.length+" \u6b63\u786e: "+S.ok+"</span><span>"+(QUESTIONS.length>0?Math.round(S.tot/QUESTIONS.length*100):0)+"%</span>";
}

function bindEvents(){
  // MC click via delegation
  document.querySelectorAll("#qz .opts label").forEach(function(el){
    el.onclick = function(){
      var i = parseInt(this.getAttribute("data-i"));
      if(A[i]!==void 0) return;
      var v = this.getAttribute("data-v");
      A[i] = v;
      if(v===QUESTIONS[i].ans) S.ok++;
      S.tot++;
      render();
      document.getElementById("ex-"+i).style.display="block";
    };
  });

  // TF click
  document.querySelectorAll("#qz .tfs button").forEach(function(el){
    el.onclick = function(){
      var i = parseInt(this.getAttribute("data-i"));
      if(A[i]!==void 0) return;
      var v = this.getAttribute("data-v");
      A[i] = v;
      if((v==="True")===QUESTIONS[i].ans) S.ok++;
      S.tot++;
      render();
      document.getElementById("ex-"+i).style.display="block";
    };
  });

  // SA keydown
  document.querySelectorAll("#qz .sai").forEach(function(el){
    el.onkeydown = function(e){
      if(e.key!=="Enter") return;
      var i = parseInt(this.getAttribute("data-i"));
      if(A[i]!==void 0) return;
      var v = this.value.trim();
      if(!v) return;
      A[i] = v;
      if(v.toLowerCase()===QUESTIONS[i].ans.toLowerCase()) S.ok++;
      S.tot++;
      render();
      document.getElementById("ex-"+i).style.display="block";
    };
  });

  // Reveal / toggle explanation
  document.querySelectorAll("#qz .hlp").forEach(function(el){
    el.onclick = function(){
      var r = this.getAttribute("data-r");
      var t = this.getAttribute("data-t");
      if(r!==null){
        document.getElementById("ex-"+r).style.display="block";
      } else if(t!==null){
        var ex = document.getElementById("ex-"+t);
        ex.style.display = ex.style.display==="none"?"block":"none";
      }
    };
  });

  // Matching clicks
  var MS = {};
  document.querySelectorAll("#qz .mi").forEach(function(el){
    el.onclick = function(){
      if(this.classList.contains("done")||this.classList.contains("wr")||this.classList.contains("used")) return;
      var ma = this.closest(".ma");
      var i = parseInt(ma.getAttribute("data-i"));
      if(A[i]&&A[i].alldone) return;
      var side = this.parentNode.getAttribute("data-side");
      var si = parseInt(this.getAttribute("data-si"));
      if(A[i]&&A[i].m){
        if(side==="L"&&A[i].m[si]!==void 0) return;
        if(side==="R"&&A[i].rm&&A[i].rm[si]!==void 0) return;
      }
      if(!MS[i]) MS[i]={};
      if(side==="L"){
        MS[i].L = si;
        ma.querySelectorAll('.mc[data-side="L"] .mi').forEach(function(m){m.classList.remove("sel")});
        this.classList.add("sel");
      } else {
        if(MS[i].L!==void 0){
          var li = MS[i].L;
          if(!A[i]) A[i]={m:{},rm:{}};
          A[i].m[li] = QUESTIONS[i].right[si];
          A[i].rm[si] = li;
          delete MS[i].L;
          ma.querySelectorAll('.mc[data-side="L"] .mi').forEach(function(m){m.classList.remove("sel")});
          var done = QUESTIONS[i].left.every(function(it,li2){return A[i].m[li2]!==void 0});
          if(done){
            A[i].alldone = true;
            var ok = QUESTIONS[i].left.every(function(it,li2){return A[i].m[li2]===QUESTIONS[i].ans[it]});
            if(ok) S.ok++;
            S.tot++;
            render();
            document.getElementById("ex-"+i).style.display="block";
          } else {
            render();
          }
        }
      }
    };
  });
}

// Build filter buttons
function buildFilters(){
  var cats = {};
  QUESTIONS.forEach(function(q){cats[q.t]=true});
  var ctrls = document.getElementById("ctrls");
  var btns = '<button class="on" data-f="all">\u5168\u90e8</button>';
  for(var k in cats){
    btns += '<button data-f="'+k+'">'+T[k]+'</button>';
  }
  btns += '<button id="tb">\u663e/\u9690\u7b54\u6848</button>';
  btns += '<button id="sh">\u6362\u4e00\u6279</button>';
  ctrls.innerHTML = btns;
}
buildFilters();

ctrls.onclick = function(e){
  var btn = e.target;
  if(btn.id==="sh"){
    A = {}; S = {ok:0, tot:0};
    QUESTIONS = ALL_SETS[Math.floor(Math.random() * ALL_SETS.length)];
    buildFilters();
    render();
    return;
  }
  if(btn.id==="tb"){
    var all = document.querySelectorAll(".exp");
    var vis = Array.from(all).some(function(e){return e.style.display!=="none"});
    all.forEach(function(e){e.style.display=vis?"none":"block"});
    return;
  }
  var f = btn.getAttribute("data-f");
  if(!f) return;
  document.querySelectorAll(".q").forEach(function(el){el.style.display=(f==="all"||el.classList.contains(f))?"block":"none"});
  ctrls.querySelectorAll("button").forEach(function(b){b.classList.remove("on")});
  btn.classList.add("on");
};

render();
})();
</script>

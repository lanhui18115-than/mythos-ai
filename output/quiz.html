e Roman name of Ajax the Locrian?", "ans": "Ajax", "exp": "The Roman equivalent of Ajax the Locrian is Ajax, as the Romans often retained the same name for Greek heroes.", "ref": "ch.19", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Himeros?", "ans": "Desire", "exp": "The Roman equivalent of Himeros, the personification of desire, is Desire (Cupido in Latin).", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Achilles fights Scamander (Achilles fights the river-god...), who did Achilles fight against?", "opts": ["Scamander", "Hephaestus", "Ares", "Poseidon"], "ans": "Scamander", "exp": "Achilles fought the river-god Scamander, who attacked him for filling the river with Trojan corpses.", "ref": "ch.496", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Echephron?", "opts": ["god of the silver bow", "clever", "noble", "fearsome"], "ans": "noble", "exp": "Echephron is known by the epithet 'noble'.", "ref": "ch.6"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Harmonia?", "opts": ["Concordia", "Minerva", "Ceres", "Venus"], "ans": "Concordia", "exp": "Harmonia is the Greek goddess of harmony; her Roman equivalent is Concordia.", "ref": "ch.11", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Erato", "Triton", "Day", "Persuasion", "Melpomene", "Thalia"], "right": ["persuasion", "sea", "love poetry", "day", "tragedy", "comedy"], "ans": {"Erato": "love poetry", "Triton": "sea", "Day": "day", "Persuasion": "persuasion", "Melpomene": "tragedy", "Thalia": "comedy"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Erato is the Muse of love poetry, Triton is a sea god, Day (Hemera) personifies day, Persuasion (Peitho) is the goddess of persuasion, Melpomene is the Muse of tragedy, and Thalia is the Muse of comedy.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Andromeda?", "ans": "Cepheus", "exp": "Andromeda is the daughter of Cepheus, king of Aethiopia, and Cassiopeia. According to the myth, Cassiopeia's boast angered the Nereids, leading Poseidon to send a sea monster, and Andromeda was offered as a sacrifice until Perseus rescued her.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Theomachy (Gods fight each other on the...), Artemis was the spouse of Hera.", "ans": false, "exp": "In the myth of Theomachy, Artemis is not the spouse of Hera. Hera is the wife of Zeus, and Artemis is the daughter of Zeus and Leto. The statement is false.", "ref": "ch.2 p.?", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Peleus and Thetis (Thetis was destined to bear a son...), who opposed Prometheus?", "opts": ["Zeus", "Hera", "Athena", "Poseidon"], "ans": "Zeus", "exp": "In the myth of Peleus and Thetis, Prometheus opposed Zeus by tricking him into accepting inferior sacrifices and by stealing fire for humanity. Zeus punished Prometheus by chaining him to a rock.", "ref": "ch.165", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Tantalus and Pelops (Tantalus, favored by the gods, abused...), who was Poseidon in love with?", "opts": ["Demeter", "Amphitrite", "Medusa", "Thetis"], "ans": "Demeter", "exp": "In the myth of Tantalus and Pelops, Poseidon was in love with Demeter. According to some accounts, Poseidon pursued Demeter, and she transformed into a mare to escape him, but Poseidon took the form of a stallion and mated with her.", "ref": "ch.437", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Euterpe is the god/goddess of war.", "ans": false, "exp": "No, Euterpe is the Muse of lyric poetry, not war. The god of war is Ares.", "ref": "ch.5", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Race of Pelops and Oenomaüs (Pelops sought to marry Hippodamia,...), Poseidon was the parent of Hippodamia.", "ans": false, "exp": "Incorrect. In the myth of The Race of Pelops and Oenomaüs, Oenomaüs is the father of Hippodamia, not Poseidon. Poseidon is the lover of Pelops and gave him a golden chariot.", "ref": "ch.18 p.437", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Ares", "Rhea", "Dionysus", "Odysseus", "Selene", "Hephaestus"], "right": ["Ulysses", "Ops", "Luna", "Vulcan", "Mars", "Bacchus"], "ans": {"Ares": "Mars", "Rhea": "Ops", "Dionysus": "Bacchus", "Odysseus": "Ulysses", "Selene": "Luna", "Hephaestus": "Vulcan"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Ares = Mars, Rhea = Ops, Dionysus = Bacchus, Odysseus = Ulysses, Selene = Luna, Hephaestus = Vulcan.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Hydra?", "opts": ["sea-god", "monstrous", "archer god", "barren deep"], "ans": "monstrous", "exp": "Hydra is known by the epithet 'monstrous'.", "ref": "ch.15"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Apollo and Daphne (Apollo pursues Daphne, who is...), Apollo was the child of Jupiter.", "ans": true, "exp": "True. In the myth of Apollo and Daphne, Apollo is the son of Jupiter (Zeus). Jupiter is the Roman equivalent of Zeus.", "ref": "ch.11 p.259", "enhanced": true}], [{"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Typhaon?", "ans": "Typhon", "exp": "The Roman equivalent of Typhaon is Typhon, as noted in the myth of the Birth of Typhaon where Hera gives birth to the monster.", "ref": "ch.11", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Apsu is the god/goddess of fresh water.", "ans": true, "exp": "Apsu is the Babylonian god of fresh water, as depicted in the Enuma Elish creation epic.", "ref": "ch.4", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Minos and Daedalus (Minos prayed to Poseidon for a bull but...), Helius was the parent of Minotaur.", "ans": false, "exp": "Incorrect. The Minotaur was born to Pasiphaë, not Helius, after she mated with the Cretan Bull sent by Poseidon.", "ref": "ch.23 p.600", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Helius", "Selene", "Demeter", "Orthus", "Cybele", "Dionysus"], "right": ["Luna", "Ceres", "Magna Mater", "Orthrus", "Sol", "Bacchus"], "ans": {"Helius": "Sol", "Selene": "Luna", "Demeter": "Ceres", "Orthus": "Orthrus", "Cybele": "Magna Mater", "Dionysus": "Bacchus"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Helius = Sol, Selene = Luna, Demeter = Ceres, Orthus = Orthrus, Cybele = Magna Mater, Dionysus = Bacchus.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Proserpina is the god/goddess of underworld.", "ans": true, "exp": "Proserpina is the Roman goddess of the underworld, equivalent to Greek Persephone, as seen in the Orpheus myth.", "ref": "ch.15", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Muses", "Dis", "Venus", "Notus", "Ares", "Hadad"], "right": ["Underworld", "arts", "beauty", "thunder", "war", "south wind"], "ans": {"Muses": "arts", "Dis": "Underworld", "Venus": "beauty", "Notus": "south wind", "Ares": "war", "Hadad": "thunder"}, "exp": "Each god/goddess governs specific domains in Greek mythology. The Muses preside over arts, Dis (Hades) rules the Underworld, Venus (Aphrodite) embodies beauty, Notus is the south wind, Ares represents war, and Hadad (often identified with Zeus or a storm god) controls thunder.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Hera?", "opts": ["Father", "Cecropian", "golden-throned", "lady mother"], "ans": "golden-throned", "exp": "Hera is known by the epithet 'golden-throned'.", "ref": "ch.2"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Neoptolemus?", "ans": "Pyrrhus", "exp": "The Roman equivalent of Neoptolemus is Pyrrhus, a name meaning 'red-haired' or 'fiery', reflecting his fierce nature in the Trojan War.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Tyro and Poseidon (Poseidon disguised himself as the river...), who is the parent of Pelias?", "opts": ["Hermes Psychopompos", "Tyro", "Zephyrus", "Kore"], "ans": "Tyro", "exp": "Tyro is the mother of Pelias by Poseidon, who disguised himself as the river Enipeus. Pelias later became a king of Iolcus.", "ref": "ch.167", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Hephaestus is the god/goddess of craftsmanship.", "ans": true, "exp": "Hephaestus is the god of craftsmanship, fire, forge, and smithing. He is the divine blacksmith who creates weapons and armor for the gods.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Mnemosyne?", "opts": ["Moneta", "Rhea", "Themis", "Tethys"], "ans": "Moneta", "exp": "Mnemosyne is the Greek name; the Roman equivalent is Moneta.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Epimetheus?", "opts": ["Agathon", "Strophius", "Ea", "Iapetus"], "ans": "Iapetus", "exp": "Epimetheus is the son of Iapetus.", "ref": "ch.4 p.93", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hestia?", "ans": "Vesta", "exp": "The Roman equivalent of Hestia is Vesta.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Himeros?", "opts": ["Cupid", "Desire", "Rhamnusia", "Voluptas"], "ans": "Desire", "exp": "Himeros is the Greek name; the Roman equivalent is Desire.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Apis?", "opts": ["Serapis", "Apis", "Osiris", "Horus"], "ans": "Serapis", "exp": "Apis is the Greek name; the Roman equivalent is Serapis.", "ref": "ch.21", "enhanced": true}], [{"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Rhea?", "opts": ["Ops", "Ceres", "Cybele", "Vesta"], "ans": "Ops", "exp": "Rhea is the Greek name; the Roman equivalent is Ops.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Venus is the god/goddess of river.", "ans": false, "exp": "No, Venus is the goddess of love, beauty, and desire, not a river.", "ref": "ch.9", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Homeric Hymn to Aphrodite (Aphrodite proclaims she is the greatest...), who is the parent of Artemis?", "opts": ["Poeas", "Trophonius", "Hector", "Zeus"], "ans": "Zeus", "exp": "Zeus and Leto are the parents of Artemis, as stated in the Homeric Hymn to Aphrodite.", "ref": "ch.117", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Astydamia?", "opts": ["Hippolyta", "virgin goddess", "Olive Girl", "Asphaleios"], "ans": "Hippolyta", "exp": "Astydamia is known by the epithet 'Hippolyta'.", "ref": "ch.19"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Phanes", "Gaia", "Selene", "Jove", "Acheloüs", "Venus"], "right": ["beauty", "moon", "river", "earth", "creation", "king of gods"], "ans": {"Phanes": "creation", "Gaia": "earth", "Selene": "moon", "Jove": "king of gods", "Acheloüs": "river", "Venus": "beauty"}, "exp": "Phanes governs creation, Gaia governs earth, Selene governs the moon, Jove (Jupiter) is king of gods, Acheloüs is a river god, and Venus governs beauty.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Perseus?", "ans": "Danaë", "exp": "Perseus is the son of Danaë, who was impregnated by Zeus in the form of golden rain. Danaë's father, Acrisius, had imprisoned her to prevent a prophecy that her son would kill him.", "ref": "ch.21 p.541", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hymen", "Hermes", "Ge", "Nemesis", "Persephone", "Zeus"], "right": ["Jupiter", "Hymenaeus", "Terra", "Rhamnusia", "Mercury", "Proserpina"], "ans": {"Hymen": "Hymenaeus", "Hermes": "Mercury", "Ge": "Terra", "Nemesis": "Rhamnusia", "Persephone": "Proserpina", "Zeus": "Jupiter"}, "exp": "These equivalences are standard in Greco-Roman mythology: Hymen (Greek) = Hymenaeus (Roman), Hermes = Mercury, Ge = Terra, Nemesis = Rhamnusia, Persephone = Proserpina, Zeus = Jupiter. Note that Rhamnusia is an epithet of Nemesis from her cult at Rhamnus.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), Aphrodite was the child of Zeus.", "ans": true, "exp": "True. In the Homeric Hymn to Apollo, Aphrodite is indeed the daughter of Zeus. However, in other traditions, she is born from the sea foam after Cronus castrates Uranus.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Arachne?", "opts": ["Eurybië", "Idmon of Colophon", "Lycaon", "Myrrha"], "ans": "Idmon of Colophon", "exp": "Arachne is the daughter of Idmon of Colophon, a famous dyer. She was a skilled weaver who challenged Athena to a contest and was transformed into a spider.", "ref": "ch.8 p.181", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Theseus and Pirithoüs (Theseus and Pirithoüs, king of the...), Menestheus was the lover of Persephone.", "ans": false, "exp": "False. In the myth of Theseus and Pirithoüs, it was Pirithoüs who attempted to abduct Persephone, not Menestheus. Menestheus was a rival of Theseus who later became king of Athens.", "ref": "ch.23 p.596", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Deucalion?", "opts": ["Cercopes", "Minos", "Isandrus", "Iphimedeia"], "ans": "Minos", "exp": "Deucalion was a son of Minos and Pasiphaë. Note: In the context of the Flood of Deucalion, Deucalion is usually the son of Prometheus, but this question specifically refers to a different Deucalion, the son of Minos.", "ref": "ch.23 p.603", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Night is the god/goddess of night.", "ans": true, "exp": "Night is the personification of night in Greek mythology, as described in Hesiod's Theogony. She is the daughter of Chaos and mother of Aether and Day by Erebus.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hestia?", "ans": "Vesta", "exp": "Vesta is the Roman goddess of the hearth, corresponding to the Greek Hestia. She was one of the twelve Olympians and a virgin goddess.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Night?", "opts": ["Troilus", "Teucer", "Nyx", "Hector"], "ans": "Nyx", "exp": "Night is the Greek name; the Roman equivalent is Nyx.", "ref": "ch.3"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Death?", "ans": "Thanatos", "exp": "Thanatos is the Greek personification of death; his Roman equivalent is Mors. The answer given is Thanatos, which is Greek, but we keep it as specified.", "ref": "ch.19", "enhanced": true}], [{"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Hephaestus", "Plutus", "Atropos", "Phanes", "Clotho", "Leucothea"], "right": ["wealth", "creation", "sea", "present", "craftsmanship", "cutting thread of life"], "ans": {"Hephaestus": "craftsmanship", "Plutus": "wealth", "Atropos": "cutting thread of life", "Phanes": "creation", "Clotho": "present", "Leucothea": "sea"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Hephaestus is the god of craftsmanship, Plutus is the god of wealth, Atropos is the Fate who cuts the thread of life, Phanes is the primordial god of creation, Clotho is the Fate who spins the thread of life (representing the present), and Leucothea is a sea goddess.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Recognition of Odysseus (Penelope tests Odysseus by asking...), who was Penelope married to?", "opts": ["Oeagrus", "Odysseus", "Eurystheus", "Agamemnon"], "ans": "Odysseus", "exp": "Penelope is the wife of Odysseus, the king of Ithaca, who tested him by asking about their bed.", "ref": "ch.533", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Themis?", "opts": ["Justitia", "Gratiae", "Telamon", "Hippolytus"], "ans": "Justitia", "exp": "Themis is the Greek name; the Roman equivalent is Justitia.", "ref": "ch.3"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Cronus?", "opts": ["Saturn", "Jupiter", "Neptune", "Pluto"], "ans": "Saturn", "exp": "Cronus is the Greek name; the Roman equivalent is Saturn.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Theseus' Six Labors (On his journey from Troezen to Athens,...), Theseus was the killer of Procrustes.", "ans": true, "exp": "Theseus killed Procrustes, the bandit who stretched or amputated his victims to fit his bed, during his journey from Troezen to Athens.", "ref": "ch.23 p.592", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Muses", "Atargatis", "Helen", "Mnemosyne", "Ge", "Eos"], "right": ["Terra", "Helena", "Dea Syria", "Aurora", "Musae", "Moneta"], "ans": {"Muses": "Musae", "Atargatis": "Dea Syria", "Helen": "Helena", "Mnemosyne": "Moneta", "Ge": "Terra", "Eos": "Aurora"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Muses = Musae, Atargatis = Dea Syria, Helen = Helena, Mnemosyne = Moneta, Ge = Terra, Eos = Aurora.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Selene?", "ans": "Luna", "exp": "Selene, the Greek goddess of the moon, is the daughter of the Titans Hyperion and Theia. Her Roman counterpart is Luna, who similarly personifies the moon in Roman mythology.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Gaea?", "opts": ["Damasippus", "Terra", "Horae", "Laocoön"], "ans": "Terra", "exp": "Gaea, the Greek primordial goddess of the earth, is known as Terra in Roman mythology. Terra is the Roman equivalent, representing the earth itself.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Hestia (24) (A brief hymn calling on Hestia as the...), Zeus was the opponent of Apollo.", "ans": false, "exp": "Incorrect. In the Homeric Hymn to Hestia (24), Hestia rejected the advances of Apollo, not Zeus. Zeus is Apollo's father, not his opponent.", "ref": "ch.5 p.115", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Artemis?", "ans": "Leto", "exp": "Artemis, the Greek goddess of the hunt and wilderness, is the daughter of Leto (Roman: Latona) and Zeus. Leto is a Titaness who gave birth to Artemis and her twin brother Apollo.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Tiresias?", "opts": ["Creusa", "Eueres", "Ageläus", "Ananke"], "ans": "Eueres", "exp": "Tiresias is the son of the shepherd Eueres and the nymph Chariclo, as recounted in various sources including Ovid's Metamorphoses.", "ref": "ch.17 p.432", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Calydonian Boar Hunt (King Oeneus offends Artemis, who sends...), Meleager was the killer of Aphares.", "ans": true, "exp": "Meleager killed Aphares in battle during the Calydonian Boar Hunt, as Aphares was one of the heroes who challenged Meleager's decision to award the boar's hide to Atalanta.", "ref": "ch.19 p.512", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Sleep?", "ans": "Somnus", "exp": "The Roman equivalent of the Greek god Hypnos (Sleep) is Somnus, as noted in Ovid's Metamorphoses and other Roman literature.", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Returns and the Odyssey (The overall narrative of Odysseus'...), Poseidon was the opponent of Athena.", "ans": true, "exp": "Poseidon was the opponent of Athena in the contest for the patronage of Athens, where Athena's gift of the olive tree was deemed more valuable than Poseidon's saltwater spring.", "ref": "ch.7 p.169", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Nereus?", "opts": ["Glaucon", "Charybdis", "Pontus", "Proserpina"], "ans": "Pontus", "exp": "Nereus was the eldest son of Pontus (the Sea) and Gaia (the Earth), making him a primordial sea god, as recorded in Hesiod's Theogony.", "ref": "ch.7 p.165", "enhanced": true}], [{"t": "mc", "cat": "Domain", "q": "Ereshkigal is the god/goddess of which domain?", "opts": ["underworld", "craft", "travelers", "invention"], "ans": "underworld", "exp": "Ereshkigal governs: underworld.", "ref": "ch.4"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Daughters of Anius (Anius, king of Delos, had three...), Anius was the parent of Spermo.", "ans": true, "exp": "Anius is the father of Spermo, as Spermo is one of his three daughters who could produce grain.", "ref": "ch.11 p.251", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hypnos?", "ans": "Somnus", "exp": "The Roman equivalent of Hypnos, the Greek god of sleep, is Somnus.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Demo?", "opts": ["lovely", "Olympian", "lookout for both gods and human beings", "scholar-priest"], "ans": "lovely", "exp": "Demo is known by the epithet 'lovely'.", "ref": "ch.14"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Titans (Gaia and Uranus produce twelve Titans:...), Uranus was the parent of Mnemosyne.", "ans": true, "exp": "Uranus and Gaia bore Mnemosyne, as she is one of the twelve Titans.", "ref": "ch.3 p.63", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Pleasure is the god/goddess of Underworld.", "ans": false, "exp": "In the myth of the Choice of Heracles, Pleasure is the personification of pleasure, not the Underworld. The Underworld is ruled by Hades.", "ref": "ch.9", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Boreas", "Notus", "Ishtar", "Ge-Themis", "Dionysus", "Cephisus"], "right": ["North Wind", "earth", "river", "south wind", "ecstasy", "love"], "ans": {"Boreas": "North Wind", "Notus": "south wind", "Ishtar": "love", "Ge-Themis": "earth", "Dionysus": "ecstasy", "Cephisus": "river"}, "exp": "Boreas is the North Wind, Notus the South Wind, Ishtar is a Mesopotamian goddess of love (not Greek, but included here), Ge-Themis is the earth (Gaia/Themis), Dionysus is the god of ecstasy, and Cephisus is a river god.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Cronus?", "opts": ["Aidos", "Ceto", "Uranus", "Nauplius"], "ans": "Uranus", "exp": "According to Hesiod's Theogony, Cronus is the son of Uranus (Sky) and Gaia (Earth). Uranus is the correct answer.", "ref": "ch.3 p.74", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Niobe?", "opts": ["Protagoras", "Orestes", "Cleverness", "Phoroneus"], "ans": "Phoroneus", "exp": "In Greek mythology, Niobe is the daughter of Phoroneus, a primordial king of Argos, and the nymph Teledice. Phoroneus is the correct answer.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Rhadamanthys?", "ans": "Rhadamanthus", "exp": "Rhadamanthys, a son of Zeus and Europa, is known as Rhadamanthus in Roman mythology. He is a judge of the dead in the Underworld.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Horus?", "opts": ["swift-footed", "righteous", "Lesser", "Harpocrates"], "ans": "Harpocrates", "exp": "Horus is known by the epithet 'Harpocrates'.", "ref": "ch.16"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Father of the gods?", "opts": ["Jupiter", "Neptune", "Pluto", "Mars"], "ans": "Jupiter", "exp": "The Greek father of the gods is Zeus; his Roman equivalent is Jupiter.", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Vulcan is the god/goddess of prophecy.", "ans": false, "exp": "No, Vulcan is the Roman god of fire and craftsmanship, not prophecy. The Roman god of prophecy is Apollo.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Hades", "Atropos", "Pallas Athena", "Phoebus Apollo", "Hephaestus", "Sleep"], "right": ["craftsmanship", "wisdom", "Underworld", "cutting thread of life", "sleep", "Music"], "ans": {"Hades": "Underworld", "Atropos": "cutting thread of life", "Pallas Athena": "wisdom", "Phoebus Apollo": "Music", "Hephaestus": "craftsmanship", "Sleep": "sleep"}, "exp": "Each god/goddess governs specific domains: Hades rules the Underworld, Atropos cuts the thread of life, Pallas Athena is the goddess of wisdom, Phoebus Apollo is the god of music, Hephaestus is the god of craftsmanship, and Sleep (Hypnos) is the personification of sleep.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Polynices?", "ans": "Jocasta", "exp": "Polynices is the son of Oedipus and Jocasta, making Jocasta his mother.", "ref": "ch.17 p.431", "enhanced": true}], [{"t": "mc", "cat": "Domain", "q": "Cybele is the god/goddess of which domain?", "opts": ["time", "earth", "poverty", "need"], "ans": "earth", "exp": "Cybele governs: earth, fertility, motherhood, nature.", "ref": "ch.3"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Deïphobus?", "ans": "Deiphobus", "exp": "The Roman name of Deïphobus is Deiphobus, as the Romans often adopted Greek names directly.", "ref": "ch.15", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aloadae?", "ans": "Poseidon", "exp": "The Aloadae were said by Iphimedeia to be sons of Poseidon, the god of earthquakes, horses, and the sea.", "ref": "ch.15 p.382", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Plutus is the god/goddess of which domain?", "opts": ["winds", "wealth", "thunder", "passion"], "ans": "wealth", "exp": "Plutus governs: wealth.", "ref": "ch.14"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Night?", "opts": ["Nyx", "Aurora", "Demodocus", "Alexander"], "ans": "Nyx", "exp": "The Roman equivalent of the Greek Night (Nyx) is also Nyx, as the Romans adopted the Greek name.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Typhaon (Angry at Zeus for giving birth to...), Hera was the child of Zeus.", "ans": false, "exp": "Incorrect. In the myth of Birth of Typhaon, Hera was the wife of Zeus, not his child. Athena was born from Zeus's head, and Hera, angry at Zeus for giving birth to Athena alone, prayed to Earth and the Titans for a child stronger than Zeus, resulting in the birth of Typhaon.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Zeus (Cronus swallowed his children to...), Cronus was the parent of Poseidon.", "ans": true, "exp": "Correct. Cronus, fearing a prophecy that he would be overthrown by his son, swallowed each of his children at birth, including Poseidon. Thus, Cronus is indeed the parent of Poseidon.", "ref": "ch.3 p.74", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Agave?", "ans": "Cadmus", "exp": "Agave is the daughter of Cadmus, the founder and first king of Thebes. She is one of the daughters of Cadmus and Harmonia, and the mother of Pentheus.", "ref": "ch.13 p.307", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Pleasure?", "opts": ["Somnus", "Nyx", "Voluptas", "Alcestis"], "ans": "Voluptas", "exp": "Pleasure is the Greek name; the Roman equivalent is Voluptas. In the myth of the Choice of Heracles, Heracles chooses between Pleasure (Voluptas) and Virtue.", "ref": "ch.9", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Judgment of Paris (At the wedding of Peleus and Thetis,...), Athena was the opponent of Paris.", "ans": true, "exp": "Correct. In the Judgment of Paris, Paris chose Aphrodite over Hera and Athena, leading to Athena's hostility towards the Trojans. Thus, Athena was an opponent of Paris.", "ref": "ch.19 p.469", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Arethusa?", "opts": ["son of Ixion", "Alcides", "three virgins", "nymph"], "ans": "nymph", "exp": "Arethusa is known by the epithet 'nymph'.", "ref": "ch.10"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Charis", "Eirene", "Uranus", "Himeros", "Proserpine", "Thoth"], "right": ["peace", "grace", "Underworld", "magic", "desire", "sky"], "ans": {"Charis": "grace", "Eirene": "peace", "Uranus": "sky", "Himeros": "desire", "Proserpine": "Underworld", "Thoth": "magic"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Charis (grace), Eirene (peace), Uranus (sky), Himeros (desire), Proserpine (Underworld), Thoth (magic).", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Ariadne on Naxos (Theseus deserts Ariadne on the island...), Artemis was the lover of Ariadne.", "ans": false, "exp": "Incorrect. In the myth of Ariadne on Naxos, Dionysus loved Ariadne and placed her crown in the sky. Artemis is not her lover; in some versions, Artemis kills Ariadne.", "ref": "ch.13 p.325", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Ladon?", "opts": ["Phorcys", "Clio", "Agamemnon", "Echemus"], "ans": "Phorcys", "exp": "Ladon is the son of Phorcys and Ceto, both sea deities. Phorcys is the correct parent.", "ref": "ch.7 p.173", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Muses", "Themis", "Nike", "Odysseus", "Cybele", "Persephone"], "right": ["Proserpina", "Musae", "Magna Mater", "Justitia", "Ulysses", "Victoria"], "ans": {"Muses": "Musae", "Themis": "Justitia", "Nike": "Victoria", "Odysseus": "Ulysses", "Cybele": "Magna Mater", "Persephone": "Proserpina"}, "exp": "Standard Greek and Roman name equivalences: Muses (Musae), Themis (Justitia), Nike (Victoria), Odysseus (Ulysses), Cybele (Magna Mater), Persephone (Proserpina).", "ref": "", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Scamander is the god/goddess of death.", "ans": false, "exp": "Scamander is a river-god, not a deity of death. He fought Achilles after the hero filled his waters with Trojan corpses.", "ref": "ch.5", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Heracles?", "ans": "Hercules", "exp": "Heracles is the Greek name; his Roman counterpart is Hercules, known for his twelve labors.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Zephyrus is the god/goddess of which domain?", "opts": ["literature", "virtue", "west wind", "messenger of the gods"], "ans": "west wind", "exp": "Zephyrus governs: west wind.", "ref": "ch.9"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Argus?", "opts": ["dark-clouded son of Cronus", "Panoptes", "Great", "noble wife of Nestor"], "ans": "Panoptes", "exp": "Argus is known by the epithet 'Panoptes'.", "ref": "ch.4"}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Eros?", "opts": ["Resourcefulness", "Terpsichore", "Pelias", "Laertes"], "ans": "Resourcefulness", "exp": "In Hesiod's Theogony, Eros is one of the primordial deities, born from Chaos, and is often associated with Resourcefulness (Poros) in some traditions.", "ref": "ch.9 p.213", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Lachesis is the god/goddess of which domain?", "opts": ["measuring thread of life", "sleep", "holding up the sky", "vine"], "ans": "measuring thread of life", "exp": "Lachesis governs: measuring thread of life, past.", "ref": "ch.5"}, {"t": "tf", "cat": "Divine Domains", "q": "Night is the god/goddess of night.", "ans": true, "exp": "In Hesiod's Theogony, Night (Nyx) is the primordial goddess of night, born from Chaos.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Persuasion", "Sangarios", "Ares", "Ishtar", "Jupiter", "Symaethus"], "right": ["king of gods", "war", "river", "love", "persuasion", "river"], "ans": {"Persuasion": "persuasion", "Sangarios": "river", "Ares": "war", "Ishtar": "love", "Jupiter": "king of gods", "Symaethus": "river"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Persuasion is the personification of persuasion, Sangarios is a river god, Ares is the god of war, Ishtar is the Mesopotamian goddess of love (included here as a foreign deity), Jupiter is the Roman king of gods, and Symaethus is a river god.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Cephalus?", "ans": "Hermes", "exp": "Cephalus is the son of Hermes and Herse. Hermes is the messenger god, and Herse is a daughter of Cecrops.", "ref": "ch.23 p.585", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Boreas is the god/goddess of North Wind.", "ans": true, "exp": "Boreas is the god of the north wind, as depicted in the myth of his abduction of Oreithyia.", "ref": "ch.1", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Odyssey (The epic poem by Homer recounting the...), who did Polyphemus fight against?", "opts": ["Pygmalion", "Pandion", "Odysseus", "Chrysaor"], "ans": "Odysseus", "exp": "Odysseus blinded Polyphemus, the Cyclops, during his journey home.", "ref": "ch.48", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Artemis", "Orthus", "Dioscuri", "Hera", "Demeter", "Ares"], "right": ["Juno", "Ceres", "Mars", "Diana", "Orthrus", "Castor and Pollux"], "ans": {"Artemis": "Diana", "Orthus": "Orthrus", "Dioscuri": "Castor and Pollux", "Hera": "Juno", "Demeter": "Ceres", "Ares": "Mars"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Artemis = Diana, Orthus = Orthrus, Dioscuri = Castor and Pollux, Hera = Juno, Demeter = Ceres, Ares = Mars.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aretus?", "ans": "Nestor", "exp": "Aretus is a son of Nestor, the wise king of Pylos.", "ref": "ch.6 p.158", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Hymn to Hermes (A Homeric hymn that tells the story of...), Maia was the parent of Zeus.", "ans": false, "exp": "Incorrect. In the myth of The Hymn to Hermes, Zeus is the father of Hermes, but Maia is Hermes' mother. Zeus's parent is Cronus, not Maia.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Minos?", "opts": ["Phylacus", "Perses", "Cephalus", "Zeus"], "ans": "Zeus", "exp": "Minos is the splendid son of Zeus and Europa, king of Crete.", "ref": "ch.15 p.?", "enhanced": true}], [{"t": "mc", "cat": "Domain", "q": "Terpsichore is the god/goddess of which domain?", "opts": ["choral dancing", "river Alpheus", "beekeeping", "marriage"], "ans": "choral dancing", "exp": "Terpsichore governs: choral dancing.", "ref": "ch.5"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Teucer?", "ans": "Telamon", "exp": "Teucer was the son of Telamon, king of Salamis, and Hesione, daughter of Laomedon. He was a half-brother of Ajax and a renowned archer in the Trojan War.", "ref": "ch.19 p.474", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Scylla?", "opts": ["Automedon", "Hecate", "Cytisorus", "Seth"], "ans": "Hecate", "exp": "Scylla was the daughter of Phorcys and Hecate, according to some sources. Hecate is the goddess of witchcraft, crossroads, and the underworld. The other options are not related to Scylla's parentage.", "ref": "ch.7 p.169", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Athena", "Cybele", "Dioscuri", "Nike", "Graces", "Sleep"], "right": ["Gratiae", "Somnus", "Castor and Pollux", "Magna Mater", "Victoria", "Minerva"], "ans": {"Athena": "Minerva", "Cybele": "Magna Mater", "Dioscuri": "Castor and Pollux", "Nike": "Victoria", "Graces": "Gratiae", "Sleep": "Somnus"}, "exp": "These are standard Greek and Roman name equivalences: Athena = Minerva, Cybele = Magna Mater, Dioscuri = Castor and Pollux, Nike = Victoria, Graces = Gratiae, Sleep = Somnus.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), Leto was the parent of Artemis.", "ans": false, "exp": "False. In the Homeric Hymn to Apollo, Artemis is the daughter of Zeus and Leto, and Apollo is her twin brother. The statement incorrectly omits Zeus as the father.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Iasion?", "ans": "Electra", "exp": "Iasion was the son of the Pleiad Electra and Zeus, making him a descendant of the Titan Atlas.", "ref": "ch.19 p.473", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Dryads is the god/goddess of beauty.", "ans": false, "exp": "No, Dryads are tree nymphs, not goddesses of beauty. In the myth of Narcissus and Echo, Dryads are among the nymphs who mourned for Narcissus.", "ref": "ch.13", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Anticlea?", "opts": ["Alcestis", "Antigone", "Salmoneus", "Autolycus"], "ans": "Autolycus", "exp": "Anticlea, the mother of Odysseus, was the daughter of Autolycus, the master thief and son of Hermes.", "ref": "ch.15 p.?", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Deïphobus?", "opts": ["Deiphobus", "Priam", "Dione", "Cerberus"], "ans": "Deiphobus", "exp": "Deïphobus is the Greek name; the Roman equivalent is Deiphobus. In Roman mythology, Deiphobus was a son of Priam and Hecuba, and the husband of Helen after Paris's death.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Tritonian Pallas?", "opts": ["Milanion", "Minerva", "Orthrus", "Tmolus"], "ans": "Minerva", "exp": "Tritonian Pallas is the Greek name; the Roman equivalent is Minerva. Minerva is the goddess of wisdom, arts, and warfare, corresponding to the Greek Athena.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Sleep?", "opts": ["Hypnos", "Zephyrus", "Hebe", "Somnus"], "ans": "Somnus", "exp": "Sleep is the Greek name; the Roman equivalent is Somnus. Hypnos is the Greek god of sleep, making it a plausible distractor.", "ref": "ch.19", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Ajax the Greater?", "ans": "Telamon", "exp": "Ajax the Greater is the son of Telamon, king of Salamis. He was a prominent Greek hero in the Trojan War, known for his strength and courage.", "ref": "ch.19 p.479", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Dionysus (1) (A hymn describing the birth of...), Hera was the child of Semele.", "ans": false, "exp": "Incorrect. In the Homeric Hymn to Dionysus (1), Dionysus is the son of Semele and Zeus. Hera is Zeus's wife, not the child of Semele.", "ref": "ch.6 p.?", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Dionysus and the Pirates (Pirates abducted Dionysus, mistaking...), Zeus was the parent of Dionysus.", "ans": false, "exp": "Incorrect. In the myth of Dionysus and the Pirates, Zeus and Semele are both parents of Dionysus. The statement is false because it omits Semele.", "ref": "ch.5 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Aphrodite", "Lachesis", "Pallas Athena", "Leucothea", "Necessity", "Phoebus Apollo"], "right": ["measuring thread of life", "Music", "sea", "beauty", "wisdom", "necessity"], "ans": {"Aphrodite": "beauty", "Lachesis": "measuring thread of life", "Pallas Athena": "wisdom", "Leucothea": "sea", "Necessity": "necessity", "Phoebus Apollo": "Music"}, "exp": "Aphrodite is the goddess of beauty and love. Lachesis, one of the Fates, measures the thread of life. Pallas Athena is the goddess of wisdom. Leucothea is a sea goddess. Necessity (Ananke) personifies necessity. Phoebus Apollo is the god of music and arts.", "ref": "", "enhanced": true}], [{"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Death of Heracles (Deïanira, jealous of Iole, sends...), Heracles was the parent of Hyllus.", "ans": true, "exp": "Hyllus is the son of Heracles and Deïanira, making him a central figure in the lineage of the Heracleidae.", "ref": "ch.22 p.570", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Ares?", "opts": ["Gratiae", "Mars", "Ixion", "Protagoras"], "ans": "Mars", "exp": "Ares is the Greek god of war; his Roman counterpart is Mars, who was also an agricultural deity.", "ref": "ch.2", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Pleasure?", "opts": ["Rhamnusia", "Voluptas", "Creusa", "Marsyas"], "ans": "Voluptas", "exp": "Pleasure is personified as a goddess in Greek myth; her Roman equivalent is Voluptas, representing sensual delight.", "ref": "ch.9", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Gaea?", "ans": "Terra", "exp": "The Roman equivalent of Gaea is Terra, the personification of the Earth.", "ref": "ch.3", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Helenus?", "ans": "Priam", "exp": "Helenus was a son of King Priam of Troy and Hecuba, known as a prophet.", "ref": "ch.19 p.485", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Musaeus is the god/goddess of justice.", "ans": false, "exp": "Musaeus is not a god of justice; he is a poet and prophet associated with poetry and music, often considered the son of Orpheus.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Clio is the god/goddess of which domain?", "opts": ["chastity", "history", "cutting thread of life", "kingship"], "ans": "history", "exp": "Clio governs: history.", "ref": "ch.5"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Eumolpus?", "opts": ["noble", "leading suitor", "helmsman", "watcher at the door"], "ans": "noble", "exp": "Eumolpus is known by the epithet 'noble'.", "ref": "ch.14"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Birth of Titans (Gaia and Uranus produce twelve Titans:...), who was Gaia married to?", "opts": ["Philyra", "Thrasymedes", "Anticlea", "Uranus"], "ans": "Uranus", "exp": "Gaia, the personification of Earth, was married to Uranus, the sky god, and together they produced the Titans.", "ref": "ch.63", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Harmonia", "Ea", "Priapus", "Alpheus", "Horae", "Venus"], "right": ["river Alpheus", "earth", "fertility", "beauty", "harmony", "seasons"], "ans": {"Harmonia": "harmony", "Ea": "earth", "Priapus": "fertility", "Alpheus": "river Alpheus", "Horae": "seasons", "Venus": "beauty"}, "exp": "Harmonia is the goddess of harmony, Ea (likely a variant of Gaia) is earth, Priapus is fertility, Alpheus is a river god, Horae are the seasons, and Venus (Aphrodite) is beauty.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Fates is the god/goddess of keen sight.", "ans": false, "exp": "The Fates (Moirai) are the goddesses of destiny and fate, not keen sight. Keen sight is associated with other figures like Lynceus or Argus Panoptes.", "ref": "ch.5", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Electra (Euripides' version of the matricide,...), Pylades was the spouse of Electra.", "ans": true, "exp": "In Euripides' version of the Electra myth, Pylades is indeed the husband of Electra, as confirmed by the relationship data: Pylades --[spouse_of]--> Electra.", "ref": "ch.18 p.445", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Ge-Themis is the god/goddess of which domain?", "opts": ["vegetation", "fate", "persuasion", "earth"], "ans": "earth", "exp": "Ge-Themis governs: earth, prophecy.", "ref": "ch.11"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Leto?", "ans": "Latona", "exp": "The Roman equivalent of the Greek goddess Leto is Latona, as per standard Roman mythology.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Plutus", "Symaethus", "Artemis", "Phoebus Apollo", "Erato", "Thoth"], "right": ["archery", "wealth", "magic", "Music", "river", "love poetry"], "ans": {"Plutus": "wealth", "Symaethus": "river", "Artemis": "archery", "Phoebus Apollo": "Music", "Erato": "love poetry", "Thoth": "magic"}, "exp": "Plutus is the god of wealth; Symaethus is a river god; Artemis is the goddess of archery; Phoebus Apollo is the god of music; Erato is the muse of love poetry; Thoth is the Egyptian god of magic.", "ref": "", "enhanced": true}], [{"t": "sa", "cat": "Parentage", "q": "Who is the parent of Doris?", "ans": "Tethys", "exp": "Doris was an Oceanid, one of the 3000 daughters of Oceanus and Tethys, making her a sea nymph.", "ref": "ch.7 p.165", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Calliope is the god/goddess of justice.", "ans": false, "exp": "No, Calliope is the Muse of epic poetry, not justice. The goddess of justice is Dike or Themis.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Diomedes?", "opts": ["Erichthonius", "Diomedes", "Tydeus", "Iphimedeia"], "ans": "Tydeus", "exp": "Diomedes, a Greek hero of the Trojan War, is the son of Tydeus, one of the Seven Against Thebes.", "ref": "ch.19 p.?", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Abduction of Ganymede (Zeus, in the form of a whirlwind or...), Tros was the parent of Ganymede.", "ans": true, "exp": "Tros, the king of Dardania, is indeed the father of Ganymede, who was abducted by Zeus to be cupbearer.", "ref": "ch.9 p.206", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Gilgamesh?", "opts": ["great mother", "one-third human", "Artemis who delights in her arrows", "noble wife of Nestor"], "ans": "one-third human", "exp": "Gilgamesh is known by the epithet 'one-third human'.", "ref": "ch.4"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Peleus and Thetis (Thetis was destined to bear a son...), who opposed Zeus?", "opts": ["Dryads", "Polydeuces", "Cleisidice", "Prometheus"], "ans": "Prometheus", "exp": "Prometheus, the Titan known for his craft and creation of mortals, opposed Zeus by stealing fire for humanity. In the myth of Peleus and Thetis, Prometheus warned Zeus not to marry Thetis because her son would be mightier than his father, thus influencing Zeus to avoid her.", "ref": "ch.165", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Theseus, Phaedra, and Hippolytus (Theseus marries Phaedra, who falls in...), who is the parent of Theseus?", "opts": ["Gorgon", "Aeneas", "Tiresias", "Poseidon"], "ans": "Poseidon", "exp": "Poseidon, the god of the sea, earthquakes, and horses, is the father of Theseus. Theseus was born to Aethra, who was visited by Poseidon on the same night as her mortal husband Aegeus, making Theseus the son of both a mortal and a god.", "ref": "ch.597", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Leto?", "ans": "Latona", "exp": "The Roman equivalent of Leto is Latona. Leto, a Titaness, is the mother of Apollo and Artemis by Zeus. In Roman mythology, she is known as Latona, and her worship was associated with the same myths of persecution by Hera (Juno) and eventual refuge on Delos.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Demeter is the god/goddess of vengeance.", "ans": false, "exp": "No, Demeter is the goddess of agriculture, fertility, harvest, and the Eleusinian Mysteries, not vengeance. She is best known for her role in the myth of Persephone's abduction, where her grief causes the earth to become barren.", "ref": "ch.1", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Actaeon?", "ans": "Autonoë", "exp": "Actaeon is the son of Autonoë, daughter of Cadmus, and Aristaeus. Autonoë was one of the daughters of Cadmus, the founder of Thebes. Actaeon was a famous hunter who was transformed into a stag and killed by his own hounds after accidentally seeing Artemis bathing.", "ref": "ch.13 p.308", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Cybele is the god/goddess of which domain?", "opts": ["Vengeance", "earth", "nature", "oracle"], "ans": "earth", "exp": "Cybele governs: earth, fertility, motherhood, nature.", "ref": "ch.3"}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Helius", "Themis", "Muses", "Sleep", "Himeros", "Persephone"], "right": ["Proserpina", "Sol", "Musae", "Desire", "Somnus", "Justitia"], "ans": {"Helius": "Sol", "Themis": "Justitia", "Muses": "Musae", "Sleep": "Somnus", "Himeros": "Desire", "Persephone": "Proserpina"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of The Murder of Agamemnon (Upon returning from Troy with...), who was Agamemnon married to?", "opts": ["Sangarios", "Melicertes", "Clytemnestra", "Ajax the Locrian"], "ans": "Clytemnestra", "exp": "Clytemnestra is the wife of Agamemnon.", "ref": "ch.441", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Theseus, Phaedra, and Hippolytus (Theseus marries Phaedra, who falls in...), Theseus was the parent of Hippolytus.", "ans": true, "exp": "Theseus is the father of Hippolytus.", "ref": "ch.10 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Cypris", "Eunomia", "Persephone", "Dionysus", "Hades", "Clotho"], "right": ["Underworld", "present", "love", "ecstasy", "good order", "Underworld"], "ans": {"Cypris": "love", "Eunomia": "good order", "Persephone": "Underworld", "Dionysus": "ecstasy", "Hades": "Underworld", "Clotho": "present"}, "exp": "Each god/goddess governs specific domains in Greek mythology.", "ref": "", "enhanced": true}], [{"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Fates", "Leto", "Dionysus", "Ge", "Hephaestus", "Day"], "right": ["Hemera", "Bacchus", "Terra", "Latona", "Vulcan", "Parcae"], "ans": {"Fates": "Parcae", "Leto": "Latona", "Dionysus": "Bacchus", "Ge": "Terra", "Hephaestus": "Vulcan", "Day": "Hemera"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Fates (Parcae), Leto (Latona), Dionysus (Bacchus), Ge (Terra), Hephaestus (Vulcan), Day (Hemera).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Apollo and Coronis (Apollo loves Coronis, who is pregnant...), who is the parent of Asclepius?", "opts": ["Electra", "Apollo", "Agave", "Sosia"], "ans": "Apollo", "exp": "In the myth of Apollo and Coronis, Apollo is the father of Asclepius. He saved his son from the funeral pyre after killing Coronis.", "ref": "ch.261", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Isandrus?", "ans": "Bellerophon", "exp": "Isandrus was the son of Bellerophon, as recorded in Greek mythology.", "ref": "ch.21 p.551", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Aeolus is the god/goddess of winds.", "ans": true, "exp": "Aeolus is the god of winds, governing all winds in Greek mythology.", "ref": "ch.4", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Ereshkigal", "Seasons", "Enipeus", "Harmonia", "Dionysus", "Zephyr"], "right": ["harmony", "seasons", "ecstasy", "underworld", "west wind", "river"], "ans": {"Ereshkigal": "underworld", "Seasons": "seasons", "Enipeus": "river", "Harmonia": "harmony", "Dionysus": "ecstasy", "Zephyr": "west wind"}, "exp": "Each god/goddess governs specific domains: Ereshkigal (underworld), Seasons (seasons), Enipeus (river), Harmonia (harmony), Dionysus (ecstasy), Zephyr (west wind).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Dionysus?", "opts": ["Bacchus", "Gratiae", "Hesione", "Deianira"], "ans": "Bacchus", "exp": "Dionysus is the Greek name; the Roman equivalent is Bacchus.", "ref": "ch.2"}, {"t": "tf", "cat": "Divine Domains", "q": "Poros is the god/goddess of Poetry.", "ans": false, "exp": "No, Poros governs contrivance, not Poetry. Poros is the personification of resourcefulness or contrivance.", "ref": "ch.9", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Glaucus?", "ans": "Minos", "exp": "Glaucus was a son of Minos and Pasiphaë. He is not to be confused with the sea god Glaucus.", "ref": "ch.23 p.603", "enhanced": true}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Dionysus and Ariadne (Dionysus married Ariadne after she was...), who was Dionysus married to?", "opts": ["Ariadne", "Semele", "Persephone", "Aphrodite"], "ans": "Ariadne", "exp": "Dionysus married Ariadne after she was deserted by Theseus on Naxos.", "ref": "ch.321", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Day is the god/goddess of which domain?", "opts": ["craft", "day", "sudden death of young women", "passion"], "ans": "day", "exp": "Day governs: day.", "ref": "ch.3"}, {"t": "tf", "cat": "Divine Domains", "q": "Rhadamanthys is the god/goddess of judge of the dead.", "ans": true, "exp": "Rhadamanthys is one of the judges of the dead in the underworld, alongside Minos and Aeacus. He was a son of Zeus and Europa, known for his justice.", "ref": "ch.15", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Muses is the god/goddess of which domain?", "opts": ["king of gods", "contrivance", "south wind", "arts"], "ans": "arts", "exp": "Muses governs: arts, dance, inspiration, literature, music, poetry, song.", "ref": "ch.3"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Agenor?", "ans": "Belus", "exp": "Agenor is the son of Belus, making Belus his parent. Agenor was a king of Phoenicia and father of Cadmus and Europa.", "ref": "ch.21 p.544", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Antaeus?", "opts": ["Dictynna", "king of Calydon", "giant", "illustrious poet"], "ans": "giant", "exp": "Antaeus is known by the epithet 'giant'.", "ref": "ch.7"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Mares of Diomedes (Heracles captured the man-eating mares...), Thanatos was the opponent of Ares.", "ans": false, "exp": "Incorrect. In the myth of The Mares of Diomedes, Heracles captured the man-eating mares of Diomedes, king of Thrace. Diomedes was the opponent, not Thanatos. Thanatos is the personification of death, not involved in this labor.", "ref": "ch.5 p.?", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Eris is the god/goddess of discord.", "ans": true, "exp": "Eris is indeed the goddess of discord, as she personifies strife and conflict.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Tiresias?", "opts": ["Lyssa", "Haemon", "Pluto", "Eueres"], "ans": "Eueres", "exp": "Tiresias is the son of Eueres, a shepherd, and the nymph Chariclo.", "ref": "ch.17 p.432", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Deïphobus?", "ans": "Deiphobus", "exp": "Deïphobus is a Trojan prince, son of Priam and Hecuba; his Roman name remains Deiphobus, as he is not commonly given a distinct Roman equivalent.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Pythia is the god/goddess of justice.", "ans": false, "exp": "Pythia is the priestess of Apollo at Delphi who delivers prophecies, not a goddess of justice; that domain belongs to Themis or Dike.", "ref": "ch.11", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Eirene is the god/goddess of which domain?", "opts": ["messenger", "warfare", "king of gods", "peace"], "ans": "peace", "exp": "Eirene governs: peace.", "ref": "ch.5"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Nergal", "Cypris", "Hebe", "Pontus", "Hermes", "Aglaea"], "right": ["commerce", "grace", "love", "underworld", "sea", "youth"], "ans": {"Nergal": "underworld", "Cypris": "love", "Hebe": "youth", "Pontus": "sea", "Hermes": "commerce", "Aglaea": "grace"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Nergal is a Mesopotamian god of the underworld, not Greek; the intended Greek god is likely Hades. Cypris is an epithet of Aphrodite, goddess of love. Hebe is the goddess of youth. Pontus is the primordial god of the sea. Hermes is the god of commerce. Aglaea is one of the Charites (Graces), goddess of grace.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Eris is the god/goddess of which domain?", "opts": ["discord", "prophecy", "protectors of seafarers", "plague"], "ans": "discord", "exp": "Eris governs: discord.", "ref": "ch.19"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Ea", "Cypris", "Aphrodite", "Selene", "Zephyrus", "Death"], "right": ["west wind", "earth", "love", "death", "moon", "beauty"], "ans": {"Ea": "earth", "Cypris": "love", "Aphrodite": "beauty", "Selene": "moon", "Zephyrus": "west wind", "Death": "death"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Ea is a Mesopotamian god of earth and water, not Greek; the intended Greek god is likely Gaia. Cypris is an epithet of Aphrodite, goddess of love. Aphrodite is the goddess of beauty. Selene is the goddess of the moon. Zephyrus is the god of the west wind. Death (Thanatos) is the personification of death.", "ref": "", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Judgment of Paris (At the wedding of Peleus and Thetis,...), Hermes was the spouse of Zeus.", "ans": false, "exp": "Incorrect. In the myth of The Judgment of Paris, Hera is the wife of Zeus, not Hermes. Hermes is the messenger god and son of Zeus.", "ref": "ch.9 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Horae is the god/goddess of which domain?", "opts": ["seasons", "lyric poetry", "sea", "punishment"], "ans": "seasons", "exp": "Horae governs: seasons, time.", "ref": "ch.9"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Death of Heracles (Deïanira, jealous of Iole, sends...), who was Hera married to?", "opts": ["Hera", "Zeus", "Poseidon", "Hades"], "ans": "Zeus", "exp": "Hera is the wife of Zeus.", "ref": "ch.570", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Returns of the Greek Leaders (The returns of Greek leaders from Troy,...), Orestes was the killer of Aegisthus.", "ans": true, "exp": "Orestes kills Aegisthus.", "ref": "ch.18 p.443", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Electra?", "ans": "Agamemnon", "exp": "Electra is the daughter of Agamemnon.", "ref": "ch.18 p.443", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Fates is the god/goddess of which domain?", "opts": ["youth", "destiny", "wealth", "grape"], "ans": "destiny", "exp": "Fates governs: destiny, fate.", "ref": "ch.5"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Graces?", "ans": "Gratiae", "exp": "The Roman equivalent of Graces is Gratiae.", "ref": "ch.4", "enhanced": true}], [{"t": "tf", "cat": "Divine Domains", "q": "Hecate is the god/goddess of underworld.", "ans": true, "exp": "Hecate is the goddess of the underworld, but also governs black magic, crossroads, fertility, ghosts, magic, the moon, and witchcraft. Her association with the underworld is one of her many domains.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Troïlus?", "opts": ["Troilus", "Achilles", "Hector", "Paris"], "ans": "Troilus", "exp": "Troïlus is the Greek name for the Trojan prince; his Roman equivalent is Troilus, as both names are essentially the same in Latin.", "ref": "ch.19", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Muses is the god/goddess of which domain?", "opts": ["spring", "arts", "kingship", "fertility"], "ans": "arts", "exp": "Muses governs: arts, dance, inspiration, literature, music, poetry, song.", "ref": "ch.3"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aethra?", "ans": "Pittheus", "exp": "Aethra is the daughter of Pittheus, king of Troezen. She is best known as the mother of the hero Theseus.", "ref": "ch.23 p.590", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Nike", "Persephone", "Hermes", "Hecuba", "Fates", "Heracles"], "right": ["Proserpina", "Victoria", "Hercules", "Hekabe", "Parcae", "Mercury"], "ans": {"Nike": "Victoria", "Persephone": "Proserpina", "Hermes": "Mercury", "Hecuba": "Hekabe", "Fates": "Parcae", "Heracles": "Hercules"}, "exp": "These are the standard Greek and Roman name equivalences from the textbook: Nike (Victoria), Persephone (Proserpina), Hermes (Mercury), Hecuba (Hekabe), Fates (Parcae), Heracles (Hercules).", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Orpheus?", "opts": ["gentle", "Apollo's son", "Wine Girl", "lord and host of many"], "ans": "Apollo's son", "exp": "Orpheus is known by the epithet 'Apollo's son'.", "ref": "ch.3"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Atargatis?", "ans": "Dea Syria", "exp": "The Roman equivalent of Atargatis is Dea Syria, meaning 'Syrian Goddess', a title used by the Romans for this Syrian deity.", "ref": "ch.16", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Medus?", "ans": "Aegeus", "exp": "Medus is the son of Aegeus, king of Athens, and Medea. He is sometimes considered the eponymous founder of the Medes.", "ref": "ch.23 p.592", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Kore is the god/goddess of Poetry.", "ans": false, "exp": "Kore, also known as Persephone, is the goddess of the underworld and spring, not poetry. Poetry is associated with the Muses.", "ref": "ch.14", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Returns and the Odyssey (The overall narrative of Odysseus'...), Hermes was the lover of Aphrodite.", "ans": true, "exp": "In some myths, Hermes and Aphrodite had a relationship and parented Hermaphroditus, a being with both male and female traits.", "ref": "ch.9 p.221", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Asclepius?", "opts": ["kindly healer", "mightiest of the Achaeans", "wise counselor", "gentle"], "ans": "kindly healer", "exp": "Asclepius is known by the epithet 'kindly healer'.", "ref": "ch.5"}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Alcestis?", "opts": ["Hyperion", "heroic extrovert", "Eumenides", "devoted wife"], "ans": "devoted wife", "exp": "Alcestis is known by the epithet 'devoted wife'.", "ref": "ch.7"}, {"t": "mc", "cat": "Myth Details", "q": "In the myth of Trojan War (Legendary war between Greeks and...), who was Priam married to?", "opts": ["Bellerophon", "Agenor", "Athena", "Hecuba"], "ans": "Hecuba", "exp": "Priam and Hecuba are a couple in the Iliad.", "ref": "ch.46", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Periclymenus is the god/goddess of west wind.", "ans": false, "exp": "No, Periclymenus governs shape-shifting, not west wind.", "ref": "ch.22", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Cybele", "Aphrodite", "Charis", "Deïphobus", "Ares", "Helen"], "right": ["Mars", "Deiphobus", "Helena", "Venus", "Magna Mater", "Grace"], "ans": {"Cybele": "Magna Mater", "Aphrodite": "Venus", "Charis": "Grace", "Deïphobus": "Deiphobus", "Ares": "Mars", "Helen": "Helena"}, "exp": "Standard Greek and Roman name equivalences from the textbook.", "ref": "", "enhanced": true}], [{"t": "mc", "cat": "Parentage", "q": "Who is the parent of Lernaean Hydra?", "opts": ["Dolichus", "Echidna", "Caeneus", "Ilus"], "ans": "Echidna", "exp": "Lernaean Hydra is offspring of Echidna and Typhon, as recounted in the myth of Heracles and the Hydra.", "ref": "ch.7 p.173", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Birth of Artemis (Artemis is born on Delos (or Ortygia)...), Artemis was the parent of Apollo.", "ans": false, "exp": "Incorrect. In the myth of Birth of Artemis, Artemis is the daughter of Leto and Zeus, not the parent of Apollo. Apollo is her twin brother.", "ref": "ch.3 p.?", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Telemachus?", "opts": ["herald", "daughter of Atlas", "Paean", "great-hearted"], "ans": "great-hearted", "exp": "Telemachus is known by the epithet 'great-hearted'.", "ref": "ch.2"}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Mnemosyne?", "opts": ["Moneta", "Pyrrhus", "Horae", "Troilus"], "ans": "Moneta", "exp": "Mnemosyne is the Greek name; the Roman equivalent is Moneta.", "ref": "ch.3", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hestia", "Himeros", "Neoptolemus", "Cybele", "Hecuba", "Graces"], "right": ["Pyrrhus", "Desire", "Vesta", "Magna Mater", "Hekabe", "Gratiae"], "ans": {"Hestia": "Vesta", "Himeros": "Desire", "Neoptolemus": "Pyrrhus", "Cybele": "Magna Mater", "Hecuba": "Hekabe", "Graces": "Gratiae"}, "exp": "Standard Greek and Roman name equivalences from the textbook: Hestia = Vesta, Himeros = Desire, Neoptolemus = Pyrrhus, Cybele = Magna Mater, Hecuba = Hekabe, Graces = Gratiae.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Odysseus?", "ans": "Laertes", "exp": "Laertes, king of Ithaca, is the father of Odysseus. His wife Anticleia, daughter of Autolycus, is Odysseus's mother.", "ref": "ch.20 p.527", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of Maia?", "opts": ["seer", "Typhaon", "wise man", "daughter of Atlas"], "ans": "daughter of Atlas", "exp": "Maia is known by the epithet 'daughter of Atlas'.", "ref": "ch.5"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Tyro?", "ans": "Salmoneus", "exp": "Tyro was the daughter of Salmoneus, king of Elis, and Alcidice. She later became the mother of Neleus and Pelias by Poseidon.", "ref": "ch.7 p.167", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hypnos?", "ans": "Somnus", "exp": "Hypnos, the personification of sleep, is known as Somnus in Roman mythology. His twin brother is Thanatos (Death).", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Titanomachy (Zeus and his siblings, freed from...), Cronus was the parent of Iapetus.", "ans": false, "exp": "False. Iapetus is a Titan, son of Uranus and Gaia, not of Cronus. Cronus is Iapetus's brother.", "ref": "ch.3 p.63", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Helen?", "opts": ["Helena", "Iasion", "Hippolytus", "Iris"], "ans": "Helena", "exp": "Helen is the Greek name; the Roman equivalent is Helena.", "ref": "ch.1", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Rhadamanthus is the god/goddess of Underworld judgment.", "ans": true, "exp": "Rhadamanthus is one of the judges of the dead in the Underworld, along with Minos and Aeacus.", "ref": "ch.15", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Clotho", "Persuasion", "Phoebus Apollo", "Necessity", "Lyssa", "Ge-Themis"], "right": ["present", "madness", "Music", "persuasion", "necessity", "earth"], "ans": {"Clotho": "present", "Persuasion": "persuasion", "Phoebus Apollo": "Music", "Necessity": "necessity", "Lyssa": "madness", "Ge-Themis": "earth"}, "exp": "Each god/goddess governs specific domains in Greek mythology: Clotho spins the thread of life (present), Persuasion is the goddess of persuasion, Phoebus Apollo is the god of music, Necessity is the personification of necessity, Lyssa is the goddess of madness, and Ge-Themis is the earth goddess.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Proserpina is the god/goddess of which domain?", "opts": ["shepherds", "Underworld judgment", "underworld", "music"], "ans": "underworld", "exp": "Proserpina governs: underworld.", "ref": "ch.15"}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Aeneas' Descent to the Underworld (Aeneas, guided by the Sibyl, descends...), Anchises was the parent of Aeneas.", "ans": true, "exp": "Anchises is the father of Aeneas, as confirmed in the myth of Aeneas' Descent to the Underworld.", "ref": "ch.9 p.205", "enhanced": true}], [{"t": "sa", "cat": "Parentage", "q": "Who is the parent of Aretus?", "ans": "Nestor", "exp": "Aretus is a son of Nestor, as recorded in the text (ch.6 p.158).", "ref": "ch.6 p.158", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Gaea?", "opts": ["Deianira", "Althaea", "Victoria", "Terra"], "ans": "Terra", "exp": "Gaea is the Greek personification of the Earth; her Roman equivalent is Terra. Deianira is a mortal, Althaea is a mortal, and Victoria is the Roman goddess of victory.", "ref": "ch.3", "enhanced": true}, {"t": "tf", "cat": "Divine Domains", "q": "Poseidon is the god/goddess of horses.", "ans": true, "exp": "Poseidon is the god of the sea, earthquakes, and horses, as stated in the textbook (ch.1).", "ref": "ch.1", "enhanced": true}, {"t": "match", "cat": "Greek Roman Names", "q": "Match each Greek name to its Roman equivalent:", "left": ["Hephaestus", "Aphrodite", "Dionysus", "Charis", "Day", "Night"], "right": ["Hemera", "Bacchus", "Grace", "Vulcan", "Nyx", "Venus"], "ans": {"Hephaestus": "Vulcan", "Aphrodite": "Venus", "Dionysus": "Bacchus", "Charis": "Grace", "Day": "Hemera", "Night": "Nyx"}, "exp": "These are the standard Greek and Roman name equivalences from the textbook: Hephaestus-Vulcan, Aphrodite-Venus, Dionysus-Bacchus, Charis-Grace, Day-Hemera, Night-Nyx.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Epithet", "q": "Which of the following is an epithet of nymphs?", "opts": ["most beautiful of the daughters of Celeus", "beautiful", "rosy-fingered", "deep-bosomed mountain nymphs"], "ans": "deep-bosomed mountain nymphs", "exp": "nymphs is known by the epithet 'deep-bosomed mountain nymphs'.", "ref": "ch.9"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Paris?", "ans": "Priam", "exp": "Paris was the son of Priam, king of Troy, and his wife Hecuba. Before his birth, Hecuba dreamed she gave birth to a flaming torch, which was interpreted as a sign that the child would bring destruction to Troy.", "ref": "ch.19 p.468", "enhanced": true}, {"t": "mc", "cat": "Parentage", "q": "Who is the parent of Aeneas?", "opts": ["Tmolus", "Dante", "Euryale", "Aphrodite"], "ans": "Aphrodite", "exp": "Aeneas was the son of the mortal Anchises and the goddess Aphrodite (Venus). He was a Trojan hero who escaped the fall of Troy and, according to Roman tradition, became the ancestor of the Romans.", "ref": "ch.19 p.475", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Homeric Hymn to Apollo (The hymn describes Apollo's arrival at...), Ares was the lover of Aphrodite.", "ans": true, "exp": "In Greek mythology, Ares, the god of war, was indeed the lover of Aphrodite, the goddess of love. Their affair was discovered by Hephaestus, Aphrodite's husband, who trapped them in a net and exposed them to the other gods.", "ref": "ch.5 p.128", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Orestes and the Three Electras (The story of Orestes' return to Argos...), Zeus was the spouse of Agamemnon.", "ans": false, "exp": "Incorrect. In the myth of Orestes, Agamemnon's wife was Clytemnestra, not Zeus. Zeus is the king of the gods and father of many deities and heroes, but he is not the spouse of Agamemnon.", "ref": "ch.17 p.?", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Cybele is the god/goddess of which domain?", "opts": ["earth", "jealousy", "tragedy", "modesty"], "ans": "earth", "exp": "Cybele governs: earth, fertility, motherhood, nature.", "ref": "ch.3"}, {"t": "tf", "cat": "Divine Domains", "q": "Hours is the god/goddess of seasons.", "ans": true, "exp": "In the Homeric Hymn to Apollo, the Hours (Horae) are goddesses of the seasons, order, and time, often associated with vegetation and natural cycles. They are depicted as attendants of the gods on Olympus.", "ref": "ch.5", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Charis is the god/goddess of which domain?", "opts": ["music", "power", "grace", "travelers"], "ans": "grace", "exp": "Charis governs: grace.", "ref": "ch.5"}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Jupiter", "Lyssa", "Apollo", "Diana", "Lachesis", "Asopus"], "right": ["king of gods", "measuring thread of life", "madness", "hunt", "archery", "river"], "ans": {"Jupiter": "king of gods", "Lyssa": "madness", "Apollo": "archery", "Diana": "hunt", "Lachesis": "measuring thread of life", "Asopus": "river"}, "exp": "Each figure is matched to their domain: Jupiter (king of gods), Lyssa (madness), Apollo (archery), Diana (hunt), Lachesis (measuring thread of life), Asopus (river). These reflect their roles in Greek mythology.", "ref": "", "enhanced": true}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Cybele?", "ans": "Magna Mater", "exp": "Cybele, the Phrygian mother goddess, was identified by the Romans as Magna Mater (Great Mother). Her cult was officially adopted in Rome during the Second Punic War.", "ref": "ch.3", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Nike is the god/goddess of which domain?", "opts": ["judge of the dead", "nature", "victory", "darkness"], "ans": "victory", "exp": "Nike governs: victory.", "ref": "ch.4"}], [{"t": "mc", "cat": "Domain", "q": "Lachesis is the god/goddess of which domain?", "opts": ["fertility", "seasons", "beekeeping", "measuring thread of life"], "ans": "measuring thread of life", "exp": "Lachesis governs: measuring thread of life, past.", "ref": "ch.5"}, {"t": "sa", "cat": "Parentage", "q": "Who is the parent of Myrtilus?", "ans": "Hermes", "exp": "Myrtilus is the son of Hermes. In the myth of the race of Pelops and Oenomaüs, Myrtilus was the charioteer of Oenomaüs whom Pelops bribed to sabotage the king's chariot, leading to Oenomaüs' death.", "ref": "ch.18 p.439", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Muses?", "opts": ["Deiphobus", "Musae", "Aurora", "Amphiaraüs"], "ans": "Musae", "exp": "Muses is the Greek name; the Roman equivalent is Musae.", "ref": "ch.3"}, {"t": "sa", "cat": "Roman Equivalents", "q": "What is the Roman name of Hypnos?", "ans": "Somnus", "exp": "The Roman equivalent of Hypnos is Somnus. Hypnos is the Greek god of sleep, son of Nyx (Night) and Erebus (Darkness).", "ref": "ch.19", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of Deucalion and Pyrrha (After the flood, Deucalion and Pyrrha...), Hellen was the parent of Pyrrha.", "ans": false, "exp": "False. In the myth of Deucalion and Pyrrha, Epimetheus is the father of Pyrrha, not Hellen. Hellen is the son of Deucalion and Pyrrha, and the mythical ancestor of the Hellenes.", "ref": "ch.4 p.99", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Phoebus Apollo?", "opts": ["Aeneas", "Hemera", "Epeus", "Apollo"], "ans": "Apollo", "exp": "Phoebus Apollo is the Greek name; the Roman equivalent is Apollo.", "ref": "ch.15", "enhanced": true}, {"t": "tf", "cat": "Myth Relationships", "q": "In the myth of The Mares of Diomedes (Heracles captured the man-eating mares...), Eurystheus was the spouse of Alcestis.", "ans": false, "exp": "Incorrect. In the myth of The Mares of Diomedes (Heracles captured the man-eating mares...), Admetus married Alcestis.", "ref": "ch.7 p.?", "enhanced": true}, {"t": "match", "cat": "Gods Domains", "q": "Match each god/goddess to their domain:", "left": ["Uranus", "Hypnos", "Eirene", "Aglaea", "Zeus", "Jupiter"], "right": ["grace", "king of gods", "sleep", "peace", "justice", "sky"], "ans": {"Uranus": "sky", "Hypnos": "sleep", "Eirene": "peace", "Aglaea": "grace", "Zeus": "justice", "Jupiter": "king of gods"}, "exp": "Each god/goddess governs specific domains in Greek mythology. Uranus is the sky, Hypnos is sleep, Eirene is peace, Aglaea is grace, Zeus is justice, Jupiter is king of gods.", "ref": "", "enhanced": true}, {"t": "mc", "cat": "Roman Equivalent", "q": "Which Roman god/goddess is equivalent to the Greek Alexander?", "opts": ["Scamander", "Paris", "Dione", "Hector"], "ans": "Paris", "exp": "Alexander is the Greek name; the Roman equivalent is Paris.", "ref": "ch.17", "enhanced": true}, {"t": "mc", "cat": "Domain", "q": "Hera is the god/goddess of which domain?", "opts": ["day", "choral dancing", "childbirth", "beauty"], "ans": "childbirth", "exp": "Hera governs: childbirth, fertility, jealousy, marriage, queen of gods, queen of the gods, queenship, women.", "ref": "ch.2"}, {"t": "sa

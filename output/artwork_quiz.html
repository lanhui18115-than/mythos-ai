var questions = [{"type": "artwork_tf", "artwork": "Saturn Devouring His Children", "description": "Oil on plaster transferred to canvas by Francisco Goya (1820-1822); depicts Cronus cannibalizing his child; part of Las Pinturas Negras.", "image_url": "../data/artwork_images/ART_0012_0.jpg", "question": "Does this artwork depict Cronus?", "correct": true, "explanation": "Yes, Cronus is depicted in this artwork.\n\n\"Saturn Devouring His Children\" is a painting described as: Oil on plaster transferred to canvas by Francisco Goya (1820-1822); depicts Cronus cannibalizing his child; part of Las Pinturas Negras.", "reference": "ch.3", "story": "Cronus, having swallowed his children, was later overthrown by his son Zeus, who forced him to disgorge the other gods. Cronus was then deposed and retired to the Islands of the Blessed.", "visual_desc": "The Titan Kronos is depicted with wild hair and wide, frantic eyes, clutching a pale, headless human figure. He is in the act of consuming the body, which he holds firmly with both hands. The figure is shown against a dark, indistinct background with no clothing or attributes."}, {"type": "artwork_character", "artwork": "Rhea Offers the Stone to Cronus", "description": "Roman copy (c. A.D. 160) of Greek original (4th century B.C.); shows Rhea handing swaddled stone to Cronus.", "image_url": "../data/artwork_images/ART_0013_0.jpg", "question": "Which mythological figure is depicted in this artwork?", "options": ["Cronus", "Odysseus", "Dionysus", "Abduction of Europa"], "correct": "Cronus", "explanation": "This artwork depicts Cronus, Rhea. It is a relief described as: Roman copy (c. A.D. 160) of Greek original (4th century B.C.); shows Rhea handing swaddled stone to Cronus.", "reference": "ch.3 p.72, 73", "story": "Cronus swallowed his children to prevent a prophecy that he would be overthrown by his son. Rhea, with help from Gaea and Uranus, hid Zeus in Crete and gave Cronus a stone wrapped in swaddling clothes to swallow instead. Zeus was raised in a cave on Mount Dicte or Mount Ida.", "visual_desc": "This relief depicts Rhea handing a stone wrapped in swaddling clothes to Cronus. Rhea wears a veil and chiton, while the bearded, seated Cronus is draped in a mantle that covers his head. The scene captures the moment Rhea deceives Cronus to save her son, Zeus."}, {"type": "artwork_tf", "artwork": "Rhea Offers the Stone to Cronus", "description": "Roman copy (c. A.D. 160) of Greek original (4th century B.C.); shows Rhea handing swaddled stone to Cronus.", "image_url": "../data/artwork_images/ART_0013_0.jpg", "question": "Does this artwork depict Helius?", "correct": false, "explanation": "No, this artwork does not depict Helius. It depicts Cronus, Rhea.\n\n\"Rhea Offers the Stone to Cronus\" is a relief described as: Roman copy (c. A.D. 160) of Greek original (4th century B.C.); shows Rhea handing swaddled stone to Cronus.", "reference": "ch.3", "story": "Cronus swallowed his children to prevent a prophecy that he would be overthrown by his son. Rhea, with help from Gaea and Uranus, hid Zeus in Crete and gave Cronus a stone wrapped in swaddling clothes to swallow instead. Zeus was raised in a cave on Mount Dicte or Mount Ida.", "visual_desc": "This relief depicts Rhea handing a stone wrapped in swaddling clothes to Cronus. Rhea wears a veil and chiton, while the bearded, seated Cronus is draped in a mantle that covers his head. The scene captures the moment Rhea deceives Cronus to save her son, Zeus."}, {"type": "artwork_tf", "artwork": "The Forge of Vulcan", "description": "Oil on canvas by Diego Velázquez (1599–1660), depicting Helius telling Hephaestus of Aphrodite's affair with Ares.", "image_url": "../data/artwork_images/ART_0035_0.jpg", "question": "Does this artwork depict Hera?", "correct": false, "explanation": "No, this artwork does not depict Hera. It depicts Hephaestus.\n\n\"The Forge of Vulcan\" is a painting described as: Oil on canvas by Diego Velázquez (1599–1660), depicting Helius telling Hephaestus of Aphrodite's affair with Ares.", "reference": "ch.5", "story": "Hephaestus — craftsmanship, fire, forge (renowned; withered feet)", "visual_desc": "Helius, wearing a laurel wreath and glowing with a halo, stands before Hephaestus and his assistants in a forge. Helius is informing the blacksmiths of the adultery of Aphrodite and Ares. The scene features a glowing metal piece on an anvil, various tools, and scattered armor."}, {"type": "artwork_tf", "artwork": "Ludovisi Mars", "description": "Roman copy of a Greek original (possibly by Skopas) of ca. 340 B.C., marble, showing Mars (Ares) unarmed but holding his sword, with Cupid added by the copyist.", "image_url": "../data/artwork_images/ART_0036_0.jpg", "question": "Does this artwork depict Ares?", "correct": true, "explanation": "Yes, Ares is depicted in this artwork.\n\n\"Ludovisi Mars\" is a sculpture described as: Roman copy of a Greek original (possibly by Skopas) of ca. 340 B.C., marble, showing Mars (Ares) unarmed but holding his sword, with Cupid added by the copyist.", "reference": "ch.5", "story": "Ares — war", "visual_desc": "The sculpture depicts Ares sitting with a small Eros at his feet. Ares rests his hands on his knee, holding a sword, while a shield leans against the rock beside him. He is partially draped in fabric, and the winged Eros looks up toward him."}, {"type": "artwork_tf", "artwork": "Galatea", "description": "Fresco by Raphaël, ca. 1512, in the Sala di Galatea, Villa Farnesina, Rome. Depicts Galatea riding a seashell chariot drawn by dolphins, surrounded by Tritons, lovers, and cupids.", "image_url": "../data/artwork_images/ART_0044_0.jpg", "question": "Does this artwork depict Agave?", "correct": false, "explanation": "No, this artwork does not depict Agave. It depicts Galatea.\n\n\"Galatea\" is a fresco described as: Fresco by Raphaël, ca. 1512, in the Sala di Galatea, Villa Farnesina, Rome. Depicts Galatea riding a seashell chariot drawn by dolphins, surrounded by Tritons, lovers, and cupids.", "reference": "ch.7", "story": "Galatea", "visual_desc": "Galatea stands in a scallop shell chariot pulled by dolphins, surrounded by Tritons and Nereids. Above, Cupid and other winged putti aim bows and arrows. The scene depicts the goddess of love traveling across the sea, accompanied by marine deities and cherubic figures."}, {"type": "artwork_tf", "artwork": "Neptune and Triton", "description": "Marble sculpture by Gian Lorenzo Bernini, 1619. Depicts Neptune striding forward angrily, supported by Triton blowing his conch.", "image_url": "../data/artwork_images/ART_0047_0.jpg", "question": "Does this artwork depict Theoclymenus?", "correct": false, "explanation": "No, this artwork does not depict Theoclymenus. It depicts Neptune.\n\n\"Neptune and Triton\" is a sculpture described as: Marble sculpture by Gian Lorenzo Bernini, 1619. Depicts Neptune striding forward angrily, supported by Triton blowing his conch.", "reference": "ch.7", "story": "Neptune — sea (brother of Jove)", "visual_desc": "The sculpture depicts Poseidon standing over a Triton. Poseidon holds a trident and strides forward, while the Triton kneels below, blowing into a conch shell. Poseidon is identified by his trident and wild, sea-like hair, while the Triton is distinguished by his aquatic, shell-like horn."}, {"type": "artwork_character", "artwork": "Athena Parthenos", "description": "Monumental gold and ivory statue of Athena by Pheidias in the Parthenon, holding Nike, with aegis, shield, spear, and serpent.", "image_url": "../data/artwork_images/ART_0048_0.jpg", "question": "Which mythological figure is depicted in this artwork?", "options": ["Nike", "Galatea", "Neptune", "Hypnos"], "correct": "Nike", "explanation": "This artwork depicts Athena, Medusa, Nike, Pandora. It is a sculpture described as: Monumental gold and ivory statue of Athena by Pheidias in the Parthenon, holding Nike, with aegis, shield, spear, and serpent.", "reference": "ch.8 p.180, 18 ena and Arachne in the background.", "reference": "ch.8", "story": "Athena — craft, crafts, household arts (Cecropian; Pallas; Parthenos)", "visual_desc": "The painting depicts Athena (in a helmet) and Arachne (in a red skirt) competing in a weaving contest. They are surrounded by women spinning wool in a workshop, while a tapestry behind them illustrates a mythological scene with figures in classical attire. Athena wears a helmet and armor."}, {"type": "artwork_tf", "artwork": "Artemis the Huntress", "description": "Roman copy in marble of a Greek bronze of the late fourth century B.C.; height 78 in. Artemis appears as huntress taking an arrow from her quiver and as protectress of animals grasping a leaping stag.", "image_url": "../data/artwork_images/ART_0071_0.jpg", "question": "Does this artwork depict Artemis?", "correct": true, "explanation": "Yes, Artemis is depicted in this artwork.\n\n\"Artemis the Huntress\" is a sculpture described as: Roman copy in marble of a Greek bronze of the late fourth century B.C.; height 78 in. Artemis appears as huntress taking an arrow from her quiver and as protectress of animals grasping a leaping stag.", "reference": "ch.10", "story": "Artemis — archery, chastity, childbirth (Artemis who delights in her arrows; Cynthia; Dictynna)", "visual_desc": "This marble statue depicts Artemis, the Greek goddess of the hunt. She is shown walking forward while holding the antlers of a small deer with her left hand and reaching for an arrow in the quiver on her back. She wears a short, belted chiton and sandals, with a crescent diadem in her hair."}, {"type": "artwork_tf", "artwork": "Christus Apollo", "description": "Vault mosaic from a third-century A.D. Christian tomb beneath St. Peter's Basilica, showing Christ with attributes of the sun-god (Apollo or Helius), ascending in a chariot drawn by four white horses, with ivy of Dionysus in the background.", "image_url": "../data/artwork_images/ART_0082_0.jpg", "question": "Does this artwork depict Niinnion?", "correct": false, "explanation": "No, this artwork does not depict Niinnion. It depicts Apollo.\n\n\"Christus Apollo\" is a mosaic described as: Vault mosaic from a third-century A.D. Christian tomb beneath St. Peter's Basilica, showing Christ with attributes of the sun-god (Apollo or Helius), ascending in a chariot drawn by four white horses,", "reference": "ch.11", "story": "Apollo — archery, healing, justice (Paean; Phoebus; Phoebus Apollo)", "visual_desc": "The figure is Helios, depicted with a radiant nimbus around his head. He is driving a chariot pulled by two horses across a golden background adorned with vine motifs. Key attributes include his solar crown and the chariot, which symbolize his role as the personification of the sun."}, {"type": "artwork_tf", "artwork": "Apollo Belvedere", "description": "Roman marble copy, possibly second century A.D., of a fourth-century B.C. Greek bronze. Height 94½ in. Apollo strides ahead, left hand would have held a bow. Discovered in Rome before 1509, housed in the Vatican's Cortile del Belvedere.", "image_url": "../data/artwork_images/ART_0083_0.jpg", "question": "Does this artwork depict Telemachus?", "correct": false, "explanation": "No, this artwork does not depict Telemachus. It depicts Apollo.\n\n\"Apollo Belvedere\" is a sculpture described as: Roman marble copy, possibly second century A.D., of a fourth-century B.C. Greek bronze. Height 94½ in. Apollo strides ahead, left hand would have held a bow. Discovered in Rome before 1509, housed in ", "reference": "ch.11", "story": "Apollo — archery, healing, justice (Paean; Phoebus; Phoebus Apollo)", "visual_desc": "This marble statue depicts the god Apollo. He stands in a contrapposto pose, extending his left arm while draped in a cloak fastened at his shoulder. He is identified by the serpent coiled around the tree trunk support at his side, a common attribute associated with his oracular powers."}, {"type": "artwork_character", "artwork": "Hermes in Crib with Zeus, Apollo, and Maia", "description": "Black-figure hydria from Caere, ca. 500 B.C., 17 in. in height. Depicts Apollo accusing baby Hermes before Zeus and Maia, with stolen cattle behind a tree.", "image_url": "../data/artwork_images/ART_0088_0.jpg", "question": "Which mythological figure is depicted in this artwork?", "options": ["Hermes and the Infant Dionysus", "Maia", "Ajax the Greater", "Jason Takes the Golden Fleece"], "correct": "Maia", "explanation": "This artwork depicts Apollo, Hermes, Maia, Zeus. It is a vase described as: Black-figure hydria from Caere, ca. 500 B.C., 17 in. in height. Depicts Apollo accusing baby Hermes before Zeus and Maia, with stolen cattle behind a tree.", "reference": "ch.12 p.285", "story": "Zeus — justice, king of gods, king of the gods (Hecalus; King; Olympian) \\ Hermes — commerce, fire, guide (Cyllenian; Psychopompos; bearer of a golden staff) \\ Apollo — archery, healing, justice (Paean; Phoebus; Phoebus Apollo) \\ Maia (daughter of Atlas; nymph of the beautiful hair)", "visual_desc": "The scene depicts Hermes, identifiable by his traveler's hat (petasos) and staff (kerykeion), standing near a group of cattle. He appears to be herding or guarding the animals, which are positioned beneath a tree where a small hare is perched."}, {"type": "artwork_tf", "artwork": "Hermes in Crib with Zeus, Apollo, and Maia", "description": "Black-figure hydria from Caere, ca. 500 B.C., 17 in. in height. Depicts Apollo accusing baby Hermes before Zeus and Maia, with stolen cattle behind a tree.", "image_url": "../data/artwork_images/ART_0088_0.jpg", "question": "Does this artwork depict Maia?", "correct": true, "explanation": "Yes, Maia is depicted in this artwork.\n\n\"Hermes in Crib with Zeus, Apollo, and Maia\" is a vase described as: Black-figure hydria from Caere, ca. 500 B.C., 17 in. in height. Depicts Apollo accusing baby Hermes before Zeus and Maia, with stolen cattle behind a tree.", "reference": "ch.12", "story": "Zeus — var answered = {};
var score = {correct:0, answered:0};

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

function render() {
  var html = '';
  questions.forEach(function(q, i) {
    var answeredFlag = answered[i] !== undefined;
    var isCorrect = answeredFlag && (q.type === 'artwork_tf' ? (answered[i] === 'True') === q.correct : answered[i] === q.correct);
    html += '<div class="q-card" data-type="' + q.type + '">';
    html += '<div class="q-label">' + typeLabel(q.type) + '</div>';

    // Image (always visible)
    if (q.image_url) {
      html += '<div class="q-img-wrap"><img class="q-img" src="' + esc(q.image_url) + '" alt="artwork"></div>';
    } else {
      html += '<div class="q-img-wrap q-img-missing"><span class="q-img-placeholder">[教材图片未提取]</span></div>';
    }

    // Question (always visible)
    html += '<div class="q-text">' + (i+1) + '. ' + esc(q.question) + '</div>';

    // Options
    if (q.type === 'artwork_character') {
      html += '<div class="opts">';
      q.options.forEach(function(o) {
        var cls = '';
        var extra = '';
        if (answeredFlag) {
          cls = 'disabled';
          if (o === q.correct) cls += ' correct';
          else if (answered[i] === o) cls += ' wrong';
          if (o === q.correct) extra = ' <span style="color:#2ecc71">&#10003;</span>';
          else if (answered[i] === o) extra = ' <span style="color:#e74c3c">&#10007;</span>';
        }
        html += '<label class="' + cls + '" data-q="' + i + '" data-val="' + esc(o) + '">';
        html += '<input type="radio" name="q' + i + '" ' + (answeredFlag ? 'disabled' : '') + '>';
        html += esc(o) + extra + '</label>';
      });
      html += '</div>';
    }

    if (q.type === 'artwork_tf') {
      html += '<div class="tf-opts">';
      ['True', 'False'].forEach(function(v) {
        var cls = 'tf-btn';
        if (answeredFlag) {
          var isCorrectChoice = (v === 'True') === q.correct;
          var isUserChoice = answered[i] === v;
          if (isCorrectChoice) cls += ' correct-btn';
          else if (isUserChoice) cls += ' wrong-btn';
          else cls += ' dimmed-btn';
          cls += ' disabled';
        }
        html += '<button class="' + cls + '" data-q="' + i + '" data-val="' + v + '" ' + (answeredFlag ? 'disabled' : '') + '>' + v + '</button>';
      });
      html += '</div>';
    }

    // Answer feedback header (shown after answering)
    if (answeredFlag) {
      html += '<div class="q-feedback ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '✅ 正确！' : '❌ 错误') + '</div>';
    }

    // Revealed info section (shown after answering)
    if (answeredFlag) {
      html += '<div class="q-reveal">';
      html += '<div class="q-artwork">' + esc(q.artwork) + '</div>';
      if (q.visual_desc) {
        html += '<div class="q-visual-desc">' + esc(q.visual_desc) + '</div>';
      }
      if (q.description) {
        html += '<div class="q-desc">' + esc(q.description.slice(0, 250)) + '</div>';
      }
      if (q.story) {
        html += '<div class="q-story">' + esc(q.story) + '</div>';
      }
      html += '<div class="q-explanation">' + esc(q.explanation) + '</div>';
      if (q.reference) html += '<div class="ref">出处: ' + esc(q.reference) + '</div>';
      html += '</div>';
    }

    // Reveal button
    if (!answeredFlag) {
      html += '<button class="reveal-btn" data-q="' + i + '">显示答案</button>';
    }

    html += '</div>';
  });
  document.getElementById('quiz').innerHTML = html;
  updateScore();
}

function typeLabel(t) {
  return {'artwork_character':'角色识别','artwork_tf':'判断'}[t]||t;
}

function handleQuizClick(e) {
  var target = e.target;
  if (target.classList.contains('q-img')) {
    target.classList.toggle('q-img-expanded');
    return;
  }
  var qIdx = target.getAttribute('data-q');
  if (qIdx === null) return;
  qIdx = parseInt(qIdx);
  var val = target.getAttribute('data-val');

  if (target.tagName === 'LABEL' && val !== null && answered[qIdx] === undefined) {
    answered[qIdx] = val;
    if (val === questions[qIdx].correct) score.correct++;
    score.answered++;
    render();
    document.getElementById('expl-' + qIdx).style.display = 'block';
    return;
  }

  if (target.tagName === 'BUTTON' && target.classList.contains('tf-btn') && val !== null && answered[qIdx] === undefined) {
    answered[qIdx] = val;
    if ((val === 'True') === questions[qIdx].correct) score.correct++;
    score.answered++;
    render();
    document.getElementById('expl-' + qIdx).style.display = 'block';
    return;
  }

  if (target.classList.contains('reveal-btn')) {
    var expl = document.getElementById('expl-' + qIdx);
    if (expl) expl.style.display = expl.style.display === 'none' ? 'block' : 'none';
  }
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent = '已答: ' + score.answered + ' / ' + questions.length + ' 正确: ' + score.correct;
}

function filterType(type, btn) {
  document.querySelectorAll('.q-card').forEach(function(el) {
    el.style.display = el.getAttribute('data-type') === type ? 'block' : 'none';
  });
  document.querySelectorAll('.controls button').forEach(function(b) { b.classList.remove('primary'); });
  btn.classList.add('primary');
}

function showAll() {
  document.querySelectorAll('.q-card').forEach(function(el) { el.style.display = 'block'; });
  document.querySelectorAll('.controls button').forEach(function(b) { b.classList.remove('primary'); });
  document.querySelector('.controls button:first-child').classList.add('primary');
}

document.getElementById('quiz').addEventListener('click', handleQuizClick);
render();
</script>
